apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-views-pods
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  k8s-views-pods.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [],
              "type": "dashboard"
            },
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "$${datasource}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "#ff7b00",
            "name": "Pod restarts",
            "target": {
              "editorMode": "code",
              "expr": "changes(kube_pod_container_status_restarts_total{namespace=~\"$namespace\",pod=~\"$pod\"}[$__interval]) > 0",
              "format": "time_series",
              "range": true,
              "refId": "A",
              "step": "1m",
              "tagKeys": "namespace,pod,container",
              "textFormat": "namespace={{namespace}}; restart count changed",
              "titleFormat": "{{pod}} / {{container}} restarted"
            }
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "$${datasource}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "#2f80ed",
            "name": "Deployment updates",
            "target": {
              "editorMode": "code",
              "expr": "changes(kube_deployment_metadata_generation{namespace=~\"$namespace\"}[$__interval]) > 0",
              "format": "time_series",
              "range": true,
              "refId": "A",
              "step": "1m",
              "tagKeys": "namespace,deployment",
              "textFormat": "namespace={{namespace}}; deployment generation changed",
              "titleFormat": "{{deployment}} updated"
            }
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 67,
          "title": "Information",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "One readable row per selected pod, including namespace, node, IP, creator, priority, and QoS class.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true,
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  }
                ]
              }
            }
          },
          "gridPos": {
            "h": 12,
            "w": 16,
            "x": 0,
            "y": 1
          },
          "id": 65,
          "options": {
            "cellHeight": "sm",
            "enablePagination": true,
            "showHeader": true
          },
          "pluginVersion": "13.1.1",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${datasource}"
              },
              "expr": "max by (namespace, pod, node, pod_ip, host_ip, created_by_kind, created_by_name, priority_class, qos_class) (((max by (namespace, pod, node, pod_ip, host_ip, created_by_kind, created_by_name, priority_class, uid) (kube_pod_info{namespace=\"$namespace\", pod=~\"$pod\"}) * on (namespace, pod, uid) group_left(qos_class) (max by (namespace, pod, uid, qos_class) (kube_pod_status_qos_class{namespace=\"$namespace\", pod=~\"$pod\"}) == 1)) or (max by (namespace, pod, node, pod_ip, host_ip, created_by_kind, created_by_name, priority_class, uid) (kube_pod_info{namespace=\"$namespace\", pod=~\"$pod\"}) unless on (namespace, pod, uid) (max by (namespace, pod, uid, qos_class) (kube_pod_status_qos_class{namespace=\"$namespace\", pod=~\"$pod\"}) == 1))))",
              "format": "table",
              "instant": true,
              "legendFormat": "{{namespace}}/{{pod}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Pod Identity",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "Value #A": true,
                  "__name__": true
                },
                "indexByName": {
                  "created_by_kind": 5,
                  "created_by_name": 6,
                  "host_ip": 4,
                  "namespace": 1,
                  "node": 2,
                  "pod": 0,
                  "pod_ip": 3,
                  "priority_class": 7,
                  "qos_class": 8
                },
                "renameByName": {
                  "created_by_kind": "Created by kind",
                  "created_by_name": "Created by name",
                  "host_ip": "Host IP",
                  "namespace": "Namespace",
                  "node": "Node",
                  "pod": "Pod",
                  "pod_ip": "Pod IP",
                  "priority_class": "Priority class",
                  "qos_class": "QoS class"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${datasource}"
          },
          "description": "Selected containers with a recorded last termination reason.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true,
                "footer": {
                  "reducers": [
                    "countAll"
                  ]
                },
                "inspect": false
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 12,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "id": 66,
          "options": {
            "cellHeight": "sm",
            "enablePagination": true,
            "showHeader": true
          },
          "pluginVersion": "13.1.1",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${datasource}"
              },
              "expr": "kube_pod_container_status_last_terminated_reason{namespace=\"$namespace\", pod=~\"$pod\"}",
              "format": "table",
              "instant": true,
              "legendFormat": "{{namespace}}/{{pod}} · {{container}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Recent Container Terminations",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "namespace": false,
                  "pod": false,
                  "service": true
                },
                "indexByName": {},
                "renameByName": {
                  "Value": "Active",
                  "container": "Container",
                  "reason": "Reason"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
