# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-litellm
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  litellm.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "LiteLLM Prometheus metrics. Client panels use the raw User-Agent label; other caller identity labels remain excluded.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Requests for the selected time range and dashboard filters.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "id": 1001,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "13.2.4",
          "targets": [
            {
              "expr": "sum(increase(litellm_proxy_total_requests_metric_total{api_key_alias=~\"$consumer\",requested_model=~\"$model\",api_provider=~\"$provider\"}[$__range]))",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Requests",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Error rate for the selected time range and dashboard filters.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "id": 1002,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "13.2.4",
          "targets": [
            {
              "expr": "100 * sum(increase(litellm_proxy_failed_requests_metric_total{api_key_alias=~\"$consumer\",requested_model=~\"$model\",api_provider=~\"$provider\"}[$__range])) / clamp_min(sum(increase(litellm_proxy_total_requests_metric_total{api_key_alias=~\"$consumer\",requested_model=~\"$model\",api_provider=~\"$provider\"}[$__range])), 1)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Error rate",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Spend for the selected time range and dashboard filters.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "currencyUSD"
