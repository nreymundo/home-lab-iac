            {
              "expr": "sum(increase(litellm_spend_metric_total{api_key_alias=~\"$consumer\",requested_model=~\"$model\",api_provider=~\"$provider\"}[$__range]))",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Spend",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
