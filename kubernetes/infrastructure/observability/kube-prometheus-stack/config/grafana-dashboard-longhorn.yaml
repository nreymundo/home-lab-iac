apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-longhorn
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  longhorn.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "High-level view of Longhorn - useful for monitoring, alerting and troubleshooting.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 61,
          "panels": [],
          "title": "Overview & Volume Health",
