            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(longhorn_node_storage_capacity_bytes) or on() vector(0)",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Total Physical Capacity",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Physical storage currently used across all nodes.",
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "bytes"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 5
          },
          "id": 56,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(longhorn_node_storage_usage_bytes) or on() vector(0)",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Physical Used",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Longhorn storage reserved and unavailable for scheduling.",
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "bytes"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 5
          },
          "id": 57,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(longhorn_node_storage_reservation_bytes) or on() vector(0)",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Reserved Capacity",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "True schedulable headroom: capacity minus physical usage minus reservation.",
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "bytes"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 5
          },
          "id": 58,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum(longhorn_node_storage_capacity_bytes) - sum(longhorn_node_storage_usage_bytes) - sum(longhorn_node_storage_reservation_bytes)) or on() vector(0)",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Schedulable Headroom",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Physical Longhorn storage by node. Headroom is capacity minus usage minus reservation.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "decimals": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "bytes"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Capacity"
                },
                "properties": [
                  {
                    "id": "custom.footer.reducers",
                    "value": [
                      "sum"
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Used"
                },
                "properties": [
                  {
                    "id": "custom.footer.reducers",
                    "value": [
                      "sum"
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Reserved"
                },
                "properties": [
                  {
                    "id": "custom.footer.reducers",
                    "value": [
                      "sum"
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Headroom"
                },
                "properties": [
                  {
                    "id": "custom.footer.reducers",
                    "value": [
                      "sum"
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Used %"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "custom.footer.reducers",
                    "value": []
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "id": 59,
          "options": {
            "cellHeight": "sm",
            "enablePagination": false,
            "showHeader": true
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "longhorn_node_storage_capacity_bytes",
              "format": "table",
              "instant": true,
              "legendFormat": "{{node}}",
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "longhorn_node_storage_usage_bytes",
              "format": "table",
              "instant": true,
              "legendFormat": "{{node}}",
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "longhorn_node_storage_reservation_bytes",
              "format": "table",
              "instant": true,
              "legendFormat": "{{node}}",
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "longhorn_node_storage_capacity_bytes - longhorn_node_storage_usage_bytes - longhorn_node_storage_reservation_bytes",
              "format": "table",
              "instant": true,
              "legendFormat": "{{node}}",
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes",
              "format": "table",
              "instant": true,
              "legendFormat": "{{node}}",
              "range": false,
              "refId": "E"
            }
          ],
          "title": "Node Storage",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "node",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
