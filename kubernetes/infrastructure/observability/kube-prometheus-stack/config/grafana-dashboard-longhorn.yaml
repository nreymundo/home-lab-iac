                "uid": "prometheus"
              },
              "expr": "count(longhorn_volume_state{state=\"detached\"} == 1) or on() vector(0)",
              "interval": "",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Detached Volumes",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Degraded volumes are volumes that have the number of healthy replicas smaller than the expected number of replicas. e.g. User creates a volume with 2 replicas but 1 replicas is failed.",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            }
          },
          "gridPos": {
            "h": 4,
