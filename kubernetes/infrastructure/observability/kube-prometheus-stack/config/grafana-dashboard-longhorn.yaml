              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(longhorn_volume_state{state=\"attached\"} == 1) or on() vector(0)",
              "interval": "",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Attached Volumes",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Detached volumes are volumes that aren't currently attaching to a node",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "yellow",
