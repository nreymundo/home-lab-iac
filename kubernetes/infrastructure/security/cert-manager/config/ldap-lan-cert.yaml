apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ldap-lan
  namespace: cert-manager
spec:
  secretName: ldap-lan-tls
  secretTemplate:
    annotations:
      replicator.v1.mittwald.de/replicate-to: "authentik"
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  dnsNames:
    - "ldap.lan.${CLUSTER_DOMAIN}"
