  525-litellm.yaml: |
    version: 1
    metadata:
      name: litellm-sso
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        state: present
        identifiers:
          name: "LiteLLM Admin"
        attrs:
          is_superuser: false
          parent: null
          users:
            - !Find [authentik_core.user, [username, !Env AK_BLUEPRINT_USERNAME]]

      - model: authentik_core.group
        state: present
        identifiers:
          name: "LiteLLM User"
        attrs:
          is_superuser: false
          parent: null

      - model: authentik_providers_oauth2.scopemapping
        id: litellm-role-scope
        identifiers:
          name: "LiteLLM Role Scope"
        attrs:
          scope_name: litellm
          description: "LiteLLM role claim based on group membership"
          expression: |
            litellm_claims = {}
            if request.user.ak_groups.filter(name="LiteLLM Admin").exists():
                litellm_claims["litellm_role"] = "proxy_admin"
            elif request.user.ak_groups.filter(name="LiteLLM User").exists():
                litellm_claims["litellm_role"] = "internal_user"
            return litellm_claims

      - model: authentik_providers_oauth2.oauth2provider
        id: litellm-provider
        identifiers:
          name: "LiteLLM"
        attrs:
          client_id: !Env LITELLM_CLIENT_ID
          client_secret: !Env LITELLM_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          jwt_algorithm: RS256
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          client_type: confidential
          client_authentication_method: client_secret_post
          redirect_uris:
            - url: "https://litellm.lan.${CLUSTER_DOMAIN}/sso/callback"
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !KeyOf litellm-role-scope

      - model: authentik_core.application
        identifiers:
          slug: "litellm"
        attrs:
          name: "LiteLLM"
          icon: "https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/litlellm.svg"
          provider: !KeyOf litellm-provider
          group: "Kubernetes"
          meta_launch_url: "https://litellm.lan.${CLUSTER_DOMAIN}/ui"

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, "litellm"]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, "LiteLLM User"]]

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, "litellm"]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, "LiteLLM Admin"]]

