          app: !KeyOf proxmox-application
          name: pve-admins

      # Grant the pve-admins entitlement to Proxmox Admins members
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf proxmox-admin-entitlement
          order: 10
        attrs:
          group: !KeyOf proxmox-admins

