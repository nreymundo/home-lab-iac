  540-tautulli.yaml: |
    version: 1
    metadata:
      name: tautulli-proxy
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Tautulli users group
      - model: authentik_core.group
        state: present
        id: tautulli-users
        identifiers:
          name: "Tautulli users"
        attrs:
          is_superuser: false
          parent: null
          users:
            - !Find [authentik_core.user, [username, !Env AK_BLUEPRINT_USERNAME]]

      # Custom scope mapping that injects the HTTP basic auth Authorization
      # header from server env at token issuance (mirrors Discord/Kopia/Llama behavior).
      - model: authentik_providers_oauth2.scopemapping
        state: present
        id: tautulli-auth-mapping
        identifiers:
          name: "Tautulli Auth Mapping"
        attrs:
          scope_name: tautulli-auth
          description: "Injects HTTP basic auth header for Tautulli proxy"
          expression: |
            import os
            import base64
            user = os.environ.get("TAUTULLI_BASIC_AUTH_USER", "")
            password = os.environ.get("TAUTULLI_BASIC_AUTH_PASSWORD", "")
            headers = {}
            if user and password:
                token = base64.b64encode((user + ":" + password).encode()).decode()
                headers["Authorization"] = "Basic " + token
            return {
                "ak_proxy": {
                    "user_attributes": {
                        "additionalHeaders": headers
                    }
                }
            }

      # Tautulli Proxy Provider (genuine proxy mode)
      - model: authentik_providers_proxy.proxyprovider
        id: tautulli-provider
        identifiers:
          name: "Tautulli"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: "https://tautulli.lan.${CLUSTER_DOMAIN}"
          internal_host: "http://tautulli.media.svc.cluster.local:8181"
          internal_host_ssl_validation: true
          basic_auth_enabled: false
          basic_auth_user_attribute: ""
          basic_auth_password_attribute: ""
          access_token_validity: "hours=24"
          refresh_token_validity: "days=30"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "ak-proxy"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "Tautulli Auth Mapping"]]

      # Tautulli Application
      - model: authentik_core.application
        identifiers:
          slug: "tautulli"
        attrs:
          name: "Tautulli"
          icon: "https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/tautulli.svg"
          provider: !KeyOf tautulli-provider
          group: "Kubernetes"

      # Restrict access to Tautulli users
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, "tautulli"]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, "Tautulli users"]]

  900-ldap.yaml: |
    version: 1
    metadata:
      name: ldap-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # LDAP search service account
      - model: authentik_core.user
        id: ldap-search-user
        identifiers:
          username: "ldap-search"
        attrs:
          username: "ldap-search"
          name: "LDAP Search Account"
          is_active: true
          path: "goauthentik.io/service-accounts"
          attributes:
            goauthentik.io/user/service-account: true
            goauthentik.io/user/token-expires: false
          password: !Env AK_LDAP_SEARCH_PASSWORD
          permissions:
            - authentik_providers_ldap.search_full_directory


      # LDAP authentication password stage
      - model: authentik_stages_password.passwordstage
        id: ldap-authentication-password
        identifiers:
          name: "ldap-authentication-password"
        attrs:
          name: "ldap-authentication-password"
          backends:
            - "authentik.core.auth.InbuiltBackend"
          configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]
          failed_attempts_before_cancel: 5

      # LDAP authentication identification stage
      - model: authentik_stages_identification.identificationstage
        id: ldap-authentication-identification
        identifiers:
          name: "ldap-authentication-identification"
        attrs:
          name: "ldap-authentication-identification"
          user_fields:
            - "username"
            - "email"
          password_stage: !KeyOf ldap-authentication-password
          case_insensitive_matching: true
          pretend_user_exists: true
          show_matched_user: true

      # LDAP authentication login stage
      - model: authentik_stages_user_login.userloginstage
        id: ldap-authentication-login
        identifiers:
          name: "ldap-authentication-login"
        attrs:
          name: "ldap-authentication-login"
          session_duration: "seconds=0"
          remember_me_offset: "seconds=0"

      # LDAP authentication flow
      - model: authentik_flows.flow
        id: ldap-authentication-flow
        identifiers:
          slug: "ldap-authentication-flow"
        attrs:
          name: "ldap-authentication-flow"
          title: "LDAP authentication flow"
          slug: "ldap-authentication-flow"
          designation: "authentication"
          authentication: "none"
          denied_action: "message_continue"
          policy_engine_mode: "any"

      # LDAP flow identification stage binding
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf ldap-authentication-flow
          stage: !KeyOf ldap-authentication-identification
          order: 10
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: "retry"
          policy_engine_mode: "any"

      # LDAP flow login stage binding
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf ldap-authentication-flow
          stage: !KeyOf ldap-authentication-login
          order: 30
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: "retry"
          policy_engine_mode: "any"

      # LDAP provider
      - model: authentik_providers_ldap.ldapprovider
        id: ldap-provider
        identifiers:
          name: "LDAP"
        attrs:
          name: "LDAP"
          authorization_flow: !KeyOf ldap-authentication-flow
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          certificate: !Find [authentik_crypto.certificatekeypair, [managed, "goauthentik.io/crypto/discovered/ldap-lan"]]
          tls_server_name: "ldap.lan.${CLUSTER_DOMAIN}"
          mfa_support: false
          bind_mode: "direct"
          search_mode: "direct"
          base_dn: "dc=home,dc=lan"
          uid_start_number: 2000
          gid_start_number: 4000

      # LDAP application
      - model: authentik_core.application
        id: ldap-application
        identifiers:
          slug: "ldap"
        attrs:
          name: "LDAP"
          provider: !KeyOf ldap-provider
          group: "Kubernetes"
          policy_engine_mode: "any"

      # LDAP outpost
      - model: authentik_outposts.outpost
        id: ldap-outpost
        identifiers:
          name: "ldap-outpost"
        attrs:
          type: "ldap"
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, "Local Kubernetes Cluster"]]
          providers:
            - !KeyOf ldap-provider
          config:
            log_level: info
            authentik_host: "http://authentik-server.authentik.svc.cluster.local"
            object_naming_template: "ak-outpost-%(name)s"
            kubernetes_namespace: authentik
            kubernetes_replicas: 1
            kubernetes_service_type: LoadBalancer
            kubernetes_json_patches:
              service:
                # Static MetalLB address from the production L2 pool.
                - op: add
                  path: /spec/loadBalancerIP
                  value: "${LDAP_LB_IP}"
                # Restrict exposure to the OPNsense router only.
                - op: add
                  path: /spec/loadBalancerSourceRanges
                  value:
                    - "${OPNSENSE_IP}/32"
                - op: add
                  path: /spec/externalTrafficPolicy
                  value: Local
                # Ensure the annotations map exists before adding the
                # ExternalDNS hostname used to publish ldap.lan.${CLUSTER_DOMAIN}.
                - op: add
                  path: /metadata/annotations
                  value: {}
                - op: add
                  path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
                  value: "ldap.lan.${CLUSTER_DOMAIN}"

  999-outpost.yaml: |
    version: 1
    metadata:
      name: outpost-assembly
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Shared proxy outpost for all proxy providers
      # IMPORTANT: This MUST be the last blueprint to run (99- prefix)
      # All proxy providers must be defined BEFORE this outpost is created
      # Blueprint attrs REPLACE entire objects, not merge - defining outpost
      # in multiple files will wipe configuration from earlier definitions
      - model: authentik_outposts.outpost
        identifiers:
          name: "gatekeeper-proxy"
        attrs:
          type: "proxy"
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, "Local Kubernetes Cluster"]]
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, "Traefik-Gatekeeper"]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, "Frigate"]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, "Discord Main"]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, "Discord Alternate"]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, "Kopia"]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, "Llama"]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, "Tautulli"]]
          config:
            authentik_host: "http://authentik-server.authentik.svc.cluster.local"
            authentik_host_browser: "https://sso.${CLUSTER_DOMAIN}"
            log_level: debug
            object_naming_template: "ak-outpost-%(name)s"
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP
            kubernetes_ingress_secret_name: wildcard-cluster-domain-tls
            kubernetes_disabled_components:
              - traefik middleware
            kubernetes_json_patches:
              deployment:
                # Force a managed outpost rollout when the shared forward-domain
                # cookie scope changes; authentik only applies provider
                # cookie_domain to the proxy session store at process start.
                - op: add
                  path: /spec/template/metadata/labels/authentik-cookie-domain
                  value: "${CLUSTER_DOMAIN}"
            cookie_token_duration: 86400
