apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-bootstrap
  namespace: authentik
data:
  100-bootstrap.yaml: |
    version: 1
    metadata:
      name: homelab-bootstrap
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # 1. Create the Admin User
      - model: authentik_core.user
        state: present
        identifiers:
          username: !Env AK_BLUEPRINT_USERNAME
        attrs:
          name: !Env AK_BLUEPRINT_NAME
          email: !Env AK_BLUEPRINT_EMAIL
          is_active: true
          is_superuser: true  # This ensures the Admin Console is visible
          password: !Env AK_BLUEPRINT_USER_PASSWORD
          attributes:
            avatar: !Env AK_BLUEPRINT_USER_AVATAR

      # 2. Ensure user is in the "authentik Admins" group
      - model: authentik_core.group
        identifiers:
          name: "authentik Admins"
        attrs:
          users:
            - !Find [authentik_core.user, [username, !Env AK_BLUEPRINT_USERNAME]]

      # 3. Define the Proxy Provider
      - model: authentik_providers_proxy.proxyprovider
        id: proxy-provider
        identifiers:
          name: "Traefik-Gatekeeper"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_domain
          external_host: "https://sso.${CLUSTER_DOMAIN}"
          domain: "${CLUSTER_DOMAIN}"
          cookie_domain: ".${CLUSTER_DOMAIN}"
          internal_host: ""
          internal_host_ssl_validation: true
          skip_path_regex: ""
          access_token_validity: "hours=24"
          refresh_token_validity: "days=30"

      # 4. Define the Application
      - model: authentik_core.application
        identifiers:
          slug: "gatekeeper"
        attrs:
          name: "Gatekeeper"
          icon: "https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/authentik.svg"
          provider: !KeyOf proxy-provider
          group: "Kubernetes"

  105-shared-scopes.yaml: |
    version: 1
    metadata:
      name: shared-scope-mappings
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Generic, cross-blueprint scope mappings shared by multiple applications.
      - model: authentik_providers_oauth2.scopemapping
        state: present
        id: shared-email-verified-scope
        identifiers:
          name: "Email (verified)"
        attrs:
          scope_name: email
          description: "Generic email scope mapping with verified flag"
          expression: |
            return {"email": request.user.email, "email_verified": True}

  110-proxy-scope-mapping.yaml: |
    version: 1
    metadata:
      name: proxy-scope-mapping
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Default ak-proxy scope mapping used by proxy providers
      - model: authentik_providers_oauth2.scopemapping
        state: present
        id: ak-proxy-mapping
        identifiers:
          scope_name: "ak-proxy"
        attrs:
          name: "Proxy Outpost"
          description: "Default proxy scope mapping"
          expression: |
            return {
                "ak_proxy": {
                    "user_attributes": {
                        "username": request.user.username,
                        "email": request.user.email,
                        "name": request.user.name,
                        "uid": str(request.user.uuid),
                        "groups": [g.name for g in request.user.ak_groups.all()],
                    }
                }
            }

  120-netbird.yaml: |
    version: 1
    metadata:
      name: netbird-sso
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        id: netbird-admins
        identifiers:
          name: "NetBird Admins"
        attrs:
          is_superuser: false
          parent: null
          users:
            - !Find [authentik_core.user, [username, !Env AK_BLUEPRINT_USERNAME]]

      - model: authentik_core.group
        id: netbird-users
        identifiers:
          name: "NetBird Users"
        attrs:
          is_superuser: false
          parent: null

      - model: authentik_providers_oauth2.oauth2provider
        id: netbird-provider
        identifiers:
          name: "NetBird"
        attrs:
          client_id: !Env NETBIRD_CLIENT_ID
          client_secret: !Env NETBIRD_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          jwt_algorithm: RS256
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          client_type: confidential
          grant_types:
            - authorization_code
          client_authentication_method: client_secret_post
          include_claims_in_id_token: true
          redirect_uris:
            - url: "https://netbird.${CLUSTER_DOMAIN}/oauth2/callback"
              matching_mode: strict
            - url: "https://netbird.${CLUSTER_DOMAIN}/oauth2/logout/callback"
              matching_mode: strict
              redirect_uri_type: logout
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        id: netbird-application
        identifiers:
          slug: "netbird"
        attrs:
          name: "NetBird"
          icon: "https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/netbird.svg"
          provider: !KeyOf netbird-provider
          group: "Local Services"

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf netbird-application
          order: 0
        attrs:
          group: !KeyOf netbird-admins

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf netbird-application
          order: 1
        attrs:
          group: !KeyOf netbird-users

  200-grafana.yaml: |
