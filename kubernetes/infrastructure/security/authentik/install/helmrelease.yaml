apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  timeout: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: authentik
      # renovate: datasource=helm depName=authentik registryUrl=https://charts.goauthentik.io
      version: "2026.5.6"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  values:
    fullnameOverride: authentik

    global:
      envFrom:
        - secretRef:
            name: authentik-env
      env:
        - name: AUTHENTIK_HOST
          value: "https://sso.${CLUSTER_DOMAIN}"
        - name: CLUSTER_DOMAIN
          value: "${CLUSTER_DOMAIN}"
        - name: ACME_EMAIL
          value: "${ACME_EMAIL}"
        - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_IPS
          value: "10.0.0.0/8"

        # Email/SMTP configuration (username/password come from authentik-env secret)
        - name: AUTHENTIK_EMAIL__HOST
          value: "mail-eu.smtp2go.com"
        - name: AUTHENTIK_EMAIL__PORT
          value: "587"
        - name: AUTHENTIK_EMAIL__USE_TLS
          value: "true"
        - name: AUTHENTIK_EMAIL__USE_SSL
          value: "false"
        - name: AUTHENTIK_EMAIL__TIMEOUT
          value: "30"
        - name: AUTHENTIK_EMAIL__FROM
          value: "authentik@${CLUSTER_DOMAIN}"
        # SSO Credentials for Blueprint
        - name: GRAFANA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: grafana-sso-secret
              key: CLIENT_ID
        - name: GRAFANA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-sso-secret
              key: CLIENT_SECRET
        - name: AUDIOBOOKSHELF_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: audiobookshelf-sso-secret
              key: CLIENT_ID
        - name: AUDIOBOOKSHELF_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: audiobookshelf-sso-secret
              key: CLIENT_SECRET
        - name: KOMGA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: komga-sso-secret
              key: CLIENT_ID
        - name: KOMGA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: komga-sso-secret
              key: CLIENT_SECRET
        - name: GITEA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: gitea-sso-secret
              key: CLIENT_ID
        - name: GITEA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: gitea-sso-secret
              key: CLIENT_SECRET
        - name: IMMICH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: immich-sso-secret
              key: CLIENT_ID
        - name: IMMICH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: immich-sso-secret
              key: CLIENT_SECRET
        - name: PAPERLESS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: paperless-sso-secret
              key: CLIENT_ID
        - name: PAPERLESS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: paperless-sso-secret
              key: CLIENT_SECRET
        - name: DAWARICH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: dawarich-sso-secret
              key: CLIENT_ID
        - name: DAWARICH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: dawarich-sso-secret
              key: CLIENT_SECRET
        - name: AIRTRAIL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: airtrail-sso-secret
              key: CLIENT_ID
        - name: AIRTRAIL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: airtrail-sso-secret
              key: CLIENT_SECRET
        - name: KARAKEEP_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: karakeep-sso-secret
              key: CLIENT_ID
        - name: KARAKEEP_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: karakeep-sso-secret
              key: CLIENT_SECRET
        - name: NEXTCLOUD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nextcloud-sso-secret
              key: CLIENT_ID
        - name: NEXTCLOUD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-sso-secret
              key: CLIENT_SECRET
        - name: LITELLM_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: litellm-sso-secret
              key: CLIENT_ID
        - name: LITELLM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: litellm-sso-secret
              key: CLIENT_SECRET
        - name: NETBIRD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: netbird-sso-secret
              key: CLIENT_ID
        - name: NETBIRD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: netbird-sso-secret
              key: CLIENT_SECRET
        - name: SCROB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: scrob-sso-secret
              key: CLIENT_ID
        - name: SCROB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: scrob-sso-secret
              key: CLIENT_SECRET
        - name: UNRAID_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: unraid-sso-secret
              key: CLIENT_ID
        - name: UNRAID_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: unraid-sso-secret
              key: CLIENT_SECRET
        - name: BAMBUDDY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: bambuddy-sso-secret
              key: CLIENT_ID
        - name: BAMBUDDY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: bambuddy-sso-secret
              key: CLIENT_SECRET
        - name: PROXMOX_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: proxmox-sso-secret
              key: CLIENT_ID
        - name: PROXMOX_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: proxmox-sso-secret
              key: CLIENT_SECRET
        - name: DISCORD_BASIC_AUTH
          valueFrom:
            secretKeyRef:
              name: discord-auth-secret
              key: BASIC_AUTH
        - name: KOPIA_BASIC_AUTH
          valueFrom:
            secretKeyRef:
              name: kopia-auth-secret
              key: BASIC_AUTH
        - name: LLAMA_BASIC_AUTH
          valueFrom:
            secretKeyRef:
              name: llama-auth-secret
              key: BASIC_AUTH
        - name: FRIGATE_PROXY_SECRET
          valueFrom:
            secretKeyRef:
              name: frigate-proxy-secret
              key: FRIGATE_PROXY_SECRET
        - name: OPENCLAW_GATEWAY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openclaw-gateway-secret
              key: OPENCLAW_GATEWAY_PASSWORD
        - name: TAUTULLI_BASIC_AUTH_USER
          valueFrom:
            secretKeyRef:
              name: tautulli-basic-auth-pbk-secret
              key: USERNAME
        - name: TAUTULLI_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tautulli-basic-auth-pbk-secret
              key: PBK

        # Blueprint variables
        - name: AK_BLUEPRINT_USERNAME
          valueFrom:
            secretKeyRef:
              name: authentik-env
              key: AK_BLUEPRINT_USERNAME
        - name: AK_BLUEPRINT_NAME
          valueFrom:
            secretKeyRef:
              name: authentik-env
              key: AK_BLUEPRINT_NAME
        - name: AK_BLUEPRINT_EMAIL
          valueFrom:
            secretKeyRef:
              name: authentik-env
              key: AK_BLUEPRINT_EMAIL
        - name: AK_BLUEPRINT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-env
              key: AK_BLUEPRINT_USER_PASSWORD
        - name: AK_BLUEPRINT_USER_AVATAR
          valueFrom:
            secretKeyRef:
              name: authentik-env
              key: AK_BLUEPRINT_USER_AVATAR
        - name: AK_LDAP_SEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ldap-search-secret
              key: AK_LDAP_SEARCH_PASSWORD

        # Database connection
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-pg-rw
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: authentik-db-secrets
              key: username
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-db-secrets
              key: password

    blueprints:
      configMaps:
        - authentik-blueprints-bootstrap

    server:
      replicas: 2
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: tautulli-basic-auth-pbk-secret
      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          memory: 1536Mi
      pdb:
        enabled: true
        minAvailable: 1
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - server
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
          scrapeTimeout: 3s
          labels:
            release: observability-kube-prometheus-stack

    worker:
      replicas: 2
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: tautulli-basic-auth-pbk-secret
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          memory: 1536Mi
      startupProbe:
        initialDelaySeconds: 30
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 60
      readinessProbe:
        initialDelaySeconds: 20
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      livenessProbe:
        initialDelaySeconds: 20
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      volumes:
        - name: authentik-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        # wildcard-cluster-domain-tls is replicated into the authentik
        # namespace by the mittwald secret replicator. Mounting it at
        # /certs/ldap-lan exposes tls.crt/tls.key for Authentik certificate
        # discovery as the managed goauthentik.io/crypto/discovered/ldap-lan
        # keypair.
        - name: ldap-lan-cert
          secret:
            secretName: wildcard-cluster-domain-tls
      volumeMounts:
        - name: authentik-shm
          mountPath: /dev/shm
        - name: ldap-lan-cert
          mountPath: /certs/ldap-lan
          readOnly: true
      pdb:
        enabled: true
        minAvailable: 1
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - worker
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
          scrapeTimeout: 3s
          labels:
            release: observability-kube-prometheus-stack

    prometheus:
      rules:
        enabled: true
        labels:
          release: observability-kube-prometheus-stack

    postgresql:
      enabled: false
    redis:
      enabled: false
