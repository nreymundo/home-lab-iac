# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: external-secrets
  install:
    createNamespace: true
  chart:
    spec:
      chart: external-secrets
      # renovate: datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io
      version: "2.10.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 1h
  values:
    installCRDs: true
    scopedRBAC: false
    processClusterExternalSecret: false
    processClusterPushSecret: false
    processClusterStore: true
    processSecretStore: false
    processClusterGenerator: false
    processPushSecret: false
    genericTargets:
      enabled: false
    crds:
      createClusterExternalSecret: false
      createClusterSecretStore: true
      createSecretStore: false
      createClusterGenerator: false
      createClusterPushSecret: false
      createPushSecret: false
    rbac:
      serviceAccountTokenCreate: false
      aggregateToView: false
      aggregateToEdit: false
      aggregateToAdmin: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    certController:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
