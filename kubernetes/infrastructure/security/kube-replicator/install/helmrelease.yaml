# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-replicator
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-replicator
  install:
    createNamespace: true
  chart:
    spec:
      chart: kubernetes-replicator
      # renovate: datasource=helm depName=kubernetes-replicator registryUrl=https://helm.mittwald.de
      version: "2.12.6"
      sourceRef:
        kind: HelmRepository
        name: mittwald
        namespace: flux-system
      interval: 1h
  values:
    # Chart >= 2.12.5 (upstream #427) authorizes push replication explicitly.
    # Only these operator-controlled namespaces may push objects into other
    # namespaces via replicator.v1.mittwald.de/replicate-to annotations.
    pushAllowedSourceNamespaces:
      - authentik
      - cert-manager
      - cnpg-system
      - crowdsec
      - observability
      - utils
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
