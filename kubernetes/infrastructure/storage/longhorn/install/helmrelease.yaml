# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: longhorn-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
  chart:
    spec:
      chart: longhorn
      # renovate: datasource=helm depName=longhorn registryUrl=https://charts.longhorn.io
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1h
  values:
    networkPolicies:
      restrictInternalTraffic: false

    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: observability-kube-prometheus-stack

    preUpgradeChecker:
      upgradeVersionCheck: false
      jobEnabled: false

    longhornManager:
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 768Mi

    defaultSettings:
      allowRecurringJobWhileVolumeDetached: true
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      guaranteedInstanceManagerCPU: '{"v1":"8","v2":"8"}'
    persistence:
      defaultClass: false # we will create our own StorageClass + mark it default
    # S3 Backup Target (Garage)
    defaultBackupStore:
      backupTarget: "s3://longhorn@garage/"
      backupTargetCredentialSecret: longhorn-backup-secret
