# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# MailFlow — self-hosted unified webmail.
#
# POST-DEPLOY OPERATOR STEPS — MailFlow stores the settings below in its own
# database and exposes no env/config-file equivalent for them, so they are
# configured in the admin UI after the first rollout (source: upstream README
# and backend/src/routes/{admin,oidc}.js, which read everything from the
# oidc_providers / system_settings tables):
#
#   1. First registered account becomes admin: register once at
#      https://mail.${CLUSTER_DOMAIN}, then close open registration
#      (Settings -> Users).
#   2. Settings -> SSO: add an Authentik OIDC provider. Use the client
#      credentials from the Authentik-owned SOPS source Secret (the blueprint
#      consumes that source and kube-replicator delivers its in-cluster copy):
#        issuer           https://sso.${CLUSTER_DOMAIN}/application/o/mailflow/
#        scopes           openid email profile groups
#        redirect URI     https://mail.${CLUSTER_DOMAIN}/auth/oidc/authentik/callback
#                         (must stay byte-identical to the strict URI in the
#                         Authentik blueprint)
#        admin group claim  groups
#        admin group value  MailFlow Admins
#      Authentik group "MailFlow Admins" grants the MailFlow admin role on
#      every SSO login (and removes it when membership is lost); "MailFlow
#      Users" is login-only admission. Both groups are bound to the
#      application policy in the Authentik blueprint.
#      After the first successful SSO login, disable password login in
#      Settings -> SSO.
#   3. Settings -> Security: enable "Allow private / local hosts". MailFlow
#      rejects private-address AI/IMAP/CardDAV hosts by default (SSRF guard);
#      this is required for the in-cluster LiteLLM endpoint in step 4.
#   4. Settings -> AI: choose the OpenAI-compatible API provider connection
#      method and configure:
#        base URL  http://litellm-main.ai.svc.cluster.local:4000/v1
#        API key   a dedicated LiteLLM virtual key created in the LiteLLM UI
#                  (kept only in MailFlow's encrypted settings; not in this repo)
#        model     an existing LiteLLM-routed model
#      then run MailFlow's built-in connection test.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mailflow
  namespace: utils
spec:
  chart:
    spec:
      chart: app-template
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        # Single replica: the backend keeps persistent IMAP connections and
        # runs SQL migrations at startup; upstream expects one writer.
        replicas: 1
        containers:
          # nginx serving the SPA and proxying /api, /oauth, /auth/oidc, /ws
          # and /api/ai to the backend container on localhost. Upstream's
          # baked-in config targets Docker's embedded DNS (resolver 127.0.0.11
          # + upstream backend:3000), so the mailflow-nginx-config ConfigMap
          # replaces it with a static localhost upstream.
          frontend:
            image:
              # renovate: datasource=docker depName=maathimself/mailflow-frontend registryUrl=https://ghcr.io
              repository: ghcr.io/maathimself/mailflow-frontend
              tag: "3.4.2"
            ports:
              - name: http
                containerPort: 80
            probes:
              # nginx itself: the SPA fallback always answers "/".
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              # Readiness/startup probe the full chain (nginx -> backend) so
              # the pod only takes traffic once the API answers. The generous
              # startup threshold covers first-boot SQL migrations.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 80
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 80
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi

          backend:
            image:
              # renovate: datasource=docker depName=maathimself/mailflow-backend registryUrl=https://ghcr.io
              repository: ghcr.io/maathimself/mailflow-backend
              tag: "3.4.2"
            env:
              TZ: Europe/Berlin
              NODE_ENV: production
              PORT: "3000"
              APP_URL: https://mail.${CLUSTER_DOMAIN}
              FRONTEND_URL: https://mail.${CLUSTER_DOMAIN}
              DB_HOST: mailflow-pg-rw
              DB_PORT: "5432"
              DB_NAME: mailflow
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: mailflow-db-secrets
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: mailflow-db-secrets
                    key: password
              REDIS_URL: redis://mailflow-valkey:6379
              # SESSION_SECRET signs express sessions. ENCRYPTION_KEY (exactly
              # 64 hex chars) encrypts stored IMAP/SMTP credentials and OAuth
              # tokens at rest; losing it makes those unreadable, so it must
              # never be rotated casually.
              SESSION_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: mailflow-secrets
                    key: SESSION_SECRET
              ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: mailflow-secrets
                    key: ENCRYPTION_KEY
            ports:
              - name: api
                containerPort: 3000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

      # Valkey holds sessions, rate-limit counters and cache only. It is
      # intentionally ephemeral (same contract as the litellm valkey sibling):
      # no PVC and no RDB/AOF — losing it only forces a one-click Authentik
      # re-login.
      valkey:
        containers:
          valkey:
            image:
              # renovate: datasource=docker depName=valkey/valkey registryUrl=https://docker.io
              repository: docker.io/valkey/valkey
              tag: 9-alpine
            command:
              - valkey-server
              - --save
              - ""
              - --appendonly
              - "no"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - redis-cli ping || exit 1
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - redis-cli ping || exit 1
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
      valkey:
        controller: valkey
        ports:
          valkey:
            port: 6379

    ingress:
      main:
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mail.${CLUSTER_DOMAIN}
        hosts:
          - host: mail.${CLUSTER_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http

    persistence:
      nginx-config:
        enabled: true
        type: configMap
        name: mailflow-nginx-config
        advancedMounts:
          main:
            frontend:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
      valkey-data:
        enabled: true
        type: emptyDir
        advancedMounts:
          valkey:
            valkey:
              - path: /data
