# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opengym
  namespace: utils
spec:
  chart:
    spec:
      chart: app-template
  values:
    controllers:
      main:
        replicas: 1
        # The API stores all state as JSON files under /data with no shared
        # locking; it is strictly a single-writer app, so never roll it.
        strategy: Recreate
        initContainers:
          # One-time fetch of the exercise images/GIFs (~140 MB) that the web
          # container serves as static media. Same job as the `media` service in
          # upstream docker-compose.yml. The media PVC is rebuildable and is
          # deliberately NOT backup-labeled: the media is third-party content
          # with unresolved licensing (see upstream NOTICE.md), so it must not
          # be copied into Longhorn backups.
          media-init:
            image:
              # renovate: datasource=docker depName=alpine/git registryUrl=https://docker.io
              repository: docker.io/alpine/git
              tag: 2.54.0
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                mkdir -p /media/img /media/gif
                if [ -f /media/.complete ]; then
                  echo "media: exercise images already present - skipping"
                  exit 0
                fi
                echo "media: fetching exercise images/GIFs (~140 MB) from hasaneyldrm/exercises-dataset"
                rm -rf /tmp/exercises-dataset /media/img/* /media/gif/*
                git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/exercises-dataset
                cp /tmp/exercises-dataset/images/*.jpg /media/img/
                cp /tmp/exercises-dataset/videos/*.gif /media/gif/
                rm -rf /tmp/exercises-dataset
                touch /media/.complete
                echo "media: ready ($(ls /media/img | wc -l) images)"
        containers:
          # Serves the built frontend and proxies /api to the API container so
          # the whole app stays on one origin, which WebAuthn requires.
          web:
            image:
              # renovate: datasource=docker depName=duartesantos8/opengym-web registryUrl=https://ghcr.io
              repository: ghcr.io/duartesantos8/opengym-web
              tag: "1.3.7"
            env:
              TZ: Europe/Berlin
              NGINX_PORT: "80"
              # API rides in the same pod: BACKEND is a literal loopback IP, so
              # nginx never consults the RESOLVER (which the image defaults to
              # Docker's embedded DNS) for /api proxying.
              BACKEND: 127.0.0.1
              PORT: "3000"
            ports:
              - name: http
                containerPort: 80
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
          # Passkey (WebAuthn) auth plus per-user JSON state. Native OIDC does
          # not exist upstream yet (roadmap v1.4.2), so passkeys are the only
          # login method and no Authentik wiring is possible.
          api:
            image:
              # Default image target: the AI Coach's OpenAI-compatible endpoint
              # provider needs no AI runtime; keep web/api tags version-matched.
              # renovate: datasource=docker depName=duartesantos8/opengym-api registryUrl=https://ghcr.io
              repository: ghcr.io/duartesantos8/opengym-api
              tag: "1.3.7"
            env:
              TZ: Europe/Berlin
              DATA_DIR: /data
              PORT: "3000"
              # Passkeys are bound to the exact hostname; changing RP_ID later
              # invalidates every registered passkey.
              RP_ID: opengym.lan.${CLUSTER_DOMAIN}
              ORIGIN: https://opengym.lan.${CLUSTER_DOMAIN}
              RP_NAME: openGym
              # Keep profile creation invite-only after the initial passkey
              # profile has been promoted to administrator.
              ADMIN_UIDS: OyE9X4rgzJZ32oA4
              ALLOW_GUEST: "0"
              INVITE_ONLY: "1"
              SESSION_DAYS: "30"
              AUDIT_LOG: "1"
              AUDIT_MAX: "5000"
              AUDIT_DAYS: "90"
              AUDIT_IP: "off"
            ports:
              - name: api
                containerPort: 3000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi

    service:
      # Only the web (nginx) origin is published; the API is reached through
      # the web container's /api proxy and the pod-local loopback.
      main:
        controller: main
        ports:
          http:
            port: 80

    ingress:
      main:
        annotations:
          external-dns.alpha.kubernetes.io/hostname: opengym.lan.${CLUSTER_DOMAIN}
          # Default chain (rate-limit + headers + CrowdSec) instead of
          # auth-guard: openGym owns authentication via passkeys and the
          # Gatekeeper forward-auth chain would add a second login boundary
          # without becoming SSO.
          traefik.ingress.kubernetes.io/router.middlewares: traefik-default-chain@kubernetescrd
        hosts:
          - host: opengym.lan.${CLUSTER_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http

    persistence:
      # All app state: db.json (profiles/passkeys), state-<uid>.json, session
      # secret, VAPID keys, audit.log, and the encrypted AI Coach config.
      data:
        enabled: true
        type: custom
        volumeSpec:
          persistentVolumeClaim:
            claimName: opengym-data
        advancedMounts:
          main:
            api:
              - path: /data
      media:
        enabled: true
        type: custom
        volumeSpec:
          persistentVolumeClaim:
            claimName: opengym-media
        advancedMounts:
          main:
            media-init:
              - path: /media
            web:
              - path: /usr/share/nginx/html/img
                subPath: img
                readOnly: true
              - path: /usr/share/nginx/html/gif
                subPath: gif
                readOnly: true
