apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
  namespace: utils
spec:
  chart:
    spec:
      chart: app-template
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: k3s-node-03
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # renovate: datasource=docker depName=maziggy/bambuddy registryUrl=https://ghcr.io
              repository: ghcr.io/maziggy/bambuddy
              tag: 1.2.5.4
            env:
              TZ: Europe/Berlin
              PUID: "1000"
              PGID: "1000"
              PORT: "8000"
              APP_URL: https://bambuddy.lan.${CLUSTER_DOMAIN}
              VIRTUAL_PRINTER_PASV_ADDRESS: ${BAMBUDDY_IP}
              # --- Auth: native OIDC against Authentik ---
              BAMBUDDY_OIDC_NAME: Authentik
              BAMBUDDY_OIDC_ISSUER_URL: https://sso.${CLUSTER_DOMAIN}/application/o/bambuddy/
              BAMBUDDY_OIDC_SCOPES: "openid email profile"
              BAMBUDDY_OIDC_ENABLED: "true"
              BAMBUDDY_OIDC_AUTO_LINK_EXISTING: "true"
              BAMBUDDY_OIDC_AUTO_CREATE_USERS: "true"
              BAMBUDDY_OIDC_AUTOLOGIN: "true"
              BAMBUDDY_OIDC_EMAIL_CLAIM: email
              BAMBUDDY_OIDC_REQUIRE_EMAIL_VERIFIED: "true"
              BAMBUDDY_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: bambuddy-sso-secret
                    key: CLIENT_ID
              BAMBUDDY_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: bambuddy-sso-secret
                    key: CLIENT_SECRET
            securityContext:
              capabilities:
                add:
                  - NET_BIND_SERVICE
            ports:
              - name: http
                containerPort: 8000
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8000
    ingress:
      main:
        annotations:
          external-dns.alpha.kubernetes.io/hostname: bambuddy.lan.${CLUSTER_DOMAIN}
        hosts:
          - host: bambuddy.lan.${CLUSTER_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
    persistence:
      data:
        enabled: true
        type: custom
        volumeSpec:
          persistentVolumeClaim:
            claimName: bambuddy-data
        globalMounts:
          - path: /app/data
      logs:
        enabled: true
        type: custom
        volumeSpec:
          persistentVolumeClaim:
            claimName: bambuddy-logs
        globalMounts:
          - path: /app/logs
