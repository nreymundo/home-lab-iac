# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: photon
  namespace: utils
  labels:
    release: observability-kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: photon
      app.kubernetes.io/instance: photon
  endpoints:
    - port: scheduler
      path: /metrics
      interval: 1m
