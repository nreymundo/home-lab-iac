# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airtrail-integration-secrets
  namespace: utils
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-runtime
  target:
    name: airtrail-integration-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: INTEGRATIONS_AERO_DATA_BOX_KEY
      remoteRef:
        key: srrqbnw3upbvmyjihprcreilmy/INTEGRATIONS_AERO_DATA_BOX_KEY
    - secretKey: INTEGRATIONS_OPEN_AIP_KEY
      remoteRef:
        key: srrqbnw3upbvmyjihprcreilmy/INTEGRATIONS_OPEN_AIP_KEY
