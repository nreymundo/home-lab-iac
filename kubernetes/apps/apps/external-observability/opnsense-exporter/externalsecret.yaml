# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsense-exporter-secret
  namespace: external-observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-runtime
  target:
    name: opnsense-exporter-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPNSENSE_EXPORTER_OPS_API_KEY
      remoteRef:
        key: qxjh5xnroba5pnfraodfp3fhny/API_KEY
    - secretKey: OPNSENSE_EXPORTER_OPS_API_SECRET
      remoteRef:
        key: qxjh5xnroba5pnfraodfp3fhny/API_SECRET
