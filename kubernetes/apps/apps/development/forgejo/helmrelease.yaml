# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: development
spec:
  chart:
    spec:
      chart: app-template
  values:
    fullnameOverride: forgejo
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # renovate: datasource=docker depName=forgejo/forgejo registryUrl=https://codeberg.org
              repository: codeberg.org/forgejo/forgejo
              tag: 15.0.11
            env:
              TZ: Europe/Berlin
              USER_UID: 99
              USER_GID: 100
              FORGEJO__server__DOMAIN: git.${CLUSTER_DOMAIN}
              FORGEJO__server__SSH_DOMAIN: git.${CLUSTER_DOMAIN}
              FORGEJO__server__ROOT_URL: https://git.${CLUSTER_DOMAIN}/
              FORGEJO__server__SSH_PORT: "22"
              FORGEJO__server__SSH_LISTEN_PORT: "22"
              FORGEJO__security__INSTALL_LOCK: "true"
              FORGEJO__database__DB_TYPE: sqlite3
              # Only the group-restricted Authentik provider can auto-link the imported username.
              FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
              FORGEJO__oauth2_client__ACCOUNT_LINKING: auto
              FORGEJO__oauth2_client__UPDATE_AVATAR: "true"
              FORGEJO__migrations__ALLOWED_DOMAINS: ""
              FORGEJO__service__DISABLE_REGISTRATION: "true"
              FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
              FORGEJO__service__ENABLE_INTERNAL_SIGNIN: "false"
              FORGEJO__service__ENABLE_BASIC_AUTHENTICATION: "false"
              FORGEJO__service__ENABLE_PASSWORD_SIGNIN_FORM: "false"
              FORGEJO__service__ENABLE_PASSKEY_AUTHENTICATION: "false"
              FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
              FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
              FORGEJO__mailer__ENABLED: "true"
              FORGEJO__mailer__FROM: forgejo@${CLUSTER_DOMAIN}
              FORGEJO__mailer__PROTOCOL: smtp+starttls
              FORGEJO__mailer__SMTP_ADDR: smtp.purelymail.com
              FORGEJO__mailer__SMTP_PORT: "587"
              FORGEJO__mailer__USER:
                valueFrom:
                  secretKeyRef:
                    name: gitea-mailer-secret
                    key: GITEA__mailer__USER
              FORGEJO__mailer__PASSWD:
                valueFrom:
                  secretKeyRef:
                    name: gitea-mailer-secret
                    key: GITEA__mailer__PASSWD
            ports:
              - name: http
                containerPort: 3000
              - name: ssh
                containerPort: 22
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 768Mi
          oauth-setup:
            image:
              # renovate: datasource=docker depName=forgejo/forgejo registryUrl=https://codeberg.org
              repository: codeberg.org/forgejo/forgejo
              tag: 15.0.11
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                echo "Waiting for Forgejo to be ready..."
                until curl -sf http://localhost:3000/api/healthz >/dev/null 2>&1; do
                  sleep 5
                done

                auth_ready=false
                auth_sources=""
                for _ in $(seq 1 30); do
                  if auth_sources=$(forgejo --config /data/gitea/conf/app.ini admin auth list 2>/dev/null); then
                    auth_ready=true
                    break
                  fi
                  sleep 2
                done
                if [ "$auth_ready" != true ]; then
                  echo "ERROR: unable to list Forgejo OAuth sources" >&2
                  exit 1
                fi
                auth_id=$(printf '%s\n' "$auth_sources" | awk 'tolower($0) ~ /authentik/ {print $1; exit}')

                if [ -n "$auth_id" ]; then
                  forgejo --config /data/gitea/conf/app.ini admin auth update-oauth \
                    --id "$auth_id" \
                    --name "Authentik" \
                    --provider "openidConnect" \
                    --key "$CLIENT_ID" \
                    --secret "$CLIENT_SECRET" \
                    --auto-discover-url "https://sso.${CLUSTER_DOMAIN}/application/o/forgejo/.well-known/openid-configuration" \
                    --scopes "openid email profile forgejo" \
                    --group-claim-name "forgejo" \
                    --admin-group "admin" \
                    --skip-local-2fa \
                    --icon-url "https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/authentik.svg"
                else
                  forgejo --config /data/gitea/conf/app.ini admin auth add-oauth \
                    --name "Authentik" \
                    --provider "openidConnect" \
                    --key "$CLIENT_ID" \
                    --secret "$CLIENT_SECRET" \
                    --auto-discover-url "https://sso.${CLUSTER_DOMAIN}/application/o/forgejo/.well-known/openid-configuration" \
                    --scopes "openid email profile forgejo" \
                    --group-claim-name "forgejo" \
                    --admin-group "admin" \
                    --skip-local-2fa \
                    --icon-url "https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/authentik.svg"
                fi

                echo "Forgejo Authentik source configured."
                sleep infinity
            env:
              - name: CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: forgejo-sso-secret
                    key: CLIENT_ID
              - name: CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: forgejo-sso-secret
                    key: CLIENT_SECRET
              - name: CLUSTER_DOMAIN
                value: "${CLUSTER_DOMAIN}"
            securityContext:
              runAsUser: 99
              runAsGroup: 100
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
            targetPort: 3000
          ssh:
            port: 22
            targetPort: 22
    ingress:
      main:
        annotations:
          external-dns.kubernetes.io/hostname: git.${CLUSTER_DOMAIN}
        hosts:
          - host: git.${CLUSTER_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: forgejo
        globalMounts:
          - path: /data
      backup:
        type: nfs
        server: ${UNRAID_IP}
        path: /mnt/user/backup
        globalMounts:
          - path: /mnt/backup
