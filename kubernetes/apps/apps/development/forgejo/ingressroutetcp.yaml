# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/traefik.io/ingressroutetcp_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: forgejo-ssh
  namespace: development
  annotations:
    external-dns.kubernetes.io/controller: ignore
spec:
  entryPoints:
    - ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: forgejo
          namespace: development
          port: 22
