# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/bjw-s-defaults

generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: speech-to-speech-shim
    namespace: ai
    files:
      - tts_shim.py

resources:
  - helmrelease.yaml
  - ingressroute.yaml
  - speech-to-speech-secrets.sops.yaml
