# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/traefik.io/ingressroute_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: speech-to-speech
  namespace: ai
  annotations:
    external-dns.kubernetes.io/hostname: s2s.lan.${CLUSTER_DOMAIN}
    external-dns.kubernetes.io/target: ${TRAEFIK_LB_IP}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`s2s.lan.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: lan-allowlist
          namespace: traefik
      services:
        - name: speech-to-speech
          port: 8765
