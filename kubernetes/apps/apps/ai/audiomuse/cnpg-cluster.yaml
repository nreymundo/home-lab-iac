# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: audiomuse-pg
  namespace: ai
  labels:
    release: observability-kube-prometheus-stack
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/backup-daily: enabled
      recurring-job.longhorn.io/backup-weekly: enabled
  instances: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
  monitoring:
    enablePodMonitor: true
  storage:
    size: 10Gi
    storageClass: longhorn-r2
  imageName: ghcr.io/cloudnative-pg/postgresql:15@sha256:11274300143f02d369ea2ff6082b028b6b662915f06bf59f26b808b53823475a
  postgresql:
    parameters:
      wal_level: "replica"
      archive_timeout: "21600"
      archive_mode: "on"
  bootstrap:
    initdb:
      database: audiomusedb
      owner: audiomuse
      secret:
        name: audiomuse-db-secrets
  backup:
    barmanObjectStore:
      wal:
        compression: gzip
      data:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
        region:
          name: cnpg-backup-s3
          key: AWS_DEFAULT_REGION
      destinationPath: "s3://cloudnative-pg/audiomuse"
      endpointURL: "https://s3.${CLUSTER_DOMAIN}"
      serverName: audiomuse-pg-v1
    retentionPolicy: "21d"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: audiomuse-pg-backup
  namespace: ai
spec:
  schedule: "0 0 0 * * 0"
  backupOwnerReference: self
  cluster:
    name: audiomuse-pg
  method: barmanObjectStore
