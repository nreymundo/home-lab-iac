# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/bjw-s-defaults
resources:
  - helmrelease.yaml
  - ingress.yaml
  - rbac.yaml
configMapGenerator:
  - name: llama-swap-config
    namespace: ai
    files:
      - config.yaml
      - start.py
      - audio-higgs.json
      - audio-chatterbox.json
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
