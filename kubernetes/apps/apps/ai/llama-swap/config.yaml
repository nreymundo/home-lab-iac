apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"
healthCheckTimeout: 500
unloadTimeout: 90
logLevel: info
logToStdout: proxy
metricsMaxInMemory: 1000
captureBuffer: 15
performance:
  disabled: false
  every: 15s
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0
groups:
  always-on:
    swap: false
    exclusive: false
    persistent: true
    members:
      - majentik/qwen3-embedding-4b
      - qwen/qwen3-reranker-0.6b
      - d3-mini
      - audiocpp_auto
  chatterbox-on-demand:
    swap: false
    exclusive: false
    persistent: false
    members:
      - chatterbox-turbo
hooks:
  on_startup:
    preload:
      - majentik/qwen3-embedding-4b
      - qwen/qwen3-reranker-0.6b
      - d3-mini
      - audiocpp_auto
models:
  audiocpp_auto:
    name: Higgs TTS 3 4B Q8_0
    description: Boson AI multilingual speech and voice cloning; native audio.cpp, resident low-idle backend
    aliases: [higgs-audio-tts]
    useModelName: higgs-audio-tts
    checkEndpoint: /health
    ttl: 0
    capabilities:
      in: [text, audio]
      out: [audio]
      disableAuto: true
    cmd: >-
      kubeswap serve --namespace ai-backends --model audiocpp_auto
      --listen 127.0.0.1:${PORT} --port 8080 --startup-timeout 480s --grace 30s --strict
      --image ghcr.io/mostlygeek/llama-swap:unified-vulkan-269@sha256:bcb532139b072e4c34ba1dece004db1c5c25cbffd8d099fa26d92caa29edc2a3
      --command /bin/sh --command -c
      --gpu devic.es/amd-gpu=1 --node-selector kubernetes.io/hostname=steadfast
      --request cpu=100m --request memory=6Gi
      --env OMP_WAIT_POLICY=PASSIVE --env KMP_BLOCKTIME=0
      --env AUDIOCPP_CONFIG_BASE64=${env.AUDIOCPP_HIGGS_CONFIG}
      --volume hostpath:/srv/ai/models:/opt/ai/models:ro
      --volume hostpath:/srv/ai/audio/voices:/var/lib/audio-cpp/voices
      -- 'printf %s "$AUDIOCPP_CONFIG_BASE64" | base64 -d > /tmp/audio.json &&
      exec audiocpp_server --config /tmp/audio.json --host 0.0.0.0 --port 8080 --ui'
    cmdStop: kubeswap delete --namespace ai-backends --model audiocpp_auto --wait
    proxy: http://127.0.0.1:${PORT}
  chatterbox-turbo:
    name: Chatterbox Turbo Q8_0
    description: On-demand offline speech synthesis and voice cloning; independent GPU backend
    checkEndpoint: /health
    ttl: 900
    capabilities:
      in: [text, audio]
      out: [audio]
      disableAuto: true
    cmd: >-
      kubeswap serve --namespace ai-backends --model chatterbox-turbo
      --listen 127.0.0.1:${PORT} --port 8080 --startup-timeout 480s --grace 30s --strict
      --image ghcr.io/mostlygeek/llama-swap:unified-vulkan-269@sha256:bcb532139b072e4c34ba1dece004db1c5c25cbffd8d099fa26d92caa29edc2a3
      --command /bin/sh --command -c
      --gpu devic.es/amd-gpu=1 --node-selector kubernetes.io/hostname=steadfast
      --request cpu=100m --request memory=3Gi
      --env OMP_WAIT_POLICY=PASSIVE --env KMP_BLOCKTIME=0
      --env AUDIOCPP_CONFIG_BASE64=${env.AUDIOCPP_CHATTERBOX_CONFIG}
      --volume hostpath:/srv/ai/models:/opt/ai/models:ro
      --volume hostpath:/srv/ai/audio/voices:/var/lib/audio-cpp/voices
      -- 'printf %s "$AUDIOCPP_CONFIG_BASE64" | base64 -d > /tmp/audio.json &&
      exec audiocpp_server --config /tmp/audio.json --host 0.0.0.0 --port 8080 --ui'
    cmdStop: kubeswap delete --namespace ai-backends --model chatterbox-turbo --wait
    proxy: http://127.0.0.1:${PORT}
  d3-mini:
    name: d3-mini Q8_0 Decision Model
    description: Always-on text decision classifier via /v1/systemone; Vulkan, 16K single-batch context, low-idle settings
    ttl: 0
    capabilities:
      in: [text]
      out: [decisions]
      tools: false
      context: 16384
      disableAuto: true
    cmd: >-
      kubeswap serve --namespace ai-backends --model d3-mini
      --listen 127.0.0.1:${PORT} --port 8080 --startup-timeout 480s --grace 30s --strict
      --image docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv@sha256:132730e57ecd96d33411f9b625565350ca2f68f0363ae0c7f4926ccd43d4a2fc
      --command /usr/bin/llama-server
      --gpu devic.es/amd-gpu=1 --node-selector kubernetes.io/hostname=steadfast
      --request cpu=100m --request memory=6Gi
      --volume hostpath:/srv/ai/models:/opt/ai/models:ro
      -- --alias d3-mini --host 0.0.0.0 --port 8080
      -m /opt/ai/models/ggml-org/d3-mini/vllm-d3-mini-Q8_0.gguf
      --ctx-size 16384 --batch-size 16384 --ubatch-size 16384 --parallel 1
      -ngl 999 -fa on --device Vulkan0 --cache-ram 0 --poll 0 --poll-batch 0 --metrics --no-webui
    cmdStop: kubeswap delete --namespace ai-backends --model d3-mini --wait
    proxy: http://127.0.0.1:${PORT}
  majentik/qwen3-embedding-4b:
    name: Qwen3 Embedding 4B Q4_K_M
    description: Qwen3 4B embedding model for GPU-backed test embeddings
    capabilities:
      in: [text]
      context: 16384
    cmd: >-
      kubeswap serve --namespace ai-backends --model majentik/qwen3-embedding-4b
      --listen 127.0.0.1:${PORT} --port 8080 --startup-timeout 480s --grace 30s --strict
      --image ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:421137599beb2135a9e1d664fa8991a3f4f5f953440a9d7622c7a61b63185fe8
      --gpu devic.es/amd-gpu=1 --node-selector kubernetes.io/hostname=steadfast
      --request cpu=100m --request memory=3Gi
      --volume hostpath:/srv/ai/models:/opt/ai/models:ro
      -- --alias qwen3-embedding-4b --host 0.0.0.0 --port 8080
      -m /opt/ai/models/majentik/qwen3-emb-4b-Q4_K_M.gguf
      --embedding --pooling last --ctx-size 16384 --batch-size 2048 --ubatch-size 512
      --parallel 1 --device Vulkan0 -ngl 999 --cache-ram 0 --metrics --no-webui
    cmdStop: kubeswap delete --namespace ai-backends --model majentik/qwen3-embedding-4b --wait
    proxy: http://127.0.0.1:${PORT}
  qwen/qwen3-reranker-0.6b:
    name: Qwen3 Reranker 0.6B Q4_K_M
    description: Qwen3 0.6B reranker model for GPU-backed reranking
    capabilities:
      in: [text]
      reranker: true
      context: 8192
    cmd: >-
      kubeswap serve --namespace ai-backends --model qwen/qwen3-reranker-0.6b
      --listen 127.0.0.1:${PORT} --port 8080 --startup-timeout 480s --grace 30s --strict
      --image ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:421137599beb2135a9e1d664fa8991a3f4f5f953440a9d7622c7a61b63185fe8
      --gpu devic.es/amd-gpu=1 --node-selector kubernetes.io/hostname=steadfast
      --request cpu=100m --request memory=1Gi
      --volume hostpath:/srv/ai/models:/opt/ai/models:ro
      -- --alias qwen3-reranker-0.6b --host 0.0.0.0 --port 8080
      -m /opt/ai/models/qwen/reranker/qwen3-reranker-0.6b-q4_k_m.gguf
      --embedding --reranking --pooling rank --ctx-size 32768 --batch-size 16384 --ubatch-size 16384
      --parallel 2 --device Vulkan0 -ngl 999 --cache-ram 0 --metrics --no-webui
    cmdStop: kubeswap delete --namespace ai-backends --model qwen/qwen3-reranker-0.6b --wait
    proxy: http://127.0.0.1:${PORT}
