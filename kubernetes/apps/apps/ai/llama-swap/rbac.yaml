apiVersion: v1
kind: Namespace
metadata:
  name: ai-backends
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llama-swap
  namespace: ai-backends
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llama-swap
  namespace: ai-backends
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llama-swap
subjects:
  - kind: ServiceAccount
    name: llama-swap
    namespace: ai
