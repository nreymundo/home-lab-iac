# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llama-swap
  namespace: ai
spec:
  chart:
    spec:
      chart: app-template
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        serviceAccount:
          name: llama-swap
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: true
          terminationGracePeriodSeconds: 120
        containers:
          main:
            image:
              # renovate: datasource=docker depName=mostlygeek/llama-swap registryUrl=https://ghcr.io
              repository: ghcr.io/mostlygeek/llama-swap
              tag: unified-vulkan-269@sha256:bcb532139b072e4c34ba1dece004db1c5c25cbffd8d099fa26d92caa29edc2a3
            command: [python3, /etc/llama-swap/start.py]
            env:
              LLAMA_BASIC_AUTH:
                valueFrom:
                  secretKeyRef:
                    name: llama-auth-secret
                    key: BASIC_AUTH
            ports:
              - name: http
                containerPort: 8080
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  failureThreshold: 60
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    persistence:
      config:
        type: configMap
        name: llama-swap-config
        globalMounts:
          - path: /etc/llama-swap
            readOnly: true
