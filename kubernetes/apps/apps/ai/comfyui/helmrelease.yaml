# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: comfyui
  namespace: ai
spec:
  chart:
    spec:
      chart: app-template
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: docker.io/library/nginx
              tag: 1.30.6-alpine@sha256:84ed8c0dd296c188bfc24ed506f46589e9285fb0b11cf3a04d91d524d3067e11
            env:
              LLAMA_BASIC_AUTH:
                valueFrom:
                  secretKeyRef:
                    name: llama-auth-secret
                    key: BASIC_AUTH
              NGINX_ENVSUBST_FILTER: LLAMA_BASIC_AUTH
            ports:
              - name: http
                containerPort: 8000
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8188
            targetPort: 8000
    persistence:
      config:
        type: configMap
        name: comfyui-proxy-config
        globalMounts:
          - path: /etc/nginx/templates
            readOnly: true
