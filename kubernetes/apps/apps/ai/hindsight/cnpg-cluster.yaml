apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-pg
  namespace: ai
  labels:
    release: observability-kube-prometheus-stack
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/backup-daily: enabled
      recurring-job.longhorn.io/backup-weekly: enabled
  instances: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
  monitoring:
    enablePodMonitor: true
  storage:
    size: 10Gi
    storageClass: longhorn-r2

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:14.18-0.3.0

  postgresql:
    parameters:
      wal_level: "replica"
      archive_timeout: "21600"
      archive_mode: "on"
    shared_preload_libraries:
      - "vchord.so"

  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
      secret:
        name: hindsight-db-secrets
      postInitApplicationSQL:
        - CREATE EXTENSION vchord CASCADE;

  backup:
    barmanObjectStore:
      wal:
        compression: gzip
      data:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
        region:
          name: cnpg-backup-s3
          key: AWS_DEFAULT_REGION
      destinationPath: "s3://cloudnative-pg/hindsight"
      endpointURL: "https://s3.${CLUSTER_DOMAIN}"
      serverName: "hindsight-pg-v1"
    retentionPolicy: "14d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: hindsight-pg-backup
  namespace: ai
spec:
  schedule: "0 0 0 * * 0"  # Weekly Sunday at midnight
  backupOwnerReference: self
  cluster:
    name: hindsight-pg
  method: barmanObjectStore
