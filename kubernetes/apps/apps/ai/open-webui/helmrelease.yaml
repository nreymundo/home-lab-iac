# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: ai
spec:
  chart:
    spec:
      chart: app-template
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # renovate: datasource=docker depName=open-webui/open-webui registryUrl=https://ghcr.io
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.3
            env:
              TZ: Europe/Berlin
              WEBUI_URL: https://chat.lan.${CLUSTER_DOMAIN}
              WEBUI_AUTH: "true"
              WEBUI_SESSION_COOKIE_SECURE: "true"
              WEBUI_AUTH_COOKIE_SECURE: "true"
              JWT_EXPIRES_IN: "24h"
              WEBUI_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secrets
                    key: WEBUI_SECRET_KEY
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-db-secrets
                    key: DATABASE_URL
              # The vector extension is created by the open-webui-pg CNPG bootstrap;
              # pgvector reuses DATABASE_URL (PGVECTOR_DB_URL stays unset).
              VECTOR_DB: pgvector
              PGVECTOR_CREATE_EXTENSION: "false"
              PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH: "2560"
              PGVECTOR_USE_HALFVEC: "true"
              PGVECTOR_INDEX_METHOD: hnsw
              REDIS_URL: redis://open-webui-valkey:6379/0
              WEBSOCKET_MANAGER: redis
              ENABLE_PERSISTENT_CONFIG: "false"
              ENABLE_VALVE_ENCRYPTION: "true"
              ENABLE_OLLAMA_API: "false"
              ENABLE_SIGNUP: "false"
              ENABLE_OAUTH_SIGNUP: "true"
              ENABLE_PASSWORD_AUTH: "false"
              ENABLE_LOGIN_FORM: "false"
              OAUTH_AUTO_REDIRECT: "true"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
              OPENID_PROVIDER_URL: https://sso.${CLUSTER_DOMAIN}/application/o/open-webui/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.lan.${CLUSTER_DOMAIN}/oauth/oidc/callback
              OAUTH_PROVIDER_NAME: Authentik
              OAUTH_SCOPES: openid email profile open_webui
              OAUTH_UPDATE_PICTURE_ON_LOGIN: "true"
              OAUTH_UPDATE_NAME_ON_LOGIN: "true"
              OAUTH_UPDATE_EMAIL_ON_LOGIN: "true"
              ENABLE_RAG_LOCAL_WEB_FETCH: "true"
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: local/embedding
              RAG_OPENAI_API_BASE_URL: http://litellm-main.ai.svc.cluster.local:4000/v1
              RAG_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secrets
                    key: LITELLM_API_KEY
              AUDIO_STT_ENGINE: openai
              AUDIO_STT_MODEL: local/stt-large
              AUDIO_STT_OPENAI_API_BASE_URL: http://litellm-main.ai.svc.cluster.local:4000/v1
              AUDIO_STT_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secrets
                    key: LITELLM_API_KEY
              AUDIO_STT_OPENAI_API_REQUEST_FORMAT: multipart
              ENABLE_PROFILE_IMAGE_URL_FORWARDING: "false"
              ENABLE_OAUTH_ID_TOKEN_COOKIE: "false"
              OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-sso-secret
                    key: CLIENT_ID
              OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-sso-secret
                    key: CLIENT_SECRET
              ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
              OAUTH_ROLES_CLAIM: open_webui_role
              OAUTH_ALLOWED_ROLES: user,admin
              OAUTH_ADMIN_ROLES: admin
              DEFAULT_MODELS: openai/gpt-5.6-luna
              OPENAI_API_BASE_URLS: http://litellm-main.ai.svc.cluster.local:4000/v1
              OPENAI_API_KEYS:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secrets
                    key: LITELLM_API_KEY
              ENABLE_WEB_SEARCH: "true"
              WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng-main.utils.svc.cluster.local:8080/search?q=<query>
              WEB_SEARCH_RESULT_COUNT: "5"
              # Consumed by the separately imported OpenRouter pipe, not Open WebUI core.
              OPENROUTER_API_BASE_URL: https://openrouter.ai/api/v1
              OPENROUTER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secrets
                    key: OPENROUTER_API_KEY
            ports:
              - name: http
                containerPort: 8080
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

      valkey:
        containers:
          valkey:
            image:
              # renovate: datasource=docker depName=valkey/valkey registryUrl=https://docker.io
              repository: docker.io/valkey/valkey
              tag: 9-alpine
            command:
              - valkey-server
              - --save
              - "30"
              - "1"
              - --loglevel
              - warning
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - redis-cli ping || exit 1
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - redis-cli ping || exit 1
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
      valkey:
        controller: valkey
        ports:
          valkey:
            port: 6379
    ingress:
      main:
        annotations:
          external-dns.alpha.kubernetes.io/hostname: chat.lan.${CLUSTER_DOMAIN}
        hosts:
          - host: chat.lan.${CLUSTER_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
    persistence:
      data:
        enabled: true
        type: custom
        volumeSpec:
          persistentVolumeClaim:
            claimName: open-webui
        advancedMounts:
          main:
            main:
              - path: /app/backend/data
      valkey-data:
        enabled: true
        type: emptyDir
        advancedMounts:
          valkey:
            valkey:
              - path: /data
