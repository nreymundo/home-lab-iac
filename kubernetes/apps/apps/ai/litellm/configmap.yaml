# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      # Native cloud Jev routing; local d3-mini remains available separately.
      - model_name: cloud/codex-auto
        model_info:
          mode: responses
          # auto_router/* is unknown to LiteLLM's model catalog, so the router
          # must declare the window itself; 272k is the common input budget
          # across Luna and Astra, while the Sol tier declares 500k below.
          max_input_tokens: 272000
          max_output_tokens: 128000
        litellm_params:
          model: auto_router/complexity_router
          complexity_router_default_model: cloud/codex-astra-high
          complexity_router_config:
            tiers:
              SIMPLE:
                model_name: cloud/codex-luna-low
                litellm_params:
                  reasoning_effort: low
              MEDIUM:
                model_name: cloud/codex-luna-high
                litellm_params:
                  reasoning_effort: high
              COMPLEX:
                model_name: cloud/codex-sol-high
                litellm_params:
                  reasoning_effort: high
              REASONING:
                model_name: cloud/codex-astra-high
                litellm_params:
                  reasoning_effort: high
            classifier_type: oss_classifier
            opensource_classifier_config:
              provider: jev
              deployment_name: cloud/decision
              model: jev-latest
              timeout_ms: 2000
            classifier_fallback: default_model
            classification_mode: user_turn
            session_affinity: false
            deployment_affinity: true
            classifier_context_window_size: 3
            classifier_context_budget_chars: 2400
            classifier_context_per_turn_chars: 800
            classifier_context_include_assistant_turns: true
            enable_context_window_escalation: true
            modality_routing: true
            return_raw_model_name: true

      # Each tier resolves to a deployment with its own default reasoning effort.
      # Direct calls use defaults; auto routes enforce the tier-level effort above.
      - model_name: cloud/codex-luna-low
        model_info:
          mode: responses
          max_input_tokens: 272000
          supports_vision: true
        litellm_params:
          model: chatgpt/gpt-6-luna
          # Shadow pricing at first-party openai/gpt-6-luna API rates ($0.10/$0.50 per M; $0.01/M cached).
          input_cost_per_token: 0.0000001
          output_cost_per_token: 0.0000005
          cache_read_input_token_cost: 0.00000001
          reasoning_effort: low

      - model_name: cloud/codex-luna-high
        model_info:
          mode: responses
          max_input_tokens: 272000
          supports_vision: true
        litellm_params:
          model: chatgpt/gpt-6-luna
          # Shadow pricing at first-party openai/gpt-6-luna API rates ($0.10/$0.50 per M; $0.01/M cached).
          input_cost_per_token: 0.0000001
          output_cost_per_token: 0.0000005
          cache_read_input_token_cost: 0.00000001
          reasoning_effort: high

      - model_name: cloud/codex-sol-high
        model_info:
          mode: responses
          max_input_tokens: 500000
          supports_vision: true
        litellm_params:
          model: chatgpt/gpt-6.1-sol
          # Shadow pricing at first-party openai/gpt-6.1-sol API rates ($2/$10 per M; $0.10/M cached).
          input_cost_per_token: 0.000002
          output_cost_per_token: 0.00001
          cache_read_input_token_cost: 0.0000001
          reasoning_effort: high

      - model_name: cloud/codex-astra-high
        model_info:
          mode: responses
          max_input_tokens: 272000
          supports_vision: true
        litellm_params:
          model: chatgpt/gpt-6-astra
          # Shadow pricing at first-party openai/gpt-6-astra API rates ($10/$50 per M; $1/M cached).
          input_cost_per_token: 0.00001
          output_cost_per_token: 0.00005
          cache_read_input_token_cost: 0.000001
          reasoning_effort: high

      # Expose only ChatGPT models verified against this subscription.
      - model_name: chatgpt/gpt-6.1-sol
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-6.1-sol
          # Shadow pricing at first-party openai/gpt-6.1-sol API rates ($2/$10 per M; $0.10/M cached).
          input_cost_per_token: 0.000002
          output_cost_per_token: 0.00001
          cache_read_input_token_cost: 0.0000001

      - model_name: chatgpt/gpt-6-sol
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-6-sol
          # Shadow pricing at first-party openai/gpt-6-sol API rates ($2/$10 per M; $0.20/M cached).
          input_cost_per_token: 0.000002
          output_cost_per_token: 0.00001
          cache_read_input_token_cost: 0.0000002

      - model_name: chatgpt/gpt-6-astra
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-6-astra
          # Shadow pricing at first-party openai/gpt-6-astra API rates ($10/$50 per M; $1/M cached).
          input_cost_per_token: 0.00001
          output_cost_per_token: 0.00005
          cache_read_input_token_cost: 0.000001

      - model_name: chatgpt/gpt-6-luna
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-6-luna
          # Shadow pricing at first-party openai/gpt-6-luna API rates ($0.10/$0.50 per M; $0.01/M cached).
          input_cost_per_token: 0.0000001
          output_cost_per_token: 0.0000005
          cache_read_input_token_cost: 0.00000001

      - model_name: chatgpt/gpt-5.6-sol
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-5.6-sol
          # Shadow pricing at first-party openai/gpt-5.6-sol API rates ($4/$20 per M; $0.40/M cached).
          input_cost_per_token: 0.000004
          output_cost_per_token: 0.00002
          cache_read_input_token_cost: 0.0000004

      - model_name: chatgpt/gpt-5.6-terra
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-5.6-terra
          # Shadow pricing at first-party openai/gpt-5.6-terra API rates ($2/$12 per M; $0.20/M cached).
          input_cost_per_token: 0.000002
          output_cost_per_token: 0.000012
          cache_read_input_token_cost: 0.0000002

      - model_name: chatgpt/gpt-5.6-luna
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-5.6-luna
          # Shadow pricing at first-party openai/gpt-5.6-luna API rates ($0.20/$1.20 per M; $0.02/M cached).
          input_cost_per_token: 0.0000002
          output_cost_per_token: 0.0000012
          cache_read_input_token_cost: 0.00000002

      - model_name: comfyimage/qwen-image-2.1-turbo
        model_info:
          mode: image_generation
        litellm_params:
          # Generic OpenAI-compatible images; avoid GPT Image parameter assumptions.
          model: hosted_vllm/qwen-image-2.1-turbo
          custom_llm_provider: hosted_vllm
          api_base: http://comfyui.external-proxy.svc.cluster.local:8188/v1
          # ComfyUI is internal; client authentication stays at LiteLLM.
          api_key: unused
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          timeout: 900
          response_format: b64_json

      - model_name: openai/higgs-audio-tts
        model_info:
          mode: audio_speech
        litellm_params:
          model: openai/higgs-audio-tts
          custom_llm_provider: openai
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap

      - model_name: openai/chatterbox-turbo
        model_info:
          mode: audio_speech
        litellm_params:
          model: openai/chatterbox-turbo
          custom_llm_provider: openai
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap

      - model_name: hosted_vllm/*
        model_info:
          mode: chat
          health_check_model: unsloth/gemma-4-e4b-it-qat
        litellm_params:
          model: hosted_vllm/*
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: openrouter/*
        model_info:
          mode: chat
        litellm_params:
          model: openrouter/*
          custom_llm_provider: openrouter
          litellm_credential_name: openrouter

      - model_name: openrouter/free
        model_info:
          mode: chat
        litellm_params:
          model: openrouter/openrouter/free
          custom_llm_provider: openrouter
          litellm_credential_name: openrouter

      - model_name: openrouter/~typesafe/jev-latest
        model_info:
          mode: decisions
        litellm_params:
          model: openrouter/~typesafe/jev-latest
          custom_llm_provider: openrouter
          litellm_credential_name: openrouter

      - model_name: hosted_vllm/d3-mini
        model_info:
          mode: decisions
          max_input_tokens: 16384
        litellm_params:
          model: hosted_vllm/d3-mini
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          # Batch-scale decisions (13K in / ~2.5K out) need more than 20s on pve3;
          # at 20s the primary timed out and every full batch fell back to cloud.
          timeout: 60
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/qwen/qwen3-reranker-0.6b
        model_info:
          mode: rerank
          max_input_tokens: 8192
        litellm_params:
          model: hosted_vllm/qwen/qwen3-reranker-0.6b
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/whisper/large-v3-turbo-q5_0
        model_info:
          mode: audio_transcription
        litellm_params:
          model: hosted_vllm/whisper/large-v3-turbo-q5_0
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/majentik/qwen3-embedding-4b
        model_info:
          mode: embedding
          max_input_tokens: 16384
          output_vector_size: 2560
        litellm_params:
          model: hosted_vllm/majentik/qwen3-embedding-4b
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/whisper/large-v3-q5_0
        model_info:
          mode: audio_transcription
        litellm_params:
          model: hosted_vllm/whisper/large-v3-q5_0
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/unsloth/gemma-4-e4b-it-qat
        model_info:
          mode: chat
          max_input_tokens: 63488
          max_output_tokens: 2048
          supports_function_calling: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/gemma-4-e4b-it-qat
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/unsloth/gemma-4-12b-it-qat-camera
        model_info:
          mode: chat
          max_input_tokens: 30720
          max_output_tokens: 2048
          supports_vision: true
          supports_function_calling: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/gemma-4-12b-it-qat-camera
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/unsloth/qwen3.8-27b
        model_info:
          mode: chat
          max_input_tokens: 253952
          max_output_tokens: 8192
          supports_vision: true
          supports_function_calling: true
          supports_reasoning: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/qwen3.8-27b
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/unsloth/qwen3.8-27b-analysis
        model_info:
          mode: chat
          max_input_tokens: 253952
          max_output_tokens: 8192
          supports_vision: true
          supports_function_calling: true
          supports_reasoning: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/qwen3.8-27b-analysis
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/unsloth/qwen3.8-27b-documents
        model_info:
          mode: chat
          max_input_tokens: 258048
          max_output_tokens: 4096
          supports_vision: true
          supports_function_calling: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/qwen3.8-27b-documents
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/unsloth/qwen3.8-27b-coding
        model_info:
          mode: chat
          max_input_tokens: 253952
          max_output_tokens: 8192
          supports_vision: true
          supports_function_calling: true
          supports_reasoning: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/qwen3.8-27b-coding
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: hosted_vllm/adilkairolla/zeta-2.1
        model_info:
          mode: chat
          max_input_tokens: 32768
          max_output_tokens: 8192
        litellm_params:
          model: hosted_vllm/adilkairolla/zeta-2.1
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      # Native GLM routing uses the same cloud classifier and user-turn policy.
      - model_name: cloud/glm-auto
        model_info:
          mode: chat
          # auto_router/* is unknown to LiteLLM's model catalog, so the router
          # must declare the window itself; 1M is the floor across members
          # (glm-5.3 1,000,000 / glm-5.3-flash 1,048,576).
          max_input_tokens: 1000000
          max_output_tokens: 128000
        litellm_params:
          model: auto_router/complexity_router
          complexity_router_default_model: cloud/glm-high
          complexity_router_config:
            tiers:
              SIMPLE:
                model_name: cloud/glm-flash-low
                litellm_params:
                  reasoning_effort: low
              MEDIUM:
                model_name: cloud/glm-flash-high
                litellm_params:
                  reasoning_effort: high
              COMPLEX:
                model_name: cloud/glm-high
                litellm_params:
                  reasoning_effort: high
              REASONING:
                model_name: cloud/glm-max
                litellm_params:
                  reasoning_effort: max
            classifier_type: oss_classifier
            opensource_classifier_config:
              provider: jev
              deployment_name: cloud/decision
              model: jev-latest
              timeout_ms: 2000
            classifier_fallback: default_model
            classification_mode: user_turn
            session_affinity: false
            deployment_affinity: true
            classifier_context_window_size: 3
            classifier_context_budget_chars: 2400
            classifier_context_per_turn_chars: 800
            classifier_context_include_assistant_turns: true
            enable_context_window_escalation: true
            modality_routing: true
            return_raw_model_name: true

      - model_name: cloud/glm-flash-low
        model_info:
          mode: chat
          reasoning_options:
            - type: effort
              values:
                - low
                - high
                - max
          default_reasoning_effort: low
          input_modalities:
            - text
            - image
          supports_image_input: true
          supports_vision: true
        litellm_params:
          model: zai/glm-5.3-flash
          reasoning_effort: low
          custom_llm_provider: zai
          litellm_credential_name: zai-coding
          allowed_openai_params:
            - reasoning_effort
            - response_format
          tags:
            - zai
            - coding-plan

      - model_name: cloud/glm-flash-high
        model_info:
          mode: chat
          reasoning_options:
            - type: effort
              values:
                - low
                - high
                - max
          default_reasoning_effort: high
          input_modalities:
            - text
            - image
          supports_image_input: true
          supports_vision: true
        litellm_params:
          model: zai/glm-5.3-flash
          reasoning_effort: high
          custom_llm_provider: zai
          litellm_credential_name: zai-coding
          allowed_openai_params:
            - reasoning_effort
            - response_format
          tags:
            - zai
            - coding-plan

      - model_name: cloud/glm-high
        model_info:
          mode: chat
          supports_vision: false
          reasoning_options:
            - type: effort
              values:
                - low
                - high
                - max
          default_reasoning_effort: high
        litellm_params:
          model: zai/glm-5.3
          reasoning_effort: high
          custom_llm_provider: zai
          litellm_credential_name: zai-coding
          allowed_openai_params:
            - reasoning_effort
            - response_format
          tags:
            - zai
            - coding-plan

      - model_name: cloud/glm-max
        model_info:
          mode: chat
          supports_vision: false
          reasoning_options:
            - type: effort
              values:
                - low
                - high
                - max
          default_reasoning_effort: max
        litellm_params:
          model: zai/glm-5.3
          reasoning_effort: max
          custom_llm_provider: zai
          litellm_credential_name: zai-coding
          allowed_openai_params:
            - reasoning_effort
            - response_format
          tags:
            - zai
            - coding-plan

      - model_name: zai-coding/glm-5.3
        model_info:
          mode: chat
          reasoning_options:
            - type: effort
              values:
                - low
                - high
                - max
          default_reasoning_effort: max
        litellm_params:
          model: zai/glm-5.3
          custom_llm_provider: zai
          litellm_credential_name: zai-coding
          allowed_openai_params:
            - reasoning_effort
            - response_format
          tags:
            - zai
            - coding-plan

      - model_name: zai-coding/glm-5.3-flash
        model_info:
          mode: chat
          reasoning_options:
            - type: effort
              values:
                - low
                - high
                - max
          default_reasoning_effort: max
          input_modalities:
            - text
            - image
          supports_image_input: true
          supports_vision: true
        litellm_params:
          model: zai/glm-5.3-flash
          custom_llm_provider: zai
          litellm_credential_name: zai-coding
          allowed_openai_params:
            - reasoning_effort
            - response_format
          tags:
            - zai
            - coding-plan

      - model_name: openrouter/voyageai/rerank-2.5-lite
        model_info:
          mode: rerank
          max_input_tokens: 8192
        litellm_params:
          # Registered by openrouter_rerank.py until upstream supports reranking.
          model: openrouter/voyageai/rerank-2.5-lite
          custom_llm_provider: openrouter
          api_base: https://openrouter.ai/api/v1
          litellm_credential_name: openrouter

    credential_list:
      - credential_name: llama-swap
        credential_values:
          api_base: os.environ/LITELLM_CREDENTIAL_LLAMA_SWAP_API_BASE
          api_key: os.environ/LITELLM_CREDENTIAL_LLAMA_SWAP_API_KEY
        credential_info:
          custom_llm_provider: openai

      - credential_name: openrouter
        credential_values:
          api_key: os.environ/LITELLM_CREDENTIAL_OPENROUTER_API_KEY
        credential_info:
          custom_llm_provider: openrouter

      - credential_name: zai-coding
        credential_values:
          api_base: os.environ/LITELLM_CREDENTIAL_ZAI_CODING_API_BASE
          api_key: os.environ/LITELLM_CREDENTIAL_ZAI_CODING_API_KEY
        credential_info:
          custom_llm_provider: zai

    search_tools:
      - search_tool_name: searxng-search
        litellm_params:
          search_provider: searxng
          api_base: http://searxng-main.utils.svc.cluster.local:8080

    mcp_servers:
      context7:
        url: https://mcp.context7.com/mcp
        transport: http
        auth_type: bearer_token
        auth_value: os.environ/CONTEXT7_API_KEY
        allow_all_keys: true
      dawarich:
        url: http://dawarich-main.utils.svc.cluster.local:3000/api/v1/mcp
        transport: http
        auth_type: bearer_token
        auth_value: os.environ/DAWARICH_API_KEY
        allow_all_keys: false
        available_on_public_internet: false

    guardrails:
      - guardrail_name: headroom-compression
        litellm_params:
          guardrail: headroom
          mode: pre_call
          api_base: http://127.0.0.1:8787
          default_on: true
          unreachable_fallback: fail_open
          timeout: 5
          ccr_retrieval: false
      - guardrail_name: secrets-observer
        litellm_params:
          guardrail: secrets_guardrail.SecretsObserverGuardrail
          mode: [pre_call, post_call]
          default_on: true

    litellm_settings:
      callbacks:
        - prometheus
        - cache_bypass.proxy_handler_instance
      prometheus_exclude_labels:
        - hashed_api_key
        - user_email
        - user
        - user_alias
        - end_user
        - client_ip
        - team
        - team_alias
        - org_id
        - org_alias
        - project_id
        - project_alias
        - model_id
      prometheus_metrics_max_series_per_metric: 2000
      check_provider_endpoint: true
      cache: true
      cache_params:
        type: redis
        host: litellm-valkey
        port: "6379"
        ssl: false

    general_settings:
      disable_env_credential_login: true
      # Keep GitOps config authoritative; LiteLLM DB config rows otherwise override router_settings.
      store_model_in_db: false
      # Team MCP grants are ceilings; virtual keys need an explicit per-key grant.
      require_key_mcp_access_defined: true

    router_settings:
      # Friendly names select primaries; cloud service aliases have explicit failover below.
      model_group_alias:
        cloud/coder: zai-coding/glm-5.3
        cloud/coder-fallback: chatgpt/gpt-6.1-sol
        cloud/deep: chatgpt/gpt-6-sol
        cloud/deep-fallback: zai-coding/glm-5.3
        cloud/decision: openrouter/~typesafe/jev-latest
        cloud/fast: chatgpt/gpt-6-luna
        cloud/fast-fallback: zai-coding/glm-5.3-flash
        cloud/general: zai-coding/glm-5.3
        cloud/general-fallback: chatgpt/gpt-6.1-sol
        cloud/rerank: openrouter/voyageai/rerank-2.5-lite
        local/analysis: hosted_vllm/unsloth/qwen3.8-27b-analysis
        local/automation-lite: hosted_vllm/unsloth/gemma-4-e4b-it-qat
        local/camera-analysis: hosted_vllm/unsloth/gemma-4-12b-it-qat-camera
        local/chat: hosted_vllm/unsloth/qwen3.8-27b
        local/coder: hosted_vllm/unsloth/qwen3.8-27b-coding
        local/completions: hosted_vllm/adilkairolla/zeta-2.1
        local/decision: hosted_vllm/d3-mini
        local/document-analysis: hosted_vllm/unsloth/qwen3.8-27b-documents
        local/document-best: hosted_vllm/unsloth/qwen3.8-27b-analysis
        local/embedding: hosted_vllm/majentik/qwen3-embedding-4b
        local/image: comfyimage/qwen-image-2.1-turbo
        local/rerank: hosted_vllm/qwen/qwen3-reranker-0.6b
        local/stt-fast: hosted_vllm/whisper/large-v3-turbo-q5_0
        local/stt-large: hosted_vllm/whisper/large-v3-q5_0
        local/tts: openai/higgs-audio-tts
        openai/gpt-5.6-luna: chatgpt/gpt-5.6-luna
        openai/gpt-5.6-sol: chatgpt/gpt-5.6-sol
        openai/gpt-5.6-terra: chatgpt/gpt-5.6-terra
        openai/gpt-6-astra: chatgpt/gpt-6-astra
        openai/gpt-6-luna: chatgpt/gpt-6-luna
        openai/gpt-6-sol: chatgpt/gpt-6-sol
        openai/gpt-6.1-sol: chatgpt/gpt-6.1-sol
      # Scope failover to service aliases so explicit model names stay predictable.
      fallbacks:
        - local/decision:
            - model: cloud/decision
              # Cap on the CLOUD fallback call itself, not on local/decision;
              # 2s failed whole requests whenever OpenRouter hiccupped.
              timeout: 30
        # Native modality checks cannot descend from main GLM to a Flash tier.
        - cloud/glm-auto:
            - model: cloud/glm-flash-high
              reasoning_effort: high
        - cloud/glm-flash-low:
            - model: cloud/coder-fallback
              reasoning_effort: low
        - cloud/glm-flash-high:
            - model: cloud/coder-fallback
              reasoning_effort: high
        - cloud/glm-high:
            - model: cloud/coder-fallback
              reasoning_effort: high
        - cloud/glm-max:
            - model: cloud/coder-fallback
              reasoning_effort: max
        - cloud/codex-luna-low:
            - model: cloud/fast-fallback
              reasoning_effort: low
        - cloud/codex-luna-high:
            - model: cloud/fast-fallback
              reasoning_effort: high
        - cloud/codex-sol-high:
            - model: cloud/deep-fallback
              reasoning_effort: high
        - cloud/codex-astra-high:
            - model: cloud/deep-fallback
              reasoning_effort: high
        - cloud/fast:
            - cloud/fast-fallback
        - cloud/general:
            - cloud/general-fallback
        - cloud/coder:
            - cloud/coder-fallback
        - cloud/deep:
            - cloud/deep-fallback
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 6000
      max_fallbacks: 5
      allowed_fails: 3
      cooldown_time: 5
      retry_after: 0
      enable_pre_call_checks: true
      optional_pre_call_checks:
        - encrypted_content_affinity
