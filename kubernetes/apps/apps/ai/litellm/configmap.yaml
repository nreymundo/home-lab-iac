# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      # Expose the upstream ChatGPT catalog under both client-facing prefixes.
      - model_name: openai/*
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/*

      - model_name: chatgpt/*
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/*

      - model_name: local/image
        model_info:
          id: ad05e73c-5ea8-52f6-a958-d04043943833
          mode: image_generation
        litellm_params:
          # Generic OpenAI-compatible images; avoid GPT Image parameter assumptions.
          model: hosted_vllm/qwen-image-2.1-turbo
          custom_llm_provider: hosted_vllm
          api_base: http://comfyui.external-proxy.svc.cluster.local:8188/v1
          # ComfyUI is internal; client authentication stays at LiteLLM.
          api_key: unused
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          timeout: 900
          response_format: b64_json

      - model_name: openai/chatterbox
        model_info:
          mode: audio_speech
          health_check_voice: Abigail.wav
        litellm_params:
          model: openai/chatterbox
          custom_llm_provider: openai
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap

      - model_name: hosted_vllm/*
        model_info:
          mode: chat
          health_check_model: unsloth/gemma-4-e4b-it-qat
        litellm_params:
          model: hosted_vllm/*
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: openrouter/*
        model_info:
          mode: chat
        litellm_params:
          model: openrouter/*
          custom_llm_provider: openrouter
          litellm_credential_name: openrouter
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0

      - model_name: openrouter/free
        model_info:
          mode: chat
        litellm_params:
          model: openrouter/openrouter/free
          custom_llm_provider: openrouter
          litellm_credential_name: openrouter
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0

      - model_name: local/rerank
        model_info:
          mode: rerank
          max_input_tokens: 8192
        litellm_params:
          model: hosted_vllm/qwen/qwen3-reranker-0.6b
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: remote/rerank
        model_info:
          mode: rerank
          max_input_tokens: 8192
        litellm_params:
          # LiteLLM has no native OpenRouter rerank provider; hosted_vllm is the
          # OpenAI-compatible rerank client that posts to {api_base}/rerank.
          model: hosted_vllm/voyageai/rerank-2.5-lite
          custom_llm_provider: hosted_vllm
          api_base: https://openrouter.ai/api/v1
          litellm_credential_name: openrouter
          # Voyage rerank pricing, in USD/token: $0.02 per million input tokens.
          input_cost_per_token: 0.00000002
          output_cost_per_token: 0.0

      - model_name: local/stt-fast
        model_info:
          mode: audio_transcription
        litellm_params:
          model: hosted_vllm/whisper/large-v3-turbo-q5_0
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local/embedding
        model_info:
          mode: embedding
          max_input_tokens: 16384
          output_vector_size: 2560
        litellm_params:
          model: hosted_vllm/majentik/qwen3-embedding-4b
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local/stt-large
        model_info:
          mode: audio_transcription
        litellm_params:
          model: hosted_vllm/whisper/large-v3-q5_0
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local/automation-lite
        model_info:
          mode: chat
          max_input_tokens: 63488
          max_output_tokens: 2048
          supports_function_calling: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/gemma-4-e4b-it-qat
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local/camera-analysis
        model_info:
          mode: chat
          max_input_tokens: 30720
          max_output_tokens: 2048
          supports_vision: true
          supports_function_calling: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/gemma-4-12b-it-qat-camera
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local/chat
        model_info:
          mode: chat
          max_input_tokens: 253952
          max_output_tokens: 8192
          supports_vision: true
          supports_function_calling: true
          supports_reasoning: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/qwen3.8-27b
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local/analysis
        model_info:
          mode: chat
          max_input_tokens: 253952
          max_output_tokens: 8192
          supports_vision: true
          supports_function_calling: true
          supports_reasoning: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/qwen3.8-27b-analysis
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local/document-analysis
        model_info:
          mode: chat
          max_input_tokens: 258048
          max_output_tokens: 4096
          supports_vision: true
          supports_function_calling: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/qwen3.8-27b-documents
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local/document-best
        model_info:
          mode: chat
          max_input_tokens: 253952
          max_output_tokens: 8192
          supports_vision: true
          supports_function_calling: true
          supports_reasoning: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/qwen3.8-27b-analysis
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local/coder
        model_info:
          mode: chat
          max_input_tokens: 253952
          max_output_tokens: 8192
          supports_vision: true
          supports_function_calling: true
          supports_reasoning: true
          supports_tool_choice: true
        litellm_params:
          model: hosted_vllm/unsloth/qwen3.8-27b-coding
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local/tts
        model_info:
          mode: audio_speech
          health_check_voice: Abigail.wav
        litellm_params:
          model: openai/chatterbox
          custom_llm_provider: openai
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap

      - model_name: zai-coding/glm-5.3
        model_info:
          mode: chat
          reasoning_options:
            - type: effort
              values:
                - low
                - high
                - max
          default_reasoning_effort: max
        litellm_params:
          model: zai/glm-5.3
          custom_llm_provider: zai
          litellm_credential_name: zai-coding
          tags:
            - zai
            - coding-plan

      - model_name: zai-coding/glm-5.3-flash
        model_info:
          mode: chat
          reasoning_options:
            - type: effort
              values:
                - low
                - high
                - max
          default_reasoning_effort: max
          input_modalities:
            - text
            - image
          supports_image_input: true
        litellm_params:
          model: zai/glm-5.3-flash
          custom_llm_provider: zai
          litellm_credential_name: zai-coding
          tags:
            - zai
            - coding-plan

      # Keep OmniRoute client-facing names available during the gateway migration.
      - model_name: cloud/fast
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-6-luna

      - model_name: cloud/deep
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-6-sol

      - model_name: cloud/general
        model_info:
          mode: chat
          reasoning_options:
            - type: effort
              values:
                - low
                - high
                - max
          default_reasoning_effort: max
        litellm_params:
          model: zai/glm-5.3
          custom_llm_provider: zai
          litellm_credential_name: zai-coding
          tags:
            - zai
            - coding-plan

      - model_name: cloud/coder
        model_info:
          mode: chat
          reasoning_options:
            - type: effort
              values:
                - low
                - high
                - max
          default_reasoning_effort: max
        litellm_params:
          model: zai/glm-5.3
          custom_llm_provider: zai
          litellm_credential_name: zai-coding
          tags:
            - zai
            - coding-plan

      - model_name: embedding-qwen3-4b-2560
        model_info:
          mode: embedding
          max_input_tokens: 16384
          output_vector_size: 2560
        litellm_params:
          model: hosted_vllm/majentik/qwen3-embedding-4b
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local-stt-large
        model_info:
          mode: audio_transcription
        litellm_params:
          model: hosted_vllm/whisper/large-v3-q5_0
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local-stt-fast
        model_info:
          mode: audio_transcription
        litellm_params:
          model: hosted_vllm/whisper/large-v3-turbo-q5_0
          custom_llm_provider: hosted_vllm
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap
            - pve3
          guardrails: []

      - model_name: local-tts
        model_info:
          mode: audio_speech
          health_check_voice: Abigail.wav
        litellm_params:
          model: openai/chatterbox
          custom_llm_provider: openai
          litellm_credential_name: llama-swap
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          tags:
            - llama-swap

      - model_name: openrouter/voyageai/rerank-2.5-lite
        model_info:
          mode: rerank
          max_input_tokens: 8192
        litellm_params:
          # LiteLLM has no native OpenRouter rerank provider; hosted_vllm is the
          # OpenAI-compatible rerank client that posts to {api_base}/rerank.
          model: hosted_vllm/voyageai/rerank-2.5-lite
          custom_llm_provider: hosted_vllm
          api_base: https://openrouter.ai/api/v1
          litellm_credential_name: openrouter
          # Voyage rerank pricing, in USD/token: $0.02 per million input tokens.
          input_cost_per_token: 0.00000002
          output_cost_per_token: 0.0

      - model_name: comfyimage/qwen-image-2.1-turbo
        model_info:
          mode: image_generation
        litellm_params:
          # Generic OpenAI-compatible images; avoid GPT Image parameter assumptions.
          model: hosted_vllm/qwen-image-2.1-turbo
          custom_llm_provider: hosted_vllm
          api_base: http://comfyui.external-proxy.svc.cluster.local:8188/v1
          # ComfyUI is internal; client authentication stays at LiteLLM.
          api_key: unused
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
          timeout: 900
          response_format: b64_json

    credential_list:
      - credential_name: llama-swap
        credential_values:
          api_base: os.environ/LITELLM_CREDENTIAL_LLAMA_SWAP_API_BASE
          api_key: os.environ/LITELLM_CREDENTIAL_LLAMA_SWAP_API_KEY
        credential_info:
          custom_llm_provider: openai

      - credential_name: openrouter
        credential_values:
          api_key: os.environ/LITELLM_CREDENTIAL_OPENROUTER_API_KEY
        credential_info:
          custom_llm_provider: openrouter

      - credential_name: zai-coding
        credential_values:
          api_base: os.environ/LITELLM_CREDENTIAL_ZAI_CODING_API_BASE
          api_key: os.environ/LITELLM_CREDENTIAL_ZAI_CODING_API_KEY
        credential_info:
          custom_llm_provider: zai

    litellm_settings:
      callbacks:
        - cache_bypass.proxy_handler_instance
      check_provider_endpoint: true
      cache: true
      cache_params:
        type: redis
        host: litellm-valkey
        port: "6379"
        ssl: false

    general_settings:
      # Keep GitOps config authoritative; LiteLLM DB config rows otherwise override router_settings.
      store_model_in_db: false

    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 6000
      max_fallbacks: 5
      allowed_fails: 3
      cooldown_time: 5
      retry_after: 0
      enable_pre_call_checks: false
