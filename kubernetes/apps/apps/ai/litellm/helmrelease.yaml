# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: ai
spec:
  chart:
    spec:
      chart: app-template
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # renovate: datasource=docker depName=berriai/litellm registryUrl=https://ghcr.io
              repository: ghcr.io/berriai/litellm
              tag: v1.106.0
            env:
              TZ: Europe/Berlin
              PYTHONPATH: /etc/litellm
              LITELLM_WORKER_STARTUP_HOOKS: litellm_startup:worker_startup_hook
              STORE_MODEL_IN_DB: "True"
              CONFIG_FILE_PATH: /etc/litellm/config.yaml
              PROMETHEUS_MULTIPROC_DIR: /var/lib/litellm-prometheus
              CHATGPT_TOKEN_DIR: /var/lib/litellm/chatgpt
              CHATGPT_AUTH_FILE: auth.json
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: litellm-db-secrets
                    key: DATABASE_URL
              LITELLM_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-secrets
                    key: LITELLM_MASTER_KEY
              LITELLM_SALT_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-secrets
                    key: LITELLM_SALT_KEY
              GENERIC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: litellm-sso-secret
                    key: CLIENT_ID
              GENERIC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: litellm-sso-secret
                    key: CLIENT_SECRET
              GENERIC_AUTHORIZATION_ENDPOINT: https://sso.${CLUSTER_DOMAIN}/application/o/authorize/
              GENERIC_TOKEN_ENDPOINT: https://sso.${CLUSTER_DOMAIN}/application/o/token/
              GENERIC_USERINFO_ENDPOINT: https://sso.${CLUSTER_DOMAIN}/application/o/userinfo/
              GENERIC_SCOPE: "openid profile email litellm"
              GENERIC_USER_ROLE_ATTRIBUTE: litellm_role
              PROXY_BASE_URL: https://litellm.lan.${CLUSTER_DOMAIN}
              AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
              SET_DEBUG: "False"
              GUARDRAIL_SECRETS_MODE: "redact"
              GUARDRAIL_SECRETS_JUDGE: "async"
              GUARDRAIL_SECRETS_JUDGE_WAIT_SECONDS: "3"
              GUARDRAIL_SECRETS_JUDGE_STORE: "valkey"
              GUARDRAIL_SECRETS_JUDGE_REDIS_URL: redis://litellm-valkey:6379/1
            envFrom:
              - secretRef:
                  name: litellm-credentials
              - secretRef:
                  name: litellm-guardrail-fingerprints
            ports:
              - name: http
                containerPort: 4000
              - name: metrics
                containerPort: 4001
            args:
              - --port
              - "4000"
              - --prometheus_metrics_port
              - "4001"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 4000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  failureThreshold: 60
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 1536Mi
              limits:
                memory: 2Gi

          headroom:
            image:
              # renovate: datasource=docker depName=headroomlabs-ai/headroom registryUrl=https://ghcr.io
              repository: ghcr.io/headroomlabs-ai/headroom
              tag: 0.41.0
            args:
              - --host
              - 127.0.0.1
              - --port
              - "8787"
            env:
              HOME: /home/nonroot
              PYTHONPATH: /etc/headroom
              HEADROOM_WORKSPACE_DIR: /home/nonroot/.headroom
              HEADROOM_CONFIG_DIR: /home/nonroot/.headroom/config
              HEADROOM_TELEMETRY: "off"
              HEADROOM_BEACON: "off"
              # LiteLLM owns provider calls; this container only compresses/retrieves.
              HEADROOM_SKIP_UPSTREAM_CHECK: "1"
              # Preserve user instructions; compress tool results.
              HEADROOM_COMPRESS_USER_MESSAGES: "0"
              HEADROOM_WORKERS: "1"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python
                      - -S
                      - -c
                      - >-
                        import urllib.request;
                        urllib.request.urlopen('http://127.0.0.1:8787/livez', timeout=3)
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python
                      - -S
                      - -c
                      - >-
                        import urllib.request;
                        urllib.request.urlopen('http://127.0.0.1:8787/readyz', timeout=3)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python
                      - -S
                      - -c
                      - >-
                        import urllib.request;
                        urllib.request.urlopen('http://127.0.0.1:8787/livez', timeout=3)
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

      valkey:
        containers:
          valkey:
            image:
              # renovate: datasource=docker depName=valkey/valkey registryUrl=https://docker.io
              repository: docker.io/valkey/valkey
              tag: 9-alpine
            command:
              - valkey-server
              - --save
              - ""
              - --appendonly
              - "no"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - redis-cli ping || exit 1
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - redis-cli ping || exit 1
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 4000
      valkey:
        controller: valkey
        ports:
          valkey:
            port: 6379

    persistence:
      headroom-data:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            headroom:
              - path: /home/nonroot
      data:
        enabled: true
        type: custom
        volumeSpec:
          persistentVolumeClaim:
            claimName: litellm
        advancedMounts:
          main:
            main:
              - path: /var/lib/litellm
      prometheus-data:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /var/lib/litellm-prometheus
      valkey-data:
        enabled: true
        type: emptyDir
        advancedMounts:
          valkey:
            valkey:
              - path: /data
      config:
        enabled: true
        type: configMap
        name: litellm-config
        advancedMounts:
          main:
            headroom:
              - path: /etc/headroom/sitecustomize.py
                subPath: headroom_pricing.py
                readOnly: true
            main:
              - path: /etc/litellm/config.yaml
                subPath: config.yaml
                readOnly: true
              - path: /etc/litellm/cache_bypass.py
                subPath: cache_bypass.py
                readOnly: true
              - path: /etc/litellm/vllm_model_discovery.py
                subPath: vllm_model_discovery.py
                readOnly: true
              - path: /etc/litellm/chatgpt_responses_streaming_patch.py
                subPath: chatgpt_responses_streaming_patch.py
                readOnly: true
              - path: /etc/litellm/chatgpt_codex_catalog.py
                subPath: chatgpt_codex_catalog.py
                readOnly: true
              - path: /etc/litellm/zai_coding_catalog.py
                subPath: zai_coding_catalog.py
                readOnly: true
              - path: /etc/litellm/litellm_startup.py
                subPath: litellm_startup.py
                readOnly: true
              - path: /etc/litellm/openrouter_rerank.py
                subPath: openrouter_rerank.py
                readOnly: true
              - path: /etc/litellm/sitecustomize.py
                subPath: sitecustomize.py
                readOnly: true
              - path: /etc/litellm/secrets_guardrail.py
                subPath: secrets_guardrail.py
                readOnly: true
