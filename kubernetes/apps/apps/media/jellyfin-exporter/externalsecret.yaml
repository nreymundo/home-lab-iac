# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-exporter-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-runtime
  target:
    name: jellyfin-exporter-secret
    type: Opaque
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JELLYFIN_ADDRESS
      remoteRef:
        key: dqcuyxfpwztrpuw75ydrpnrvpu/INCLUSTER_ADDRESS
    - secretKey: JELLYFIN_TOKEN
      remoteRef:
        key: dqcuyxfpwztrpuw75ydrpnrvpu/TOKEN
