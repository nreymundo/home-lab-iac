apiVersion: batch/v1
kind: CronJob
metadata:
  name: bookorbit-reconcile
  namespace: media
  annotations:
    checkov.io/skip1: CKV_K8S_35=Management API credentials are supplied through Kubernetes Secret environment references.
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: ghcr.io/bookorbit/bookorbit:3.2.0
              imagePullPolicy: Always
              command:
                - node
                - /config/reconcile.mjs
              env:
                - name: BOOKORBIT_API_URL
                  value: http://bookorbit.media.svc.cluster.local:3000
                - name: OIDC_ISSUER_URI
                  value: https://sso.${CLUSTER_DOMAIN}/application/o/bookorbit/
                - name: PROWLARR_URL
                  value: http://prowlarr.media.svc.cluster.local:9696
                - name: PROWLARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: prowlarr-secrets
                      key: API_KEY
                - name: SMTP_HOST
                  value: smtp.purelymail.com
                - name: SMTP_PORT
                  value: "587"
                - name: SMTP_FROM_ADDRESS
                  value: bookorbit@${CLUSTER_DOMAIN}
                - name: SMTP_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: bookorbit-secrets
                      key: SMTP_USERNAME
                - name: SMTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: bookorbit-secrets
                      key: SMTP_PASSWORD
                - name: BOOTSTRAP_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: bookorbit-secrets
                      key: BOOTSTRAP_USERNAME
                - name: BOOTSTRAP_NAME
                  valueFrom:
                    secretKeyRef:
                      name: bookorbit-secrets
                      key: BOOTSTRAP_NAME
                - name: BOOTSTRAP_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: bookorbit-secrets
                      key: BOOTSTRAP_EMAIL
                - name: BOOTSTRAP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: bookorbit-secrets
                      key: BOOTSTRAP_PASSWORD
                - name: SETUP_BOOTSTRAP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: bookorbit-secrets
                      key: SETUP_BOOTSTRAP_TOKEN
                - name: OIDC_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: bookorbit-sso-secret
                      key: CLIENT_ID
                - name: OIDC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: bookorbit-sso-secret
                      key: CLIENT_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: reconcile
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: reconcile
              configMap:
                name: bookorbit-reconcile
                defaultMode: 292
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
