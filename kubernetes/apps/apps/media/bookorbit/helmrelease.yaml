# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookorbit
  namespace: media
spec:
  chart:
    spec:
      chart: app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-nas-directories:
            image:
              repository: docker.io/library/busybox
              tag: 1.36.1
            command:
              - sh
              - -ec
              - >-
                mkdir -p /nas-root/libraries/reading/bookorbit/library/comics
                /nas-root/libraries/reading/bookorbit/library/books
                /nas-root/libraries/reading/bookorbit/library/audiobooks
                /nas-root/libraries/reading/bookorbit/incoming
                /nas-root/libraries/reading/bookorbit/appdata
                /nas-root/libraries/reading/bookorbit/tmp
        containers:
          main:
            image:
              # renovate: datasource=docker depName=bookorbit/bookorbit registryUrl=https://ghcr.io
              repository: ghcr.io/bookorbit/bookorbit
              tag: "3.2.0"
            env:
              TZ: Europe/Berlin
              APP_URL: https://bookorbit.lan.${CLUSTER_DOMAIN}
              APP_DATA_PATH: /nas/appdata
              BOOK_DOCK_PATH: /nas/incoming
              LIBRARY_BROWSE_ROOT: /nas/library
              TMPDIR: /nas/tmp
              PUID: "99"
              PGID: "100"
              BOOKORBIT_FIX_PERMISSIONS: "false"
              OIDC_ALLOW_LOCAL_ISSUERS: "true"
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secrets
                    key: JWT_SECRET
              BOOK_REQUEST_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secrets
                    key: BOOK_REQUEST_ENCRYPTION_KEY
              SETUP_BOOTSTRAP_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secrets
                    key: SETUP_BOOTSTRAP_TOKEN
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-db-secrets
                    key: DATABASE_URL
            ports:
              - name: http
                containerPort: 3000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    ingress:
      main:
        annotations:
          external-dns.kubernetes.io/hostname: bookorbit.lan.${CLUSTER_DOMAIN}
        hosts:
          - host: bookorbit.lan.${CLUSTER_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
    persistence:
      nas-root:
        type: nfs
        server: ${UNRAID_IP}
        path: /mnt/user/media
        advancedMounts:
          main:
            init-nas-directories:
              - path: /nas-root
            main:
              - path: /nas
                subPath: libraries/reading/bookorbit
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /tmp
