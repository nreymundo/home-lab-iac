# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
components:
  - ../../../../components/bjw-s-defaults
  - ../../../../components/ingress/traefik-base
configMapGenerator:
  - name: bookorbit-reconcile
    files:
      - reconcile.mjs
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
resources:
  - bookorbit-secrets.sops.yaml
  - bookorbit-db-secrets.sops.yaml
  - cnpg-cluster.yaml
  - helmrelease.yaml
  - reconcile-cronjob.yaml
replacements:
  - source:
      kind: HelmRelease
      name: bookorbit
      fieldPath: spec.values.controllers.main.containers.main.image.repository
    targets:
      - select:
          kind: CronJob
          name: bookorbit-reconcile
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=reconcile].image
        options:
          delimiter: ':'
          index: 0
  - source:
      kind: HelmRelease
      name: bookorbit
      fieldPath: spec.values.controllers.main.containers.main.image.tag
    targets:
      - select:
          kind: CronJob
          name: bookorbit-reconcile
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=reconcile].image
        options:
          delimiter: ':'
          index: 1
