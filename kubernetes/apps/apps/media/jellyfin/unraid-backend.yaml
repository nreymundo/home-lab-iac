---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  ports:
    - name: http
      port: 8096
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin-unraid
  namespace: media
  labels:
    kubernetes.io/service-name: jellyfin
    endpointslice.kubernetes.io/managed-by: fluxcd.io
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8096
endpoints:
  - addresses:
      - "${JELLYFIN_IP}"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-default-chain@kubernetescrd
    external-dns.kubernetes.io/hostname: jellyfin.${CLUSTER_DOMAIN}
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.${CLUSTER_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
