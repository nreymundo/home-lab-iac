apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tautulli
  namespace: media
spec:
  chart:
    spec:
      chart: app-template
  values:
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # renovate: datasource=docker depName=linuxserver/tautulli registryUrl=https://lscr.io
              repository: lscr.io/linuxserver/tautulli
              tag: 2.17.2
            env:
              TZ: Europe/Berlin
              PLEX_URL: http://plex.media.svc.cluster.local:32400
              PLEX_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: tautulli-secrets
                    key: PLEX_TOKEN
              RADARR_URL: http://radarr.media.svc.cluster.local:7878
              RADARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: tautulli-secrets
                    key: RADARR_API_KEY
              # Proxy-mode HTTP basic auth overrides. Tautulli reads these env
              # vars before config.ini, so the PVC form-login state is preserved
              # untouched and a revert restores the prior root routing/auth.
              TAUTULLI_HTTP_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: tautulli-basic-auth-pbk-secret
                    key: USERNAME
              TAUTULLI_HTTP_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: tautulli-basic-auth-pbk-secret
                    key: PBK
              TAUTULLI_HTTP_BASIC_AUTH: "1"
            ports:
              - name: http
                containerPort: 8181
            resources:
              requests:
                cpu: 25m
                memory: 144Mi
              limits:
                memory: 512Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8181
    ingress:
      api:
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: traefik-lan-allowlist@kubernetescrd
        hosts:
          - host: tautulli.lan.${CLUSTER_DOMAIN}
            paths:
              - path: /api
                service:
                  identifier: main
                  port: http
      newsletter:
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: traefik-lan-allowlist@kubernetescrd
        hosts:
          - host: tautulli.lan.${CLUSTER_DOMAIN}
            paths:
              - path: /newsletter
                service:
                  identifier: main
                  port: http
      image:
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: traefik-lan-allowlist@kubernetescrd
        hosts:
          - host: tautulli.lan.${CLUSTER_DOMAIN}
            paths:
              - path: /image
                service:
                  identifier: main
                  port: http
    persistence:
      data:
        enabled: true
        type: custom
        volumeSpec:
          persistentVolumeClaim:
            claimName: tautulli
        globalMounts:
          - path: /config
      scripts:
        enabled: true
        type: configMap
        name: tautulli-scripts
        defaultMode: 365
        globalMounts:
          - path: /config/scripts
            readOnly: true
