# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: airtrail-pg
  namespace: lifestyle
  labels:
    release: observability-kube-prometheus-stack
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/backup-daily: enabled
      recurring-job.longhorn.io/backup-weekly: enabled
  instances: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  monitoring:
    enablePodMonitor: true
  storage:
    size: 5Gi
    storageClass: longhorn-r2

  imageName: ghcr.io/cloudnative-pg/postgresql:16

  postgresql:
    parameters:
      wal_level: "replica"
      archive_timeout: "21600"
      archive_mode: "on"

  bootstrap:
    recovery:
      database: airtrail
      owner: airtrail
      secret:
        name: airtrail-db-secrets
      volumeSnapshots:
        storage:
          name: airtrail-pg-copy
          kind: PersistentVolumeClaim
          apiGroup: ""

  backup:
    barmanObjectStore:
      wal:
        compression: gzip
      data:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
        region:
          name: cnpg-backup-s3
          key: AWS_DEFAULT_REGION
      destinationPath: "s3://cloudnative-pg/airtrail"
      endpointURL: "https://s3.${CLUSTER_DOMAIN}"
      serverName: "airtrail-pg-v2"
    retentionPolicy: "21d"
