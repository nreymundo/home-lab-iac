# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: dawarich
  namespace: lifestyle
  labels:
    release: observability-kube-prometheus-stack
spec:
  metricsPath: /metrics
  scrapeInterval: 30s
  basicAuth:
    username:
      name: dawarich-secrets
      key: METRICS_USERNAME
    password:
      name: dawarich-secrets
      key: METRICS_PASSWORD
  staticConfigs:
    - labels:
        job: dawarich
      targets:
        - dawarich-main.lifestyle.svc.cluster.local:3000
