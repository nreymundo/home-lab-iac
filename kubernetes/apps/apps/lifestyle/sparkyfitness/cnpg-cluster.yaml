# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sparkyfitness-pg
  namespace: lifestyle
  labels:
    release: observability-kube-prometheus-stack
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/backup-daily: enabled
      recurring-job.longhorn.io/backup-weekly: enabled
  instances: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  monitoring:
    enablePodMonitor: true
  storage:
    size: 5Gi
    storageClass: longhorn-r2
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  postgresql:
    parameters:
      wal_level: replica
      archive_timeout: '21600'
      archive_mode: 'on'
  bootstrap:
    recovery:
      source: origin
      database: sparkyfitness
      owner: sparkyfitness
      secret:
        name: sparkyfitness-db-owner
  externalClusters:
    - name: origin
      barmanObjectStore:
        destinationPath: s3://cloudnative-pg/sparkyfitness
        endpointURL: https://s3.${CLUSTER_DOMAIN}
        serverName: sparkyfitness-pg-v2
        s3Credentials:
          accessKeyId:
            name: cnpg-backup-s3
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: cnpg-backup-s3
            key: ACCESS_SECRET_KEY
          region:
            name: cnpg-backup-s3
            key: AWS_DEFAULT_REGION
        wal:
          maxParallel: 8
  backup:
    barmanObjectStore:
      wal:
        compression: gzip
      data:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
        region:
          name: cnpg-backup-s3
          key: AWS_DEFAULT_REGION
      destinationPath: s3://cloudnative-pg/sparkyfitness
      endpointURL: https://s3.${CLUSTER_DOMAIN}
      serverName: sparkyfitness-pg-v3
    retentionPolicy: 21d
  managed:
    roles:
      - name: sparkyfitness_app
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        passwordSecret:
          name: sparkyfitness-db-app

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: sparkyfitness-pg-backup
  namespace: lifestyle
spec:
  schedule: 0 0 0 * * 0
  backupOwnerReference: self
  cluster:
    name: sparkyfitness-pg
  method: barmanObjectStore
