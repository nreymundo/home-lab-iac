# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/persistentvolumeclaim.json
# Sidekiq queues + Rails cache only (RDB persistence). Operational state, not
# authoritative data: single replica and deliberately no Longhorn
# recurring-backup labels — Postgres and the sure PVC stay authoritative.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sure-valkey
  namespace: utils
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-r1
  resources:
    requests:
      storage: 3Gi
