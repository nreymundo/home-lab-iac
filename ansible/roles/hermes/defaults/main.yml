---
# Hermes application and VM operator user.
hermes_user_name: hermes
hermes_user_state: present
hermes_user_home: "/home/{{ hermes_user_name }}"
hermes_user_shell: /bin/bash
hermes_xdg_directories:
  - Desktop
  - Documents
  - Downloads
  - Music
  - Pictures
  - Projects
  - Public
  - Templates
  - Videos

# NOPASSWD sudoers file granting the hermes operator deliberate full VM control.
hermes_sudoers_file: /etc/sudoers.d/hermes
hermes_sudoers_file_mode: "0440"

# Minimal prerequisites for the official native installer.
hermes_prerequisite_packages:
  - git
  - curl
  - ca-certificates

# Official installer. Fresh installations use the upstream default branch at
# install time.
hermes_installer_url: https://hermes-agent.nousresearch.com/install.sh
hermes_native_home: "{{ hermes_user_home }}/.hermes"
hermes_checkout_path: "{{ hermes_native_home }}/hermes-agent"
hermes_binary_path: "{{ hermes_user_home }}/.local/bin/hermes"
hermes_environment_file: "{{ hermes_native_home }}/.env"

# System-level gateway service.
hermes_service_name: hermes-gateway
hermes_service_enabled: true
hermes_service_state: started

# Reusable gateway unit template inputs; named-profile units override these
# per profile with the profile HERMES_HOME, no environment file, and the
# profile name. The default unit renders the values above.
hermes_gateway_home: "{{ hermes_native_home }}"
hermes_gateway_environment_file: "{{ hermes_environment_file }}"
hermes_gateway_profile_name: ""

# Named gateway profiles: one per direct child directory of this path, each
# rendered as a disabled hermes-gateway-<profile>.service unit.
hermes_profiles_path: "{{ hermes_native_home }}/profiles"
hermes_profile_gateway_service_prefix: "{{ hermes_service_name }}-"

# System-level Hermes dashboard service.
hermes_dashboard_service_name: hermes-dashboard
hermes_dashboard_service_enabled: true
hermes_dashboard_service_state: started
# Bind the dashboard to the VM's LAN address rather than 0.0.0.0 so the
# listener itself is unreachable from other interfaces; UFW still governs
# which source subnets may connect. WireGuard clients reach it via their
# routed LAN address, no separate bind or firewall rule needed.
hermes_dashboard_host: 192.168.10.100
hermes_dashboard_port: 9119
