---
# Hermes VM provisioning: native installer, operator user, and sudoers.

- name: Validate Hermes role is supported on this OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "Hermes role currently supports only Debian-family hosts"
    quiet: true

- name: Install native Hermes installer prerequisites
  ansible.builtin.apt:
    name: "{{ hermes_prerequisite_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify: Restart Hermes gateway

- name: Ensure hermes user exists
  ansible.builtin.user:
    name: "{{ hermes_user_name }}"
    state: "{{ hermes_user_state }}"
    create_home: true
    home: "{{ hermes_user_home }}"
    shell: "{{ hermes_user_shell }}"

- name: Ensure Hermes XDG home directories exist
  ansible.builtin.file:
    path: "{{ hermes_user_home }}/{{ item }}"
    state: directory
    owner: "{{ hermes_user_name }}"
    group: "{{ hermes_user_name }}"
    mode: "0755"
  loop: "{{ hermes_xdg_directories }}"

- name: Install validated NOPASSWD sudoers file for hermes
  ansible.builtin.copy:
    dest: "{{ hermes_sudoers_file }}"
    owner: root
    group: root
    mode: "{{ hermes_sudoers_file_mode }}"
    content: |
      # Managed by Ansible - hermes VM operator has full passwordless sudo.
      {{ hermes_user_name }} ALL=(ALL) NOPASSWD:ALL
    validate: 'visudo -csf %s'

- name: Ensure native Hermes binary directory exists
  ansible.builtin.file:
    path: "{{ hermes_user_home }}/.local/bin"
    state: directory
    owner: "{{ hermes_user_name }}"
    group: "{{ hermes_user_name }}"
    mode: "0755"

- name: Inspect native Hermes checkout
  ansible.builtin.stat:
    path: "{{ hermes_checkout_path }}"
  register: hermes_checkout_stat

- name: Inspect native Hermes binary
  ansible.builtin.stat:
    path: "{{ hermes_binary_path }}"
  register: hermes_binary_stat

- name: Refuse an orphan native Hermes binary
  ansible.builtin.assert:
    that:
      - hermes_checkout_stat.stat.exists or not hermes_binary_stat.stat.exists
    fail_msg: >-
      Hermes binary {{ hermes_binary_path }} exists without its native checkout at
      {{ hermes_checkout_path }}; refusing to replace an existing native install.
    quiet: true

- name: Install native Hermes with the official installer
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL {{ hermes_installer_url }} | bash -s -- --skip-setup --non-interactive
  register: hermes_install_run
  changed_when: hermes_install_run.rc == 0
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ hermes_user_name }}"
  environment:
    HOME: "{{ hermes_user_home }}"
  when:
    - not ansible_check_mode
    - not hermes_binary_stat.stat.exists
    - not hermes_checkout_stat.stat.exists
  notify:
    - Restart Hermes gateway
    - Restart Hermes dashboard

- name: Recheck native Hermes binary after installation
  ansible.builtin.stat:
    path: "{{ hermes_binary_path }}"
  register: hermes_verified_binary
  when:
    - not ansible_check_mode
    - hermes_install_run is changed
    - not hermes_checkout_stat.stat.exists

- name: Verify native Hermes binary exists after fresh installation
  ansible.builtin.assert:
    that:
      - hermes_verified_binary.stat.exists
    fail_msg: >-
      Native Hermes installation did not create the expected binary at
      {{ hermes_binary_path }}.
    quiet: true
  when:
    - not ansible_check_mode
    - hermes_install_run is changed
    - not hermes_checkout_stat.stat.exists

- name: Mark native Hermes installation as verified
  ansible.builtin.set_fact:
    hermes_install_verified: true
  when: not ansible_check_mode

- name: Install Hermes gateway systemd unit
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: "/etc/systemd/system/{{ hermes_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Hermes gateway

- name: Enable and start Hermes gateway service
  ansible.builtin.systemd_service:
    name: "{{ hermes_service_name }}"
    state: "{{ hermes_service_state }}"
    enabled: "{{ hermes_service_enabled }}"
    daemon_reload: true
  when: not ansible_check_mode

- name: Inspect named Hermes profiles directory
  ansible.builtin.stat:
    path: "{{ hermes_profiles_path }}"
  register: hermes_profiles_directory

- name: Find named Hermes profiles
  ansible.builtin.find:
    paths: "{{ hermes_profiles_path }}"
    file_type: directory
    recurse: false
  register: hermes_profile_directories
  when: hermes_profiles_directory.stat.isdir | default(false)

- name: Gather named Hermes gateway service facts
  ansible.builtin.service_facts:
  when: hermes_profiles_directory.stat.isdir | default(false)

- name: Install named Hermes gateway systemd units
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: >-
      /etc/systemd/system/{{ hermes_profile_gateway_service_prefix }}{{ item.path | basename }}.service
    owner: root
    group: root
    mode: "0644"
  vars:
    hermes_gateway_home: "{{ item.path }}"
    hermes_gateway_environment_file: ""
    hermes_gateway_profile_name: "{{ item.path | basename }}"
  loop: "{{ hermes_profile_directories.files | default([]) }}"
  register: hermes_profile_gateway_units
  loop_control:
    label: "{{ item.path | basename }}"
  when: hermes_profiles_directory.stat.isdir | default(false)

- name: Disable named Hermes gateway services at boot
  ansible.builtin.systemd_service:
    name: "{{ hermes_profile_gateway_service_prefix }}{{ item.path | basename }}"
    enabled: false
    daemon_reload: true
  loop: "{{ hermes_profile_directories.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - not ansible_check_mode
    - hermes_profiles_directory.stat.isdir | default(false)

- name: Restart changed running named Hermes gateway services
  ansible.builtin.systemd_service:
    name: "{{ hermes_profile_gateway_service_prefix }}{{ item.item.path | basename }}"
    state: restarted
    daemon_reload: true
  loop: "{{ hermes_profile_gateway_units.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when:
    - not ansible_check_mode
    - item.changed
    - >-
      (ansible_facts.services | default({})).get(
      hermes_profile_gateway_service_prefix ~ (item.item.path | basename) ~ '.service', {}
      ).state | default('stopped') == 'running'

- name: Find installed named Hermes gateway systemd units
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "{{ hermes_profile_gateway_service_prefix }}*.service"
    file_type: file
    recurse: false
  register: hermes_profile_gateway_unit_files

- name: Record active Hermes profile names
  ansible.builtin.set_fact:
    hermes_profile_names: >-
      {{ hermes_profile_directories.files | default([]) | map(attribute='path') | map('basename') | list }}

- name: Stop and disable stale named Hermes gateway services
  ansible.builtin.systemd_service:
    name: "{{ item.path | basename }}"
    state: stopped
    enabled: false
  loop: "{{ hermes_profile_gateway_unit_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - not ansible_check_mode
    - >-
      (item.path | basename
      | regex_replace('^' ~ hermes_profile_gateway_service_prefix, '')
      | regex_replace('\.service$', '')) not in hermes_profile_names

- name: Remove stale named Hermes gateway systemd units
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ hermes_profile_gateway_unit_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: hermes_stale_profile_gateway_unit_removal
  when: >-
    (item.path | basename
    | regex_replace('^' ~ hermes_profile_gateway_service_prefix, '')
    | regex_replace('\.service$', '')) not in hermes_profile_names

- name: Reload systemd after pruning stale named Hermes gateway units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - hermes_stale_profile_gateway_unit_removal is changed

- name: Inspect legacy Hermes serve systemd unit
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-serve.service
  register: hermes_legacy_serve_unit

- name: Stop and disable legacy Hermes serve service
  ansible.builtin.systemd_service:
    name: hermes-serve
    state: stopped
    enabled: false
    daemon_reload: true
  when:
    - not ansible_check_mode
    - hermes_legacy_serve_unit.stat.exists

- name: Remove legacy Hermes serve systemd unit
  ansible.builtin.file:
    path: /etc/systemd/system/hermes-serve.service
    state: absent
  when: hermes_legacy_serve_unit.stat.exists

- name: Install Hermes dashboard systemd unit
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: "/etc/systemd/system/{{ hermes_dashboard_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Hermes dashboard

- name: Enable and start Hermes dashboard service
  ansible.builtin.systemd_service:
    name: "{{ hermes_dashboard_service_name }}"
    state: "{{ hermes_dashboard_service_state }}"
    enabled: "{{ hermes_dashboard_service_enabled }}"
    daemon_reload: true
  when: not ansible_check_mode
