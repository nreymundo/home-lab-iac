---
# Hermes VM provisioning: native installer, operator user, and sudoers.

- name: Prepare Hermes installation
  ansible.builtin.import_tasks: install-prerequisites.yml

- name: Configure Hermes operator identity
  ansible.builtin.import_tasks: identity.yml

- name: Install native Hermes
  ansible.builtin.import_tasks: install.yml

- name: Configure default Hermes gateway
  ansible.builtin.import_tasks: default-gateway.yml

- name: Configure named Hermes profiles
  ansible.builtin.import_tasks: named-profiles.yml

- name: Configure Hermes dashboard
  ansible.builtin.import_tasks: dashboard.yml
