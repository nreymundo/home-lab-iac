---
- name: Power | Validate requested policy
  ansible.builtin.assert:
    that:
      - host_power_backend in ['none', 'sysfs', 'power-profiles-daemon']
      - host_power_backend != 'power-profiles-daemon' or (host_power_cpu_governor | length == 0 and host_power_cpu_epp | length == 0 and host_power_cpu_boost is none and host_power_platform_profile | length == 0)
      - host_power_backend != 'none' or (host_power_cpu_governor | length == 0 and host_power_cpu_epp | length == 0 and host_power_cpu_boost is none and host_power_platform_profile | length == 0 and host_power_rapl_limits | length == 0)
      - host_power_rapl_limits is sequence and host_power_rapl_limits is not string
    fail_msg: >-
      host_power_backend must be none, sysfs, or power-profiles-daemon. PPD and sysfs CPU controls are mutually exclusive;
      backend none requires CPU and RAPL controls disabled; powertop may be independently enabled.
  tags: [power, preflight]

- name: Power | Install selected backend packages
  ansible.builtin.apt:
    name: "{{ (['power-profiles-daemon'] if host_power_backend == 'power-profiles-daemon' else []) + (['powertop'] if host_power_powertop_auto_tune else []) }}"
    state: present
    update_cache: false
  when: host_power_backend == 'power-profiles-daemon' or host_power_powertop_auto_tune
  tags: [power]

- name: Power | Install sysfs policy helper
  ansible.builtin.copy:
    src: host_power.py
    dest: /usr/local/libexec/host-power
    owner: root
    group: root
    mode: "0755"
  when: host_power_backend != 'none'
  notify: Apply host power policy
  tags: [power]

- name: Power | Install policy configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/host-power.json
    owner: root
    group: root
    mode: "0644"
  when: host_power_backend != 'none'
  notify: Apply host power policy
  tags: [power]

- name: Power | Install policy systemd unit
  ansible.builtin.template:
    src: host-power-policy.service.j2
    dest: /etc/systemd/system/host-power-policy.service
    owner: root
    group: root
    mode: "0644"
  when: host_power_backend != 'none'
  notify:
    - Reload host power systemd units
    - Apply host power policy
  tags: [power]

- name: Power | Install optional powertop unit
  ansible.builtin.template:
    src: host-power-powertop.service.j2
    dest: /etc/systemd/system/host-power-powertop.service
    owner: root
    group: root
    mode: "0644"
  when: host_power_powertop_auto_tune
  notify:
    - Reload host power systemd units
    - Apply host powertop auto-tune
  tags: [power]

- name: Power | Stop competing policy controllers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ host_power_known_competing_services + (['power-profiles-daemon.service'] if host_power_backend == 'sysfs' else []) }}"
  failed_when: false
  when: (host_power_backend != 'none' or host_power_powertop_auto_tune) and not ansible_check_mode
  tags: [power]

- name: Power | Enable policy service
  ansible.builtin.systemd:
    name: host-power-policy.service
    enabled: true
    state: started
    daemon_reload: true
  when: host_power_backend != 'none' and not ansible_check_mode
  tags: [power]

- name: Power | Enable powertop auto-tune service
  ansible.builtin.systemd:
    name: host-power-powertop.service
    enabled: true
    state: started
    daemon_reload: true
  when: host_power_powertop_auto_tune and not ansible_check_mode
  tags: [power]

- name: Power | Stop role-owned policy units when disabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - host-power-policy.service
  failed_when: false
  when: host_power_backend == 'none' and not ansible_check_mode
  tags: [power]

- name: Power | Remove role-owned policy files when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/host-power-policy.service
    - /etc/host-power.json
    - /usr/local/libexec/host-power
  notify: Reload host power systemd units
  when: host_power_backend == 'none'
  tags: [power]

- name: Power | Remove powertop unit when disabled
  ansible.builtin.systemd:
    name: host-power-powertop.service
    enabled: false
    state: stopped
  failed_when: false
  when: not host_power_powertop_auto_tune and not ansible_check_mode
  tags: [power]

- name: Power | Remove powertop unit file when disabled
  ansible.builtin.file:
    path: /etc/systemd/system/host-power-powertop.service
    state: absent
  notify: Reload host power systemd units
  when: not host_power_powertop_auto_tune
  tags: [power]
