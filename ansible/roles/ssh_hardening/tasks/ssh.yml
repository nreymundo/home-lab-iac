---
- name: Require 1Password service account credentials for SSH key discovery
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'OP_SERVICE_ACCOUNT_TOKEN') | length > 0
      - lookup('ansible.builtin.env', 'IAC_1PASSWORD_VAULT_ID') | length > 0
    fail_msg: >-
      ssh_hardening_authorized_keys is not set; export nonempty
      OP_SERVICE_ACCOUNT_TOKEN and IAC_1PASSWORD_VAULT_ID environment
      variables to discover authorized SSH keys from 1Password.
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false
  when: ssh_hardening_authorized_keys is none

- name: List authorized SSH key items from 1Password
  ansible.builtin.command:
    argv:
      - op
      - item
      - list
      - --vault
      - "{{ lookup('ansible.builtin.env', 'IAC_1PASSWORD_VAULT_ID') }}"
      - --categories
      - "SSH Key"
      - --tags
      - "{{ ssh_hardening_authorized_keys_1password_tag }}"
      - --format
      - json
  delegate_to: localhost
  become: false
  run_once: true
  register: ssh_hardening_authorized_key_items
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - ssh_hardening_authorized_keys is none
    - lookup('ansible.builtin.env', 'IAC_1PASSWORD_VAULT_ID') | length > 0
    - ssh_hardening_authorized_keys_1password_tag is not none

- name: Read authorized SSH keys from 1Password
  ansible.builtin.command:
    argv:
      - op
      - read
      - "op://{{ lookup('ansible.builtin.env', 'IAC_1PASSWORD_VAULT_ID') }}/{{ item.id }}/public key"
  loop: >-
    {{
      (ssh_hardening_authorized_key_items | default({'stdout': '[]'})).stdout
      | from_json
      | sort(attribute='id')
    }}
  delegate_to: localhost
  become: false
  run_once: true
  register: ssh_hardening_authorized_key_reads
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - ssh_hardening_authorized_keys is none
    - lookup('ansible.builtin.env', 'IAC_1PASSWORD_VAULT_ID') | length > 0
    - ssh_hardening_authorized_keys_1password_tag is not none

- name: Require authorized SSH keys from 1Password
  ansible.builtin.assert:
    that:
      - >-
        (ssh_hardening_authorized_key_items.stdout | from_json | length) > 0
    fail_msg: >-
      No SSH Key items matched the configured 1Password vault and tag.
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false
  when:
    - ssh_hardening_authorized_keys is none
    - lookup('ansible.builtin.env', 'IAC_1PASSWORD_VAULT_ID') | length > 0
    - ssh_hardening_authorized_keys_1password_tag is not none

- name: Resolve effective SSH hardening inputs
  ansible.builtin.set_fact:
    ssh_hardening_user_effective: >-
      {{ ssh_hardening_user if ssh_hardening_user is not none else (common_user | default('pi')) }}
    ssh_hardening_authorized_keys_effective: >-
      {{
        ssh_hardening_authorized_keys
        if ssh_hardening_authorized_keys is not none
        else (
          (ssh_hardening_authorized_key_reads | default({'results': []})).results
          | map(attribute='stdout_lines', default=[])
          | flatten
          | map('trim')
          | reject('equalto', '')
          | list
          if (
            lookup('ansible.builtin.env', 'IAC_1PASSWORD_VAULT_ID') | length > 0
            and ssh_hardening_authorized_keys_1password_tag is not none
          )
          else (common_authorized_keys | default([]))
        )
      }}
    ssh_hardening_enable_hushlogin_effective: >-
      {{ ssh_hardening_enable_hushlogin if ssh_hardening_enable_hushlogin is not none else (common_enable_hushlogin | default(true)) }}
    ssh_hardening_sshd_settings_effective: >-
      {{ ssh_hardening_sshd_settings if ssh_hardening_sshd_settings is not none else (common_sshd_hardening | default({
        'PermitRootLogin': 'no',
        'PasswordAuthentication': 'no',
        'ChallengeResponseAuthentication': 'no'
      })) }}

- name: Ensure user home exists
  ansible.builtin.file:
    path: "/home/{{ ssh_hardening_user_effective }}"
    state: directory
    owner: "{{ ssh_hardening_user_effective }}"
    group: "{{ ssh_hardening_user_effective }}"
    mode: "0755"
  when: ssh_hardening_user_effective | lower != 'root'

- name: Ensure authorized SSH keys are authoritative
  ansible.posix.authorized_key:
    user: "{{ ssh_hardening_user_effective }}"
    state: present
    key: "{{ ssh_hardening_authorized_keys_effective | join('\n') }}"
    exclusive: true
  when: ssh_hardening_authorized_keys_effective | length > 0

- name: Ensure sshd runtime directory exists for config validation
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure sshd configuration drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_os_family == 'Debian'

- name: Configure Ubuntu sshd hardening drop-in before cloud-init settings
  ansible.builtin.template:
    src: 00-ansible-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  when: ansible_os_family == 'Debian'
  notify: Restart sshd

- name: Ensure Debian sshd configuration includes drop-ins before all directives
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    insertbefore: BOF
    marker: "# {mark} ANSIBLE MANAGED SSH DROP-IN INCLUDE"
    block: "Include /etc/ssh/sshd_config.d/*.conf"
    validate: "/usr/sbin/sshd -t -f %s"
  when: ansible_os_family == 'Debian'
  notify: Restart sshd

- name: Harden RedHat sshd configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value }}"
    validate: "/usr/sbin/sshd -t -f %s"
    create: false
    state: present
    backup: true
  loop: "{{ ssh_hardening_sshd_settings_effective | dict2items }}"
  when: ansible_os_family == 'RedHat'
  notify: Restart sshd

- name: Verify effective sshd security settings
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
      - -f
      - /etc/ssh/sshd_config
  register: ssh_hardening_effective_sshd
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Assert effective sshd settings match requested hardening policy
  ansible.builtin.assert:
    that:
      - >-
        (ssh_hardening_effective_sshd.stdout
        | lower | regex_search('(?m)^' ~ ('kbdinteractiveauthentication' if item.key | lower in ['challengeresponseauthentication', 'kbdinteractiveauthentication'] else item.key | lower) ~ '\\s+\\S+')
        | default('') | replace('without-password', 'prohibit-password')) == ('kbdinteractiveauthentication' if item.key | lower in ['challengeresponseauthentication', 'kbdinteractiveauthentication'] else item.key | lower) ~ ' ' ~ (item.value | string | lower | replace('without-password', 'prohibit-password'))
    fail_msg: "sshd effective setting {{ item.key }} does not match {{ item.value }}."
  loop: "{{ ssh_hardening_sshd_settings_effective | dict2items }}"
  when: not ansible_check_mode

- name: Ensure hush login file exists
  ansible.builtin.copy:
    dest: "/home/{{ ssh_hardening_user_effective }}/.hushlogin"
    content: ""
    force: false
    owner: "{{ ssh_hardening_user_effective }}"
    group: "{{ ssh_hardening_user_effective }}"
    mode: "0644"
  when:
    - ssh_hardening_enable_hushlogin_effective | bool
    - ssh_hardening_user_effective | lower != 'root'

- name: Refresh sshd to pick up config changes
  ansible.builtin.meta: flush_handlers
