---
# K3s installation defaults
k3s_version: "v1.36.4+k3s1"
k3s_operation: reconcile
k3s_admin_host: ""
k3s_bootstrap_host: ""
k3s_admin_api_url: "https://{{ k3s_api_vip }}:6443"
k3s_join_url: "https://{{ k3s_api_vip }}:6443"
k3s_token_file: /etc/rancher/k3s/server-token
k3s_storage_mode: manual
k3s_storage_path: /var/lib/longhorn
k3s_storage_expected_uuid: ""
k3s_storage_expected_source: ""
k3s_disable_multipathd: true
k3s_drain_timeout: 10m
k3s_drain_force: false
k3s_drain_disable_eviction: false
k3s_ready_retries: 60
k3s_ready_delay: 5
k3s_fetch_kubeconfig: false
k3s_kubeconfig_destination: "{{ playbook_dir }}/../k3s.yaml"
k3s_embedded_registry_enabled: true
# Embedded registry/P2P (Spegel) is retained; Harbor routing has been removed.
# Default upstream fallback is enabled, so K3s pulls directly from upstream
# registries (e.g. docker.io) when the embedded registry cannot serve an image.
# The --disable-default-registry-endpoint flag is intentionally not passed.
# Wildcard mirror keeps the embedded registry/P2P intercepting all image pulls
# without forcing specific endpoints or rewrites. Per-registry Harbor endpoints
# and rewrites have been removed.
k3s_registry_mirrors:
  "*": {}

# Virtual IP set up in OPNSense for K3s API load balancing
k3s_api_vip: 192.168.10.10

# Checksums for K3s binaries - ensures integrity verification
k3s_amd64_checksum: "835873f37245fc615f547a2fe2af9402a347875f13fa64a1f136de644955ea3f"
k3s_arm64_checksum: "c920706346d5ad4e5cd3c7bf1bb09ce71ebe07fec829e513e40f1caf98aed8bb"

# Default to inventory IP, but allow overrides (e.g. for VLANs)
k3s_node_ip: "{{ ansible_host }}"
k3s_iface: "{{ ansible_default_ipv4.interface | default('') }}"
k3s_allow_workloads: true

# K3s dependency packages per OS family.
k3s_dependency_packages_by_os:
  Debian:
    - curl
    - open-iscsi
    - cryptsetup
    - nfs-common
    - xfsprogs
    - parted
    - util-linux
  RedHat:
    - curl
    - iscsi-initiator-utils
    - cryptsetup

k3s_dependency_packages: "{{ k3s_dependency_packages_by_os.get(ansible_os_family, []) }}"

# OS Tuning
k3s_os_tuning_enabled: true
k3s_fs_inotify_max_user_watches: 1048576
k3s_fs_inotify_max_user_instances: 1024
k3s_fs_inotify_max_queued_events: 32768
k3s_nofile_limit: 1048576

# Intel GPU perf counters (for OpenVINO stats in containers)
k3s_enable_gpu_perf_sysctl: true
k3s_perf_event_paranoid: 0
k3s_kptr_restrict: 0
