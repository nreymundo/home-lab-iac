---
- name: Read selected node metadata
  ansible.builtin.command:
    argv: "{{ k3s_kubectl_argv + ['get', 'node', inventory_hostname, '-o', 'json'] }}"
  delegate_to: "{{ k3s_control_host }}"
  register: k3s_metadata
  changed_when: false
  check_mode: false

- name: Report planned label changes
  ansible.builtin.debug:
    msg: "Would set {{ item.key }}={{ item.value }} on {{ inventory_hostname }}"
  loop: "{{ k3s_node_labels | default({}) | dict2items }}"
  when:
    - ansible_check_mode
    - (k3s_metadata.stdout | from_json).metadata.labels.get(item.key, '') != (item.value | string)
  changed_when: true

- name: Apply declared labels that differ
  ansible.builtin.command:
    argv: "{{ k3s_kubectl_argv + ['label', 'node', inventory_hostname, item.key + '=' + (item.value | string), '--overwrite'] }}"
  delegate_to: "{{ k3s_control_host }}"
  loop: "{{ k3s_node_labels | default({}) | dict2items }}"
  when:
    - not ansible_check_mode
    - (k3s_metadata.stdout | from_json).metadata.labels.get(item.key, '') != (item.value | string)
  changed_when: true

- name: Determine current workload scheduling policy
  ansible.builtin.set_fact:
    k3s_workload_taints: >-
      {{ (k3s_metadata.stdout | from_json).spec.taints | default([])
         | selectattr('key', 'equalto', 'workloads')
         | selectattr('effect', 'equalto', 'NoSchedule') | list }}

- name: Disable workloads when requested
  ansible.builtin.command:
    argv: "{{ k3s_kubectl_argv + ['taint', 'node', inventory_hostname, 'workloads=disabled:NoSchedule', '--overwrite'] }}"
  delegate_to: "{{ k3s_control_host }}"
  when:
    - not ansible_check_mode
    - not k3s_allow_workloads | bool
    - k3s_workload_taints | length == 0 or k3s_workload_taints[0].value | default('') != 'disabled'
  changed_when: true

- name: Enable workloads when requested
  ansible.builtin.command:
    argv: "{{ k3s_kubectl_argv + ['taint', 'node', inventory_hostname, 'workloads:NoSchedule-'] }}"
  delegate_to: "{{ k3s_control_host }}"
  when:
    - not ansible_check_mode
    - k3s_allow_workloads | bool
    - k3s_workload_taints | length > 0
  changed_when: true

- name: Report planned workload taint changes
  ansible.builtin.debug:
    msg: "Would reconcile workloads:NoSchedule on {{ inventory_hostname }} (allow workloads={{ k3s_allow_workloads }})"
  changed_when: true
  when:
    - ansible_check_mode
    - >-
      (k3s_allow_workloads | bool and k3s_workload_taints | length > 0) or
      (not k3s_allow_workloads | bool and
       (k3s_workload_taints | length == 0 or k3s_workload_taints[0].value | default('') != 'disabled'))
