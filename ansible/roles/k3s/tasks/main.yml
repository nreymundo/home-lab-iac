---
- name: Validate the selected server and operation
  ansible.builtin.import_tasks: preflight.yml

- name: Read existing cluster state independently of selected targets
  ansible.builtin.include_tasks: access.yml
  when: k3s_operation != 'bootstrap'

- name: Configure cluster host prerequisites
  ansible.builtin.import_tasks: prerequisites.yml
  when: not k3s_existing_server

- name: Inspect existing host prerequisites without reprovisioning
  ansible.builtin.import_tasks: inspect-prerequisites.yml
  when: k3s_existing_server

- name: Prepare and validate Longhorn storage
  ansible.builtin.import_tasks: storage.yml

- name: Determine configuration and binary changes before draining
  ansible.builtin.import_tasks: plan.yml
  when: k3s_operation != 'upgrade'

- name: Plan a binary-only upgrade
  ansible.builtin.set_fact:
    k3s_desired_files: []
    k3s_configuration_changed: false
    k3s_changed_files: []
    k3s_binary_changed: "{{ k3s_installed_version != k3s_version }}"
    k3s_restart_required: "{{ k3s_installed_version != k3s_version or k3s_running_version != k3s_version }}"
  when: k3s_operation == 'upgrade'

- name: Apply selected server changes
  ansible.builtin.include_tasks: maintenance.yml
  when: not ansible_check_mode

- name: Report planned server maintenance
  ansible.builtin.debug:
    msg:
      operation: "{{ k3s_operation }}"
      new_server: "{{ not k3s_existing_server }}"
      restart_required: "{{ k3s_restart_required }}"
      configuration_changes: "{{ k3s_changed_files }}"
  when: ansible_check_mode

- name: Preview selected existing node metadata changes
  ansible.builtin.include_tasks: metadata.yml
  when:
    - ansible_check_mode
    - k3s_existing_server
    - k3s_operation != 'upgrade'
