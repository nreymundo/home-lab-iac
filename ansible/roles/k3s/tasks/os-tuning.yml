---
- name: Configure Kubernetes inotify limits
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    sysctl_file: /etc/sysctl.d/99-zzz-k3s-inotify.conf
    sysctl_set: true
    reload: true
  loop: "{{ k3s_inotify_values | dict2items }}"
  vars:
    k3s_inotify_values:
      fs.inotify.max_user_watches: "{{ k3s_fs_inotify_max_user_watches }}"
      fs.inotify.max_user_instances: "{{ k3s_fs_inotify_max_user_instances }}"
      fs.inotify.max_queued_events: "{{ k3s_fs_inotify_max_queued_events }}"

- name: Set nofile limits for interactive sessions
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      * soft nofile {{ k3s_nofile_limit }}
      * hard nofile {{ k3s_nofile_limit }}

- name: Discover Intel render devices independently of CPU vendor
  ansible.builtin.shell: |
    for vendor in /sys/class/drm/renderD*/device/vendor; do
      if [ -r "$vendor" ] && [ "$(cat "$vendor")" = "0x8086" ]; then
        echo intel
        break
      fi
    done
  register: k3s_intel_gpu
  changed_when: false
  check_mode: false

- name: Configure requested Intel GPU performance counters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    sysctl_file: /etc/sysctl.d/99-zzz-k3s-gpu-perf.conf
    sysctl_set: true
    reload: true
  loop: "{{ k3s_gpu_values | dict2items }}"
  vars:
    k3s_gpu_values:
      kernel.perf_event_paranoid: "{{ k3s_perf_event_paranoid }}"
      kernel.kptr_restrict: "{{ k3s_kptr_restrict }}"
  when:
    - k3s_enable_gpu_perf_sysctl | bool
    - k3s_intel_gpu.stdout == 'intel'

- name: Remove the managed GPU performance policy when disabled or inapplicable
  ansible.builtin.file:
    path: /etc/sysctl.d/99-zzz-k3s-gpu-perf.conf
    state: absent
  when: not (k3s_enable_gpu_perf_sysctl | bool and k3s_intel_gpu.stdout == 'intel')
