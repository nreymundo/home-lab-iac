---
- name: Read administrative kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ k3s_control_host }}"
  register: k3s_kubeconfig_raw
  no_log: true

- name: Write private controller kubeconfig with the API endpoint
  ansible.builtin.copy:
    content: >-
      {{ k3s_kubeconfig_raw.content | b64decode
         | replace('https://127.0.0.1:6443', 'https://' + (k3s_api_vip | string) + ':6443') }}
    dest: "{{ k3s_kubeconfig_destination }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  diff: false
