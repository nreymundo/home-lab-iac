---
- name: Ensure llama-swap supports this OS family
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
    fail_msg: "llama_swap currently supports Linux containers only"

- name: Resolve latest llama-swap release metadata from GitHub
  ansible.builtin.uri:
    url: "{{ llama_swap_release_api_url }}"
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    status_code: 200
    validate_certs: true
  check_mode: false
  register: llama_swap_release

- name: Select llama-swap Linux amd64 release asset
  ansible.builtin.set_fact:
    llama_swap_release_assets: >-
      {{ llama_swap_release.json.assets | default([]) | selectattr('name', 'match', llama_swap_asset_pattern) | list }}

- name: Assert llama-swap release asset resolved uniquely
  ansible.builtin.assert:
    that:
      - llama_swap_release.json.tag_name | default('') | length > 0
      - llama_swap_release_assets | length == 1
      - (llama_swap_release_assets[0].digest | default('')) is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      Expected exactly one llama-swap release asset matching {{ llama_swap_asset_pattern }} with a
      sha256 digest from {{ llama_swap_release_api_url }}, got
      {{ llama_swap_release_assets | length }} matching asset(s) for tag
      {{ llama_swap_release.json.tag_name | default('<none>') }}

- name: Set llama-swap latest release facts
  ansible.builtin.set_fact:
    llama_swap_latest_tag: "{{ llama_swap_release.json.tag_name }}"
    llama_swap_archive_name: "{{ llama_swap_release_assets[0].name }}"
    llama_swap_archive_url: "{{ llama_swap_release_assets[0].browser_download_url }}"
    llama_swap_archive_checksum: "{{ llama_swap_release_assets[0].digest }}"
    llama_swap_release_dir: "{{ llama_swap_install_dir }}/releases/{{ llama_swap_release.json.tag_name }}"
    llama_swap_archive_path: "{{ llama_swap_install_dir }}/{{ llama_swap_release_assets[0].name }}"

- name: Ensure llama-swap directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ llama_swap_install_dir }}"
      mode: "0755"
    - path: "{{ llama_swap_release_dir }}"
      mode: "0755"
    - path: "{{ llama_swap_config_dir }}"
      mode: "0755"
    - path: "{{ llama_swap_state_dir }}"
      mode: "0755"

- name: Download llama-swap release archive
  ansible.builtin.get_url:
    url: "{{ llama_swap_archive_url }}"
    dest: "{{ llama_swap_archive_path }}"
    checksum: "{{ llama_swap_archive_checksum }}"
    owner: root
    group: root
    mode: "0644"
  register: llama_swap_archive

- name: Extract llama-swap release archive
  ansible.builtin.unarchive:
    src: "{{ llama_swap_archive_path }}"
    dest: "{{ llama_swap_release_dir }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ llama_swap_release_dir }}/llama-swap"

- name: Install llama-swap binary
  ansible.builtin.copy:
    src: "{{ llama_swap_release_dir }}/llama-swap"
    dest: "{{ llama_swap_bin_path }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart llama-swap

- name: Find stale llama-swap release directories
  ansible.builtin.find:
    paths: "{{ llama_swap_install_dir }}/releases"
    file_type: directory
    recurse: false
  register: llama_swap_release_dirs

- name: Remove stale llama-swap release directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ llama_swap_release_dirs.files | default([]) | map(attribute='path') | list }}"
  when: item != llama_swap_release_dir

- name: Find stale llama-swap release archives
  ansible.builtin.find:
    paths: "{{ llama_swap_install_dir }}"
    patterns: "llama-swap_*.tar.gz"
    file_type: file
    recurse: false
  register: llama_swap_release_archives

- name: Remove stale llama-swap release archives
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ llama_swap_release_archives.files | default([]) | map(attribute='path') | list }}"
  when: item != llama_swap_archive_path

- name: Check llama-swap config
  ansible.builtin.stat:
    path: "{{ llama_swap_config_path }}"
  register: llama_swap_config_stat

- name: Find GGUF models for initial llama-swap config
  ansible.builtin.find:
    paths: "{{ llama_swap_models_dir }}"
    patterns: "*.gguf"
    recurse: true
    file_type: file
  register: llama_swap_discovered_models
  when: not llama_swap_config_stat.stat.exists

- name: Check whisper model directory for initial llama-swap config
  ansible.builtin.stat:
    path: "{{ llama_swap_whisper_models_dir }}"
  register: llama_swap_whisper_models_dir_stat
  when: not llama_swap_config_stat.stat.exists

- name: Find Whisper models for initial llama-swap config
  ansible.builtin.find:
    paths: "{{ llama_swap_whisper_models_dir }}"
    patterns: "{{ llama_swap_whisper_model_patterns }}"
    recurse: true
    file_type: file
  register: llama_swap_discovered_whisper_models
  when:
    - not llama_swap_config_stat.stat.exists
    - llama_swap_whisper_models_dir_stat.stat.isdir | default(false)

- name: Assert initial llama-swap config has models
  ansible.builtin.assert:
    that:
      - >-
        (llama_swap_discovered_models.files | default([]) | length > 0)
        or (llama_swap_discovered_whisper_models.files | default([]) | length > 0)
    fail_msg: >-
      No GGUF models found under {{ llama_swap_models_dir }} and no Whisper models found under
      {{ llama_swap_whisper_models_dir }} for initial llama-swap config
  when: not llama_swap_config_stat.stat.exists

- name: Create initial llama-swap config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ llama_swap_config_path }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  notify: Restart llama-swap
  when: not llama_swap_config_stat.stat.exists

- name: Install llama-swap systemd unit
  ansible.builtin.template:
    src: llama-swap.service.j2
    dest: "/etc/systemd/system/{{ llama_swap_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart llama-swap

- name: Flush llama-swap handlers
  ansible.builtin.meta: flush_handlers

- name: Manage llama-swap service
  ansible.builtin.service:
    name: "{{ llama_swap_service_name }}"
    enabled: "{{ llama_swap_enabled | bool }}"
    state: "{{ 'started' if llama_swap_enabled | bool else 'stopped' }}"

- name: Validate llama-swap health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llama_swap_listen.split(':')[-1] }}/health"
    return_content: true
    status_code: 200
  register: llama_swap_health
  when: llama_swap_enabled | bool

- name: Assert llama-swap health response
  ansible.builtin.assert:
    that:
      - llama_swap_health.content == 'OK'
    fail_msg: "llama-swap health endpoint did not return OK"
  when: llama_swap_enabled | bool
