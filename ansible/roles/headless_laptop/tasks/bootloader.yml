---
# common now owns all requested kernel arguments.
- name: Remove superseded headless laptop GRUB drop-ins
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/default/grub.d/99-headless-laptop.cfg
    - /etc/default/grub.d/zz-headless-laptop.cfg
  notify:
    - Update grub
    - Mark GRUB reboot required
