---
- name: Read ASUS Quiet fan curves
  ansible.builtin.command:
    argv: ["{{ homebrew_prefix }}/bin/asusctl", fan-curve, --mod-profile, Quiet]
  register: headless_laptop_asusd_curves
  changed_when: false
  check_mode: false

- name: Set ASUS Quiet CPU and GPU fan curves
  ansible.builtin.command:
    argv:
      - "{{ homebrew_prefix }}/bin/asusctl"
      - fan-curve
      - --mod-profile
      - Quiet
      - --fan
      - "{{ item }}"
      - --data
      - "{{ headless_laptop_asusd_fan_curve }}"
  loop: [cpu, gpu]
  vars:
    fan: "{{ item | upper }}"
    temps: "{{ headless_laptop_asusd_fan_curve.split(',') | map('regex_replace', 'c:.*$', '') | join(', ') }}"
    pwm: "{{ headless_laptop_asusd_fan_curve.split(',') | map('regex_replace', '^.*c:', '') | join(', ') }}"
  when: >-
    ('fan: ' ~ fan ~ ', pwm: (' ~ pwm ~ '), temp: (' ~ temps ~ '),') not in
    (headless_laptop_asusd_curves.stdout.split() | join(' '))
  changed_when: true

- name: Enable both ASUS Quiet fan curves
  ansible.builtin.command:
    argv: ["{{ homebrew_prefix }}/bin/asusctl", fan-curve, --mod-profile, Quiet, --enable-fan-curves, 'true']
  when: "'enabled: false' in headless_laptop_asusd_curves.stdout"
  changed_when: true
