---
# Syncthing runs as the dev user's systemd user service, not the packaged
# system template unit. Linger keeps the user manager (and with it the
# service) running without an active login session. The dev account is
# created by Terraform cloud-init and is never created here.

- name: Enable lingering for the development user
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ development_workstation_user }}"
    creates: "/var/lib/systemd/linger/{{ development_workstation_user }}"

- name: Enable and start Syncthing user service for the development user
  ansible.builtin.systemd_service:
    name: "{{ development_workstation_syncthing_service }}"
    scope: user
    state: started
    enabled: true
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ development_workstation_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ development_workstation_user_uid }}/bus"
  become: true
  become_user: "{{ development_workstation_user }}"
  when: not ansible_check_mode
