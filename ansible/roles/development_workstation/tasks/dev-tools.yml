---
# User-scoped tooling for the Terraform-created dev account. Tasks that
# install into the user's home run as that user, never as root.

- name: Install Checkov with pipx for the development user
  ansible.builtin.command:
    argv:
      - pipx
      - install
      - "{{ development_workstation_checkov_package }}"
    creates: "{{ development_workstation_user_home }}/.local/bin/{{ development_workstation_checkov_package }}"
  become: true
  become_user: "{{ development_workstation_user }}"

- name: Add pipx user binaries to PATH for the development user
  ansible.builtin.lineinfile:
    path: "{{ development_workstation_user_home }}/.bashrc"
    create: true
    owner: "{{ development_workstation_user }}"
    group: "{{ development_workstation_user_group }}"
    mode: "0644"
    line: 'export PATH="$HOME/.local/bin:$PATH"'

- name: Install pinned Ansible collections for the development user
  ansible.builtin.command:
    argv:
      - ansible-galaxy
      - collection
      - install
      - "{{ item.name }}:=={{ item.version }}"
    creates: "{{ development_workstation_user_home }}/.ansible/collections/ansible_collections/{{ item.name.split('.')[0] }}/{{ item.name.split('.')[1] }}"
  loop: "{{ development_workstation_collections }}"
  become: true
  become_user: "{{ development_workstation_user }}"
