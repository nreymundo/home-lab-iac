# --- mikefarah/yq -----------------------------------------------------------

- name: Download pinned yq binary
  ansible.builtin.get_url:
    url: "{{ development_workstation_yq_binary_url }}"
    dest: "{{ development_workstation_download_dir }}/{{ development_workstation_yq_binary_url | basename }}"
    mode: "0644"

- name: Download yq official release checksums asset
  ansible.builtin.get_url:
    url: "{{ development_workstation_yq_checksums_url }}"
    dest: "{{ development_workstation_download_dir }}/checksums"
    mode: "0644"

- name: Verify and install pinned yq release
  when: not ansible_check_mode
  block:
    # The checksums asset is a multi-algorithm manifest, so every 64-hex
    # token on the yq_linux_amd64 line is a SHA-256-family candidate.
    - name: Extract yq SHA-256 candidates from release checksums
      ansible.builtin.command:
        argv:
          - awk
          - '$1 == "{{ development_workstation_yq_asset }}" { for (i = 2; i <= NF; i++) if ($i ~ /^[0-9a-f]{64}$/) print $i }'
          - checksums
        chdir: "{{ development_workstation_download_dir }}"
      register: development_workstation_yq_expected
      changed_when: false

    - name: Compute yq binary SHA-256
      ansible.builtin.command:
        argv:
          - sha256sum
          - "{{ development_workstation_yq_asset }}"
        chdir: "{{ development_workstation_download_dir }}"
      register: development_workstation_yq_actual
      changed_when: false

    - name: Assert yq binary matches the official release checksums
      ansible.builtin.assert:
        that:
          - development_workstation_yq_actual.stdout.split()[0] in development_workstation_yq_expected.stdout_lines
        fail_msg: >-
          {{ development_workstation_yq_asset }} does not match the official
          yq release checksums asset.
        quiet: true

    - name: Install yq binary into /usr/local/bin
      ansible.builtin.copy:
        src: "{{ development_workstation_download_dir }}/{{ development_workstation_yq_binary_url | basename }}"
        dest: "{{ development_workstation_yq_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
