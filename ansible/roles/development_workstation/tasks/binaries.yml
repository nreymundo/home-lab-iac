---
# Pinned upstream releases. Every artifact is downloaded to a staging
# directory, integrity-checked, and installed with durable root-owned
# defaults. No curl|shell pipelines.

- name: Create development tool staging directory
  ansible.builtin.file:
    path: "{{ development_workstation_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# --- Flux ------------------------------------------------------------------

- name: Download pinned Flux archive
  ansible.builtin.get_url:
    url: "{{ development_workstation_flux_archive_url }}"
    dest: "{{ development_workstation_download_dir }}/{{ development_workstation_flux_archive_url | basename }}"
    checksum: "{{ development_workstation_flux_checksum }}"
    mode: "0644"

- name: Install pinned Flux release
  when: not ansible_check_mode
  block:
    - name: Create Flux extraction directory
      ansible.builtin.file:
        path: "{{ development_workstation_download_dir }}/flux-{{ development_workstation_flux_version }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract pinned Flux archive
      ansible.builtin.unarchive:
        src: "{{ development_workstation_download_dir }}/{{ development_workstation_flux_archive_url | basename }}"
        dest: "{{ development_workstation_download_dir }}/flux-{{ development_workstation_flux_version }}"
        remote_src: true
        creates: "{{ development_workstation_download_dir }}/flux-{{ development_workstation_flux_version }}/flux"

    - name: Install Flux binary into /usr/local/bin
      ansible.builtin.copy:
        src: "{{ development_workstation_download_dir }}/flux-{{ development_workstation_flux_version }}/flux"
        dest: "{{ development_workstation_flux_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

# --- Helm ------------------------------------------------------------------

- name: Download pinned Helm archive
  ansible.builtin.get_url:
    url: "{{ development_workstation_helm_archive_url }}"
    dest: "{{ development_workstation_download_dir }}/{{ development_workstation_helm_archive_url | basename }}"
    mode: "0644"

- name: Download Helm official sha256sum asset
  ansible.builtin.get_url:
    url: "{{ development_workstation_helm_checksum_url }}"
    dest: "{{ development_workstation_download_dir }}/{{ development_workstation_helm_checksum_url | basename }}"
    mode: "0644"

- name: Install pinned Helm release
  when: not ansible_check_mode
  block:
    - name: Verify Helm archive against the official sha256sum asset
      ansible.builtin.command:
        argv:
          - sha256sum
          - --check
          - "{{ development_workstation_helm_checksum_url | basename }}"
        chdir: "{{ development_workstation_download_dir }}"
      changed_when: false

    - name: Create Helm extraction directory
      ansible.builtin.file:
        path: "{{ development_workstation_download_dir }}/helm-{{ development_workstation_helm_version }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract pinned Helm archive
      ansible.builtin.unarchive:
        src: "{{ development_workstation_download_dir }}/{{ development_workstation_helm_archive_url | basename }}"
        dest: "{{ development_workstation_download_dir }}/helm-{{ development_workstation_helm_version }}"
        remote_src: true
        creates: "{{ development_workstation_download_dir }}/helm-{{ development_workstation_helm_version }}/linux-amd64/helm"

    - name: Install Helm binary into /usr/local/bin
      ansible.builtin.copy:
        src: "{{ development_workstation_download_dir }}/helm-{{ development_workstation_helm_version }}/linux-amd64/helm"
        dest: "{{ development_workstation_helm_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

# --- SOPS ------------------------------------------------------------------

- name: Download pinned SOPS package
  ansible.builtin.get_url:
    url: "{{ development_workstation_sops_deb_url }}"
    dest: "{{ development_workstation_download_dir }}/{{ development_workstation_sops_deb_url | basename }}"
    checksum: "{{ development_workstation_sops_checksum }}"
    mode: "0644"

- name: Install pinned SOPS package
  ansible.builtin.apt:
    deb: "{{ development_workstation_download_dir }}/{{ development_workstation_sops_deb_url | basename }}"
    state: present
  when: not ansible_check_mode

