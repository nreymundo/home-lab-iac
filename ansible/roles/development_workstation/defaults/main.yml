---
# development_workstation role defaults.
#
# The login user is created by Terraform cloud-init; this role configures
# tooling for that account and never creates users or credentials.

development_workstation_user: dev

# Baseline apt packages. Ubuntu's "yq" package is intentionally excluded:
# it is a different project from mikefarah/yq.
development_workstation_baseline_packages:
  - ansible
  - ansible-lint
  - ca-certificates
  - cifs-utils
  - curl
  - git
  - gnupg
  - jq
  - pipx
  - pre-commit
  - python3-pip
  - python3-venv
  - ripgrep
  - shellcheck
  - shfmt
  - tar
  - unzip

# Root-owned staging directory for Herdr and uv bootstrappers.
development_workstation_download_dir: /var/tmp/development_workstation

# --- Official signed APT repositories -------------------------------------

# HashiCorp (Terraform, Packer). The suite tracks the running Ubuntu release.
development_workstation_hashicorp_key_url: https://apt.releases.hashicorp.com/gpg
development_workstation_hashicorp_keyring: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
development_workstation_hashicorp_repo_url: https://apt.releases.hashicorp.com
development_workstation_hashicorp_list: /etc/apt/sources.list.d/hashicorp.list

# 1Password CLI. The repository path is architecture-keyed.
development_workstation_onepassword_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
development_workstation_onepassword_key_url: https://downloads.1password.com/linux/keys/1password.asc
development_workstation_onepassword_repo_url: "https://downloads.1password.com/linux/debian/{{ development_workstation_onepassword_arch }}"
development_workstation_onepassword_keyring: /etc/apt/keyrings/1password-archive-keyring.gpg
development_workstation_onepassword_list: /etc/apt/sources.list.d/1password.list

# Trivy from the official generic apt repository.
development_workstation_trivy_key_url: https://aquasecurity.github.io/trivy-repo/deb/public.key
development_workstation_trivy_repo_url: https://aquasecurity.github.io/trivy-repo/deb
development_workstation_trivy_keyring: /etc/apt/keyrings/trivy-archive-keyring.gpg
development_workstation_trivy_list: /etc/apt/sources.list.d/trivy.list

# GitHub CLI from the official cli.github.com repository. The archive
# keyring is already binary and is stored directly, without dearmor.
development_workstation_gh_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
development_workstation_gh_key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
development_workstation_gh_keyring: /etc/apt/keyrings/githubcli-archive-keyring.gpg
development_workstation_gh_repo_url: https://cli.github.com/packages
development_workstation_gh_list: /etc/apt/sources.list.d/github-cli.list

# Syncthing from the official signed apt.syncthing.net stable-v2
# repository. The release key is already a binary keyring and is stored
# directly, without dearmor. The apt preference keeps the official origin
# preferred over the distribution package of the same name.
development_workstation_syncthing_key_url: https://syncthing.net/release-key.gpg
development_workstation_syncthing_keyring: /etc/apt/keyrings/syncthing-archive-keyring.gpg
development_workstation_syncthing_repo_url: https://apt.syncthing.net/
development_workstation_syncthing_suite: syncthing
development_workstation_syncthing_component: stable-v2
development_workstation_syncthing_list: /etc/apt/sources.list.d/syncthing.list
development_workstation_syncthing_preference_path: /etc/apt/preferences.d/syncthing
development_workstation_syncthing_pin_origin: apt.syncthing.net
development_workstation_syncthing_pin_priority: 990

# Packages delivered by the signed repositories above.
development_workstation_repo_packages:
  - 1password-cli
  - gh
  - packer
  - syncthing
  - terraform
  - trivy

# --- User-scoped tooling ---------------------------------------------------

# code-server is provided by the Homebrew role and runs as the dev user's
# systemd user service.
development_workstation_code_server_binary: "{{ homebrew_prefix }}/bin/code-server"
development_workstation_code_server_service: code-server
development_workstation_code_server_bind_addr: "0.0.0.0:8080"

# Syncthing runs as the dev user's systemd user service; the packaged
# system template unit (syncthing@) is deliberately not used.
development_workstation_syncthing_service: syncthing

# Checkov, installed with pipx for the dev user.
development_workstation_checkov_package: checkov

# Ansible collections, installed by name without version pins into the
# dev user's default collection path (~/.ansible/collections).
development_workstation_collections:
  - ansible.posix
  - community.general

# Herdr, installed into the dev user's ~/.local/bin from the official
# herdr.dev latest.json release manifest. Herdr updates itself in place
# with `herdr update`, so the role only performs the initial install
# when the binary is absent and never manages or overwrites an existing
# installation afterwards.
development_workstation_herdr_manifest_url: https://herdr.dev/latest.json

# Map of supported ansible_architecture values to the matching linux
# asset key in the latest.json manifest (assets/<key> holds the binary
# URL, sha256/<key> holds its checksum). Architectures not listed here
# fail the role.
development_workstation_herdr_asset_map:
  x86_64: linux-x86_64
  aarch64: linux-aarch64

development_workstation_herdr_asset_key: "{{ development_workstation_herdr_asset_map[ansible_architecture] }}"
development_workstation_herdr_binary: "{{ development_workstation_user_home }}/.local/bin/herdr"

# uv and uvx (uvx ships with uv), bootstrapped for the dev user with
# Astral's official standalone installer. The role only performs the
# initial install when the uv binary is absent; later upgrades stay with
# `uv self update`.
development_workstation_uv_installer_url: https://astral.sh/uv/install.sh
development_workstation_uv_binary: "{{ development_workstation_user_home }}/.local/bin/uv"
development_workstation_uvx_binary: "{{ development_workstation_user_home }}/.local/bin/uvx"
