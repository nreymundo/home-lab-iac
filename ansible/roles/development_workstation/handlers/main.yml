---
- name: Update development workstation apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Restart code-server
  ansible.builtin.systemd_service:
    name: "{{ development_workstation_code_server_service }}"
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
