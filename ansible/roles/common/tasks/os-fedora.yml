---
# Fedora/RedHat-specific tasks for the common role.

- name: Enable COPR repositories
  community.general.copr:
    name: "{{ item }}"
    state: enabled
  loop: "{{ (common_copr_repos | default([])) + (common_copr_extra_repos | default([])) }}"
  when: ((common_copr_repos | default([])) + (common_copr_extra_repos | default([]))) | length > 0
  tags:
    - packages

- name: Update dnf cache and upgrade packages
  ansible.builtin.dnf:
    name: "*"
    state: latest  # noqa: package-latest
    update_cache: true
  when: common_run_upgrade | bool
  tags:
    - packages

- name: Configure managed sudo policy
  ansible.builtin.include_tasks:
    file: sudo.yml
    apply:
      tags:
        - base
  tags:
    - base

- name: Install common packages
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present
  when: common_packages | length > 0
  tags:
    - packages

- name: Install host-specific packages
  ansible.builtin.dnf:
    name: "{{ (common_group_packages + common_extra_packages) | unique | list }}"
    state: present
  when: (common_group_packages + common_extra_packages) | length > 0
  tags:
    - packages

- name: Install Mosh
  ansible.builtin.dnf:
    name: mosh
    state: present
  when: common_enable_mosh | bool
  tags:
    - packages

- name: Configure Fedora/RedHat time synchronization
  ansible.builtin.import_tasks: timesync-fedora.yml

- name: Include fstrim timer management tasks
  ansible.builtin.include_tasks:
    file: fstrim.yml
    apply:
      tags:
        - base
  tags:
    - base

# NetworkManager configuration
- name: Configure NetworkManager ethernet connections
  ansible.builtin.template:
    src: nm-ethernet.nmconnection.j2
    dest: "/etc/NetworkManager/system-connections/{{ item.name }}.nmconnection"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ common_nm_connections | default([]) }}"
  when:
    - common_nm_connections | default([]) | length > 0
    - item.type == 'ethernet'
  notify: Reload NetworkManager connections
  tags:
    - base

- name: Configure NetworkManager VLAN connections
  ansible.builtin.template:
    src: nm-vlan.nmconnection.j2
    dest: "/etc/NetworkManager/system-connections/{{ item.name }}.nmconnection"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ common_nm_connections | default([]) }}"
  when:
    - common_nm_connections | default([]) | length > 0
    - item.type == 'vlan'
  notify: Reload NetworkManager connections
  tags:
    - base

- name: Configure Fedora/RedHat automatic updates
  ansible.builtin.import_tasks: unattended-upgrades-fedora.yml

# Firewalld management
- name: Stop and mask firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    masked: true
    enabled: false
  when: common_mask_firewalld | bool
  tags:
    - base

- name: Configure Fedora/RedHat kernel parameters
  ansible.builtin.import_tasks: grubby.yml
