---
# Debian/Ubuntu-specific tasks for the common role.

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
  when: common_run_upgrade | bool
  tags:
    - packages

- name: Refresh apt package indices when full upgrade is disabled
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: not common_run_upgrade | bool
  tags:
    - packages

- name: Configure managed sudo policy
  ansible.builtin.include_tasks:
    file: sudo.yml
    apply:
      tags:
        - base
  tags:
    - base

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  when: common_packages | length > 0
  tags:
    - packages

- name: Install host-specific packages
  ansible.builtin.apt:
    name: >-
      {{ (common_group_packages + common_extra_packages
          + (common_ubuntu_packages if ansible_distribution == 'Ubuntu' else []))
         | unique | list }}
    state: present
  when: >-
    (common_group_packages + common_extra_packages
     + (common_ubuntu_packages if ansible_distribution == 'Ubuntu' else [])) | length > 0
  tags:
    - packages

- name: Install Mosh
  ansible.builtin.apt:
    name: mosh
    state: present
  when: common_enable_mosh | bool
  tags:
    - packages

- name: Ensure systemd-timesyncd is installed
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
  when: common_ntp_servers | length > 0
  tags:
    - packages

- name: Ensure systemd-timesyncd service is enabled
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  when:
    - common_ntp_servers | length > 0
    - not ansible_check_mode
  tags:
    - base

- name: Ensure timesyncd config directory exists
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: common_ntp_servers | length > 0
  tags:
    - base

- name: Configure systemd-timesyncd NTP servers
  ansible.builtin.template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf.d/20-ansible.conf
    owner: root
    group: root
    mode: "0644"
  when: common_ntp_servers | length > 0
  notify: Restart systemd-timesyncd
  tags:
    - base

- name: Include fstrim timer management tasks
  ansible.builtin.include_tasks:
    file: fstrim.yml
    apply:
      tags:
        - base
  tags:
    - base

- name: Include APT timer schedule management tasks
  ansible.builtin.include_tasks:
    file: apt-timers.yml
    apply:
      tags:
        - base
  tags:
    - base

- name: Configure netplan when provided
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: /etc/netplan/01-main.yaml
    owner: root
    group: root
    mode: "0644"
  when: common_netplan_config | length > 0
  notify: Apply netplan
  tags:
    - base

- name: Install unattended upgrade dependencies
  ansible.builtin.apt:
    name:
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: common_enable_unattended_upgrades | bool
  tags:
    - packages

- name: Configure unattended-upgrades origins and blacklist
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  tags:
    - base

- name: Configure unattended-upgrades frequency
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  tags:
    - base

- name: Enable unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: started
    enabled: true
  when: common_enable_unattended_upgrades | bool
  tags:
    - base

- name: Disable unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: stopped
    enabled: false
  when:
    - not common_enable_unattended_upgrades | bool
    - "'unattended-upgrades.service' in ansible_facts.services"
  tags:
    - base

- name: Configure Ubuntu GRUB kernel parameters
  ansible.builtin.include_tasks:
    file: grub.yml
    apply:
      tags:
        - boot
  when:
    - ansible_distribution == 'Ubuntu'
  tags:
    - boot

- name: Check for reboot-required marker
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required_marker
  changed_when: false
  tags:
    - boot

- name: Check for pending common-role GRUB reboot marker
  ansible.builtin.stat:
    path: /run/common-role-grub-reboot-required
  register: common_grub_reboot_marker
  changed_when: false
  tags:
    - boot

- name: Report whether this host requires a reboot
  ansible.builtin.set_fact:
    common_reboot_required: >-
      {{ (common_grub_configuration_changed | default(false) | bool)
         or (common_reboot_required_marker.stat.exists | default(false) | bool)
         or (common_grub_reboot_marker.stat.exists | default(false) | bool) }}
  tags:
    - boot
