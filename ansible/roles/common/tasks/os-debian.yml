---
# Debian/Ubuntu-specific tasks for the common role.

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
  when: common_run_upgrade | bool
  tags:
    - packages

- name: Refresh apt package indices when full upgrade is disabled
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: not common_run_upgrade | bool
  tags:
    - packages

- name: Configure managed sudo policy
  ansible.builtin.include_tasks:
    file: sudo.yml
    apply:
      tags:
        - base
  tags:
    - base

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  when: common_packages | length > 0
  tags:
    - packages

- name: Install host-specific packages
  ansible.builtin.apt:
    name: >-
      {{ (common_group_packages + common_extra_packages
          + (common_ubuntu_packages if ansible_distribution == 'Ubuntu' else []))
         | unique | list }}
    state: present
  when: >-
    (common_group_packages + common_extra_packages
     + (common_ubuntu_packages if ansible_distribution == 'Ubuntu' else [])) | length > 0
  tags:
    - packages

- name: Install Mosh
  ansible.builtin.apt:
    name: mosh
    state: present
  when: common_enable_mosh | bool
  tags:
    - packages

- name: Configure Debian/Ubuntu time synchronization
  ansible.builtin.import_tasks: timesync-debian.yml

- name: Include fstrim timer management tasks
  ansible.builtin.include_tasks:
    file: fstrim.yml
    apply:
      tags:
        - base
  tags:
    - base

- name: Include APT timer schedule management tasks
  ansible.builtin.include_tasks:
    file: apt-timers.yml
    apply:
      tags:
        - base
  tags:
    - base

- name: Configure netplan when provided
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: /etc/netplan/01-main.yaml
    owner: root
    group: root
    mode: "0644"
  when: common_netplan_config | length > 0
  notify: Apply netplan
  tags:
    - base

- name: Configure Debian/Ubuntu automatic updates
  ansible.builtin.import_tasks: unattended-upgrades-debian.yml

- name: Configure Ubuntu GRUB kernel parameters
  ansible.builtin.include_tasks:
    file: grub.yml
    apply:
      tags:
        - boot
  when:
    - ansible_distribution == 'Ubuntu'
  tags:
    - boot

- name: Report Debian/Ubuntu reboot requirements
  ansible.builtin.import_tasks: reboot-required.yml
