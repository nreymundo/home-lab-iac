---
common_user: "pi"
common_manage_user: false
common_user_groups: []
common_user_shell: /bin/bash
common_passwordless_sudo: false
common_sudoers_file: /etc/sudoers.d/90-common-user
common_enable_unattended_upgrades: true
common_unattended_upgrades_auto_reboot: false
common_unattended_upgrades_reboot_time: "06:00"
# Ubuntu is the default; other distributions override origins in inventory.
common_unattended_upgrades_origins:
  - "origin=Ubuntu,archive=${distro_codename}-security"
  - "origin=Ubuntu,archive=${distro_codename}-updates"
common_unattended_upgrades_blacklist: []
common_apt_update_interval: 1
common_apt_unattended_upgrade_interval: 1
common_apt_autoclean_interval: 7
common_apt_daily_timer_schedule: ""
common_apt_daily_upgrade_timer_schedule: ""
common_run_upgrade: true
common_lock_root_password: false

# Scheduled fstrim for Linux guests (ignored if discard unsupported).
common_enable_fstrim: true
common_fstrim_timer_schedule: "04:00:00"

common_group_packages: []
common_extra_packages: []

# Install the Mosh server package via the OS-native package manager.
common_enable_mosh: true

common_manage_journald: false
common_journald_storage: persistent
common_journald_compress: true
common_journald_system_max_use: 1G
common_journald_system_keep_free: 2G
common_journald_system_max_file_size: 128M
common_journald_max_retention_sec: 30day
common_journald_max_file_sec: 1week

common_packages:
  - curl
  - vim
  - git
  - bash-completion

# Optional netplan configuration (Debian/Ubuntu).
# Set as a mapping matching netplan schema to manage /etc/netplan/01-main.yaml.
common_netplan_config: {}

# Optional NetworkManager connections (Fedora/RedHat).
# List of connection definitions with name, type, interface, ipv4 settings, etc.
common_nm_connections: []

# NTP servers for systemd-timesyncd (Debian) or chrony (Fedora).
common_ntp_servers:
  - "0.de.pool.ntp.org"
  - "1.de.pool.ntp.org"
  - "2.de.pool.ntp.org"
  - "3.de.pool.ntp.org"

# System timezone to enforce.
common_timezone: "Europe/Berlin"

# COPR repositories to enable (Fedora only).
common_copr_repos: []
common_copr_extra_repos: []

# Firewalld management (Fedora/RedHat).
common_mask_firewalld: false

# Kernel parameter management (Fedora/RedHat via grubby).
common_kernel_params_base_add: []
common_kernel_params_base_remove: []
common_kernel_params_add: []
common_kernel_params_remove: []

# Ubuntu/Debian GRUB managed parameters. No changes are made when all lists are empty.
common_reboot_required: false
