---
- name: Verify emqx role supports this OS release and architecture
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_release == 'trixie'
      - ansible_architecture == 'x86_64'
    fail_msg: "emqx role currently supports Debian Trixie amd64 hosts only"
    quiet: true

- name: Install EMQX repository prerequisites
  ansible.builtin.apt:
    name: "{{ emqx_prerequisite_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create keyrings directory for APT keys
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download EMQX GPG key
  ansible.builtin.get_url:
    url: "{{ emqx_gpg_key_url }}"
    dest: /tmp/emqx_emqx.gpg.key
    mode: "0644"
    force: true
  register: emqx_gpg_key_download

- name: Check current state of EMQX keyring
  ansible.builtin.stat:
    path: "{{ emqx_keyring_path }}"
  register: emqx_keyring_stat

- name: Convert EMQX GPG key to dearmor format
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ emqx_keyring_path }} /tmp/emqx_emqx.gpg.key"
  when: emqx_gpg_key_download.changed or not emqx_keyring_stat.stat.exists
  changed_when: true

- name: Add EMQX APT repository
  ansible.builtin.copy:
    content: |
      deb [signed-by={{ emqx_keyring_path }}] {{ emqx_repo_url }} {{ emqx_repo_suite }} {{ emqx_repo_component }}
    dest: "{{ emqx_repo_source_path }}"
    mode: "0644"

- name: Update apt cache after adding EMQX repository
  ansible.builtin.apt:
    update_cache: true

- name: Install community EMQX package at pinned version
  ansible.builtin.apt:
    name: "{{ emqx_package }}={{ emqx_version }}"
    state: present
    allow_change_held_packages: true
    allow_downgrade: true

- name: Hold EMQX package at pinned version
  ansible.builtin.dpkg_selections:
    name: "{{ emqx_package }}"
    selection: hold

- name: Enable and start EMQX service
  ansible.builtin.systemd_service:
    name: emqx
    state: "{{ emqx_service_state }}"
    enabled: "{{ emqx_service_enabled }}"
