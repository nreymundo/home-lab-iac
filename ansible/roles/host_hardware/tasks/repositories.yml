---
- name: Install Ubuntu repository management tools
  ansible.builtin.apt:
    name: software-properties-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: host_hardware_enable_universe | bool

- name: Check for missing components in existing Ubuntu repositories
  ansible.builtin.command:
    argv:
      - /usr/bin/add-apt-repository
      - --dry-run
      - --yes
      - --no-update
      - --component
      - universe
      - --component
      - multiverse
  environment:
    LC_ALL: C
  register: host_hardware_source_probe
  changed_when: false
  when: host_hardware_enable_universe | bool

- name: Enable missing components in existing Ubuntu repositories
  ansible.builtin.command:
    argv:
      - /usr/bin/add-apt-repository
      - --yes
      - --no-update
      - --component
      - universe
      - --component
      - multiverse
  environment:
    LC_ALL: C
  register: host_hardware_sources
  changed_when: "'Added ' in host_hardware_sources.stdout"
  when:
    - host_hardware_enable_universe | bool
    - "'Added ' in host_hardware_source_probe.stdout | default('')"

- name: Refresh apt metadata when hardware repositories are enabled
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if host_hardware_sources.changed else 3600 }}"
  when: host_hardware_enable_universe | bool
