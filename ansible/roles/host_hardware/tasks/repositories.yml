---
- name: Install Ubuntu APT source library
  ansible.builtin.apt:
    name: python3-apt
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: host_hardware_apt_library
  when: host_hardware_enable_universe | bool

- name: Enable missing components in existing Ubuntu repositories
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '-c', lookup('ansible.builtin.file', 'enable_ubuntu_components.py')]
         + (['--check'] if ansible_check_mode else []) }}
  register: host_hardware_sources
  changed_when: (host_hardware_sources.stdout | from_json).changed
  check_mode: false
  when:
    - host_hardware_enable_universe | bool
    - not ansible_check_mode or not host_hardware_apt_library.changed

- name: Refresh apt metadata when hardware repositories are enabled
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if host_hardware_sources.changed else 3600 }}"
  when: host_hardware_enable_universe | bool
