---
chatterbox_enabled: true

chatterbox_service_name: chatterbox-container
chatterbox_compose_project_name: chatterbox-tts-server
chatterbox_compose_service_name: chatterbox-tts-server

# Prebuilt image (official devnen build, Strix Halo variant). Rolling tag
# follows main; reconciliation pulls the tag and recreates the container
# when a newer image is available.
chatterbox_image: ghcr.io/devnen/chatterbox-tts-server:main-strixhalo

# Managed compose rendered by this role. Lives outside the data dir so the
# pre-provisioned source tree is never modified.
chatterbox_config_dir: /etc/chatterbox
chatterbox_compose_file: "{{ chatterbox_config_dir }}/docker-compose.yml"

# Pre-provisioned data root. The role asserts these exist but never creates,
# copies, or modifies them or the LLM model cache (hf_cache volume).
chatterbox_data_dir: /root/docker/Chatterbox-TTS-Server

# Host-side pre-provisioned assets mounted into the container.
chatterbox_config_file: "{{ chatterbox_data_dir }}/config.yaml"
chatterbox_voices_dir: "{{ chatterbox_data_dir }}/voices"
chatterbox_reference_audio_dir: "{{ chatterbox_data_dir }}/reference_audio"
chatterbox_outputs_dir: "{{ chatterbox_data_dir }}/outputs"
chatterbox_logs_dir: "{{ chatterbox_data_dir }}/logs"

chatterbox_required_data_paths:
  - "{{ chatterbox_data_dir }}"
  - "{{ chatterbox_config_file }}"
  - "{{ chatterbox_voices_dir }}"
  - "{{ chatterbox_reference_audio_dir }}"
  - "{{ chatterbox_outputs_dir }}"
  - "{{ chatterbox_logs_dir }}"

# Container-side mount targets expected by the upstream image.
chatterbox_container_config_file: /app/config.yaml
chatterbox_container_voices_dir: /app/voices
chatterbox_container_reference_audio_dir: /app/reference_audio
chatterbox_container_outputs_dir: /app/outputs
chatterbox_container_logs_dir: /app/logs
chatterbox_container_hf_cache_dir: /app/hf_cache

# Named HF model cache volume. Combined with the project name above this
# reuses the existing chatterbox-tts-server_hf_cache volume.
chatterbox_hf_cache_volume_name: hf_cache

# Networking.
chatterbox_bind_address: "0.0.0.0"
chatterbox_host_port: 8004
chatterbox_container_port: 8004

# GPU / Strix Halo runtime.
chatterbox_devices:
  - /dev/kfd
  - /dev/dri
chatterbox_group_add:
  - video
  - render
chatterbox_ipc: host
chatterbox_shm_size: 8g
chatterbox_security_opt:
  - seccomp=unconfined
chatterbox_restart: unless-stopped

# Strix Halo ROCm tuning env vars. HF_TOKEN (if required) is injected at
# runtime via the host environment; no secret is committed to Git.
chatterbox_environment:
  PYTHONUNBUFFERED: "1"
  HF_HOME: /app/hf_cache
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  HSA_OVERRIDE_GFX_VERSION: "11.0.0"
  HSA_XNACK: "1"
  MIOPEN_FIND_MODE: FAST
  PYTORCH_ALLOC_CONF: "expandable_segments:True"
  TORCH_BLAS_PREFER_HIPBLASLT: "1"
  TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
  TTS_BF16: "on"
  TTS_ENGINE_DEVICE: cuda
  HF_TOKEN: "${HF_TOKEN:-}"
