---
- name: Ensure OmniRoute role supports Linux
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
    fail_msg: OmniRoute container role supports Linux only

- name: Verify OmniRoute secrets file exists
  ansible.builtin.stat:
    path: "{{ omniroute_secrets_file }}"
  delegate_to: localhost
  become: false
  register: omniroute_secrets_file_stat
  when: omniroute_enabled | bool

- name: Require OmniRoute secrets file
  ansible.builtin.assert:
    that:
      - omniroute_secrets_file_stat.stat.exists
    fail_msg: >-
      Create and encrypt {{ omniroute_secrets_file }} as documented in
      ansible/secrets/README.md before running this role.
  when: omniroute_enabled | bool

- name: Decrypt OmniRoute secrets
  ansible.builtin.command:
    argv:
      - sops
      - --decrypt
      - "{{ omniroute_secrets_file }}"
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ omniroute_sops_age_key_file }}"
  changed_when: false
  check_mode: false
  no_log: true
  register: omniroute_decrypted_secrets
  when: omniroute_enabled | bool

- name: Load OmniRoute secrets
  ansible.builtin.set_fact:
    omniroute_secrets: "{{ omniroute_decrypted_secrets.stdout | from_yaml }}"
  no_log: true
  when: omniroute_enabled | bool

- name: Decrypt Authentik OmniRoute OAuth credentials
  ansible.builtin.command:
    argv:
      - sops
      - --decrypt
      - "{{ omniroute_authentik_sso_secret_file }}"
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ omniroute_sops_age_key_file }}"
  changed_when: false
  check_mode: false
  no_log: true
  register: omniroute_decrypted_authentik_sso_secret
  when: omniroute_enabled | bool

- name: Load Authentik OmniRoute OAuth credentials
  ansible.builtin.set_fact:
    omniroute_authentik_sso_secret: "{{ omniroute_decrypted_authentik_sso_secret.stdout | from_yaml }}"
  no_log: true
  when: omniroute_enabled | bool

- name: Decrypt cluster identity
  ansible.builtin.command:
    argv:
      - sops
      - --decrypt
      - "{{ omniroute_cluster_identity_file }}"
  delegate_to: localhost
  become: false
  environment:
    SOPS_AGE_KEY_FILE: "{{ omniroute_sops_age_key_file }}"
  changed_when: false
  check_mode: false
  no_log: true
  register: omniroute_decrypted_cluster_identity
  when: omniroute_enabled | bool

- name: Load cluster identity
  ansible.builtin.set_fact:
    omniroute_cluster_identity: "{{ omniroute_decrypted_cluster_identity.stdout | from_yaml }}"
  no_log: true
  when: omniroute_enabled | bool

- name: Verify required OmniRoute secret values
  ansible.builtin.assert:
    that:
      - omniroute_secrets.omniroute_initial_password | default('') | length >= 16
      - omniroute_secrets.omniroute_jwt_secret | default('') | length >= 32
      - omniroute_secrets.omniroute_api_key_secret | default('') | length >= 32
      - omniroute_secrets.omniroute_storage_encryption_key | default('') | length >= 32
      - omniroute_secrets.omniroute_ws_bridge_secret | default('') | length >= 32
      - omniroute_oidc_allowed_subjects | length > 0
      - omniroute_oidc_allowed_subjects | select('string') | list | length == omniroute_oidc_allowed_subjects | length
      - >-
        omniroute_oidc_allowed_subjects | reject('equalto', '') | list | length
        == omniroute_oidc_allowed_subjects | length
      - omniroute_cluster_identity.data.CLUSTER_DOMAIN | default('') | length > 0
      - omniroute_authentik_sso_secret.stringData.CLIENT_ID | default('') | length > 0
      - omniroute_authentik_sso_secret.stringData.CLIENT_SECRET | default('') | length > 0
    fail_msg: >-
      OmniRoute secrets must define strong runtime secrets, at least one exact
      OIDC subject or verified email, and the Authentik OAuth client credentials.
      Optional upstream provider API keys (openrouter, glm, llama-swap) may stay
      empty and are then skipped.
  no_log: true
  when: omniroute_enabled | bool
