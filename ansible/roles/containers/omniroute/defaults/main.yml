---
omniroute_enabled: true

omniroute_service_name: omniroute-compose
omniroute_compose_project_name: omniroute

omniroute_config_dir: /etc/omniroute
omniroute_compose_file: "{{ omniroute_config_dir }}/docker-compose.yml"
omniroute_env_file: "{{ omniroute_config_dir }}/omniroute.env"
omniroute_bootstrap_script: "{{ omniroute_config_dir }}/bootstrap_omniroute.py"
omniroute_bootstrap_config_file: "{{ omniroute_config_dir }}/bootstrap.json"
omniroute_api_keys_output_file: "{{ omniroute_config_dir }}/bootstrap-api-keys.json"

# Pin the amd64 :next image manifest containing the Authentik OIDC fixes and
# the explicit-combo target authorization fix (OmniRoute PR #14197). The :next
# index mixes builds with and without that fix, so do not pin the index.
omniroute_image: >-
  diegosouzapw/omniroute:next@sha256:6d525fcecadcf144991693cc151b6aa6b6917ad6ed63e7ebf72fef1333006706
# Matches the image the upstream 1-click Redis launcher uses and is pinned so
# repeated Ansible runs do not restart a healthy gateway on a mutable tag.
omniroute_redis_image: >-
  redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
omniroute_images:
  - "{{ omniroute_image }}"
  - "{{ omniroute_redis_image }}"

omniroute_secrets_file: "{{ playbook_dir }}/../secrets/omniroute.sops.yml"
omniroute_authentik_sso_secret_file: >-
  {{ playbook_dir }}/../../kubernetes/infrastructure/security/authentik/install/omniroute-sso-secret.sops.yaml
omniroute_cluster_identity_file: >-
  {{ playbook_dir }}/../../kubernetes/clusters/production/identity/cluster-identity.sops.yaml
omniroute_sops_age_key_file: >-
  {{ lookup('env', 'SOPS_AGE_KEY_FILE') | default(lookup('env', 'HOME') + '/.config/sops/age/keys.txt', true) }}

# Runtime contract verified against upstream docs/reference/ENVIRONMENT.md
# (release/v3.8.51): PORT is the single dashboard+API port, DATA_DIR holds the
# SQLite database, OMNIROUTE_MEMORY_MB is the V8 heap limit for coding-agent
# workloads, REDIS_URL points at the rate-limiter backend, and
# OMNIROUTE_WS_BRIDGE_SECRET is required in production.
omniroute_bind_address: "0.0.0.0"
omniroute_host_port: 20128
omniroute_container_port: 20128
omniroute_memory_mb: 8192
omniroute_stop_grace_period: 40s
omniroute_fetch_timeout_ms: 600000
omniroute_pricing_sync_enabled: false
omniroute_audio_remote_provider_nodes: true
omniroute_rerank_remote_provider_nodes: true

omniroute_validate_health: true
omniroute_validate_bootstrap_artifacts: true
omniroute_health_url: "http://127.0.0.1:{{ omniroute_host_port }}/healthz"
omniroute_health_retries: 60
omniroute_health_delay: 5

# Management API bootstrap (dashboard session via INITIAL_PASSWORD).
omniroute_dashboard_url: "http://127.0.0.1:{{ omniroute_host_port }}"

# Native OIDC against Authentik. OmniRoute v3.8.51 removes exactly one
# trailing slash before validating the ID-token issuer, while Authentik's
# canonical issuer ends in one slash. Store two trailing slashes so the value
# passed to jwtVerify remains the canonical Authentik issuer. Remove this
# workaround after upstream preserves the discovered issuer verbatim.
omniroute_oidc_enabled: true
omniroute_oidc_disable_password_login: true
omniroute_oidc_redirect_path: /api/auth/oidc/callback
omniroute_oidc_scopes:
  - openid
  - profile
  - email
# OmniRoute requires at least one exact OIDC subject or verified email before
# OIDC can be enabled. Values come from the encrypted Ansible secret file.
omniroute_oidc_allowed_subjects: >-
  {{ omniroute_secrets.omniroute_oidc_allowed_subjects | default([]) }}

# API-key connections. Native Codex OAuth is enrolled through OmniRoute and
# intentionally is not synthesized or replaced by Ansible.
omniroute_provider_connections:
  - ref: openrouter
    enabled: "{{ (omniroute_secrets.omniroute_openrouter_api_key | default('') | length > 0) | bool }}"
    providerId: openrouter
    name: OpenRouter
    apiKey: "{{ omniroute_secrets.omniroute_openrouter_api_key | default('') }}"
    syncModels: true
  - ref: glm
    enabled: "{{ (omniroute_secrets.omniroute_glm_api_key | default('') | length > 0) | bool }}"
    providerId: glm
    name: GLM Coding Plan
    apiKey: "{{ omniroute_secrets.omniroute_glm_api_key | default('') }}"
    syncModels: true
  - ref: llama-cpp
    enabled: "{{ (omniroute_secrets.omniroute_llama_swap_api_key | default('') | length > 0) | bool }}"
    providerId: llama-cpp
    name: llama-swap embeddings
    apiKey: "{{ omniroute_secrets.omniroute_llama_swap_api_key | default('') }}"
    providerSpecificData:
      baseUrl: "{{ omniroute_llama_swap_base_url }}"
    syncModels: true
omniroute_required_provider_connections:
  - providerId: codex
    syncModels: true
  - providerId: openrouter
    name: OpenRouter
  - providerId: glm
    name: GLM Coding Plan

# llama-swap is wired through the generic OpenAI-compatible provider-node
# mechanism. The prefix must not collide with a reserved provider prefix
# (llama-cpp, llamafile, ...), hence "llamaswap".
omniroute_llama_swap_node_name: "llama-swap"
omniroute_llama_swap_prefix: "llamaswap"
omniroute_llama_swap_api_type: chat
omniroute_llama_swap_base_url: "http://192.168.10.70:8080/v1"
omniroute_llama_swap_connection_name: "llama-swap"

# Only these settings are owned. Unrelated dashboard and OIDC values survive.
omniroute_settings:
  autoRoutingEnabled: false
  hideAutoCombos: true
omniroute_cache_settings:
  semanticCacheEnabled: false
  semanticCacheVectorEnabled: false
omniroute_compression_settings:
  enabled: false
  defaultMode: "off"
omniroute_combo_defaults:
  comboDefaults:
    strategy: priority
    maxRetries: 1
    maxGlobalAttempts: 2
    retryDelayMs: 2000
    maxSetRetries: 0
    compressionMode: "off"
    zeroLatencyOptimizationsEnabled: false
    hedging: false
    fallbackCompressionMode: "off"
    predictiveTtftMs: 0
    shadowRouting:
      enabled: false
    evalRouting:
      enabled: false
    connectionAwareExpansion: false
    trackMetrics: true

omniroute_provider_models: []
omniroute_combos: []
omniroute_model_combo_mappings: []
omniroute_management_api_key_name: ansible-bootstrap
omniroute_api_keys: []
omniroute_api_keys_to_remove: []
omniroute_model_aliases: {}
