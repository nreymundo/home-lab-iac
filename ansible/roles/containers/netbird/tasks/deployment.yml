---
- name: Generate NetBird persistent secrets
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - -base64
      - "32"
  loop:
    - relay_auth_secret
    - datastore_encryption_key
  register: netbird_generated_secrets
  changed_when: false
  check_mode: false
  no_log: true
  when: not netbird_config_stat.stat.exists

- name: Render NetBird server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ netbird_config_file }}"
    owner: "{{ netbird_container_owner }}"
    group: "{{ netbird_container_group }}"
    mode: "0600"
  vars:
    netbird_relay_auth_secret: "{{ netbird_generated_secrets.results[0].stdout | trim }}"
    netbird_datastore_encryption_key: "{{ netbird_generated_secrets.results[1].stdout | trim }}"
  no_log: true
  when: not netbird_config_stat.stat.exists

- name: Render NetBird dashboard environment
  ansible.builtin.template:
    src: dashboard.env.j2
    dest: "{{ netbird_dashboard_env_file }}"
    owner: "{{ netbird_container_owner }}"
    group: "{{ netbird_container_group }}"
    mode: "0640"
  no_log: true
  notify: Restart NetBird containers

- name: Render CrowdSec acquisition configuration
  ansible.builtin.template:
    src: crowdsec-acquis.yaml.j2
    dest: "{{ netbird_crowdsec_acquisition_file }}"
    owner: "{{ netbird_container_owner }}"
    group: "{{ netbird_container_group }}"
    mode: "0640"
  notify: Restart NetBird containers

- name: Render Traefik dynamic configuration
  ansible.builtin.template:
    src: traefik-dynamic.yaml.j2
    dest: "{{ netbird_base_dir }}/traefik-dynamic.yaml"
    owner: "{{ netbird_container_owner }}"
    group: "{{ netbird_container_group }}"
    mode: "0644"
  vars:
    netbird_traefik_bouncer_enabled: >-
      {{ netbird_traefik_bouncer_requested | bool and netbird_traefik_bouncer_key_stat.stat.exists }}
  notify: Restart NetBird containers

- name: Render NetBird Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ netbird_compose_file }}"
    owner: "{{ netbird_container_owner }}"
    group: "{{ netbird_container_group }}"
    mode: "0644"
  vars:
    netbird_setup_pat_enabled: "{{ not netbird_bootstrap_complete_stat.stat.exists }}"
  notify: Restart NetBird containers

- name: Check for existing NetBird proxy credentials
  ansible.builtin.stat:
    path: "{{ netbird_proxy_env_file }}"
  register: netbird_proxy_env_stat

- name: Create temporary NetBird proxy environment
  ansible.builtin.copy:
    content: "NB_PROXY_TOKEN=placeholder\n"
    dest: "{{ netbird_proxy_env_file }}"
    owner: "{{ netbird_container_owner }}"
    group: "{{ netbird_container_group }}"
    mode: "0600"
  when: not netbird_proxy_env_stat.stat.exists

- name: Start NetBird core services for proxy bootstrap
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - up
      - -d
      - dashboard
      - netbird-server
      - crowdsec
  changed_when: true
  when:
    - not netbird_proxy_env_stat.stat.exists
    - not ansible_check_mode

- name: Wait for CrowdSec before bouncer bootstrap
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - exec
      - -T
      - crowdsec
      - cscli
      - lapi
      - status
  register: netbird_crowdsec_bouncer_ready
  changed_when: false
  until: netbird_crowdsec_bouncer_ready.rc == 0
  retries: "{{ netbird_health_retries }}"
  delay: "{{ netbird_health_delay }}"
  when:
    - netbird_traefik_bouncer_requested | bool
    - not netbird_traefik_bouncer_key_stat.stat.exists
    - not ansible_check_mode

- name: Create CrowdSec Traefik bouncer credentials
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - exec
      - -T
      - crowdsec
      - cscli
      - bouncers
      - add
      - netbird-traefik
      - -o
      - raw
  register: netbird_traefik_bouncer_command
  changed_when: true
  no_log: true
  when:
    - netbird_traefik_bouncer_requested | bool
    - not netbird_traefik_bouncer_key_stat.stat.exists
    - not ansible_check_mode

- name: Store CrowdSec Traefik bouncer credentials
  ansible.builtin.copy:
    content: "{{ netbird_traefik_bouncer_command.stdout | trim }}\n"
    dest: "{{ netbird_traefik_bouncer_key_file }}"
    owner: "{{ netbird_container_owner }}"
    group: "{{ netbird_container_group }}"
    mode: "0600"
  no_log: true
  when:
    - netbird_traefik_bouncer_requested | bool
    - not netbird_traefik_bouncer_key_stat.stat.exists
    - not ansible_check_mode

- name: Render Traefik configuration with CrowdSec bouncer
  ansible.builtin.template:
    src: traefik-dynamic.yaml.j2
    dest: "{{ netbird_base_dir }}/traefik-dynamic.yaml"
    owner: "{{ netbird_container_owner }}"
    group: "{{ netbird_container_group }}"
    mode: "0644"
  vars:
    netbird_traefik_bouncer_enabled: "{{ netbird_traefik_bouncer_requested | bool }}"
  notify: Restart NetBird containers
  when:
    - netbird_traefik_bouncer_requested | bool
    - not netbird_traefik_bouncer_key_stat.stat.exists
    - not ansible_check_mode

- name: Start Traefik after bouncer bootstrap
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - up
      - -d
      - traefik
  changed_when: true
  when:
    - not netbird_proxy_env_stat.stat.exists
    - not ansible_check_mode

- name: List installed CrowdSec collections
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - exec
      - -T
      - crowdsec
      - cscli
      - collections
      - list
      - -o
      - json
  register: netbird_crowdsec_installed_collections
  changed_when: false
  when: not ansible_check_mode

- name: Remove persisted CrowdSec SSH collection
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - exec
      - -T
      - crowdsec
      - cscli
      - collections
      - remove
      - crowdsecurity/linux
      - --purge
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      (netbird_crowdsec_installed_collections.stdout | from_json).collections
      | selectattr('name', 'equalto', 'crowdsecurity/linux') | list | length > 0
  notify: Restart NetBird containers

- name: List installed CrowdSec parsers
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - exec
      - -T
      - crowdsec
      - cscli
      - parsers
      - list
      - -o
      - json
  register: netbird_crowdsec_installed_parsers
  changed_when: false
  when: not ansible_check_mode

- name: Install non-syslog parser for Traefik Docker logs
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - exec
      - -T
      - crowdsec
      - cscli
      - parsers
      - install
      - crowdsecurity/syslog-logs
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      (netbird_crowdsec_installed_parsers.stdout | from_json).parsers
      | selectattr('name', 'equalto', 'crowdsecurity/syslog-logs') | list | length == 0
  notify: Restart NetBird containers

- name: Wait for NetBird server before proxy bootstrap
  ansible.builtin.uri:
    url: "https://{{ netbird_secrets.netbird_fqdn }}/oauth2/.well-known/openid-configuration"
    status_code: 200
    return_content: true
  register: netbird_oidc_ready
  until: netbird_oidc_ready.status == 200
  retries: "{{ netbird_health_retries }}"
  delay: "{{ netbird_health_delay }}"
  when:
    - not netbird_proxy_env_stat.stat.exists
    - not ansible_check_mode

- name: Create NetBird proxy access token
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - exec
      - -T
      - netbird-server
      - /go/bin/netbird-server
      - token
      - create
      - --name
      - default-proxy
      - --config
      - /etc/netbird/config.yaml
  register: netbird_proxy_token_command
  changed_when: true
  no_log: true
  when:
    - not netbird_proxy_env_stat.stat.exists
    - not ansible_check_mode

- name: Wait for CrowdSec before proxy bootstrap
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - exec
      - -T
      - crowdsec
      - cscli
      - lapi
      - status
  register: netbird_crowdsec_ready
  changed_when: false
  until: netbird_crowdsec_ready.rc == 0
  retries: "{{ netbird_health_retries }}"
  delay: "{{ netbird_health_delay }}"
  when:
    - not netbird_proxy_env_stat.stat.exists
    - not ansible_check_mode

- name: Create CrowdSec proxy bouncer credentials
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - exec
      - -T
      - crowdsec
      - cscli
      - bouncers
      - add
      - netbird-proxy
      - -o
      - raw
  register: netbird_crowdsec_bouncer_command
  changed_when: true
  no_log: true
  when:
    - not netbird_proxy_env_stat.stat.exists
    - not ansible_check_mode

- name: Render NetBird proxy environment
  ansible.builtin.template:
    src: proxy.env.j2
    dest: "{{ netbird_proxy_env_file }}"
    owner: "{{ netbird_container_owner }}"
    group: "{{ netbird_container_group }}"
    mode: "0600"
  vars:
    netbird_proxy_token: "{{ netbird_proxy_token_command.stdout | regex_search('(?m)^Token:\\s*(\\S+)$', '\\1') | first }}"
    netbird_crowdsec_bouncer_key: "{{ netbird_crowdsec_bouncer_command.stdout | trim }}"
  no_log: true
  when:
    - not netbird_proxy_env_stat.stat.exists
    - not ansible_check_mode
  notify: Restart NetBird containers

- name: Validate NetBird Docker Compose configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - netbird
      - -f
      - "{{ netbird_compose_file }}"
      - config
      - --quiet
  changed_when: false
  when: not ansible_check_mode

- name: Install NetBird Compose systemd unit
  ansible.builtin.template:
    src: netbird-compose.service.j2
    dest: "/etc/systemd/system/{{ netbird_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload NetBird systemd
    - Restart NetBird containers

- name: Install NetBird update systemd unit
  ansible.builtin.template:
    src: netbird-update.service.j2
    dest: "/etc/systemd/system/{{ netbird_update_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Reload NetBird systemd

- name: Install NetBird update timer
  ansible.builtin.template:
    src: netbird-update.timer.j2
    dest: "/etc/systemd/system/{{ netbird_update_timer_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload NetBird systemd

- name: Flush NetBird handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start NetBird services
  ansible.builtin.systemd_service:
    name: "{{ netbird_service_name }}"
    enabled: "{{ netbird_enabled | bool }}"
    state: "{{ 'started' if netbird_enabled | bool else 'stopped' }}"
    daemon_reload: true
  when: not ansible_check_mode
