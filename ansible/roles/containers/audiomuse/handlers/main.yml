---
- name: Reload AudioMuse systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart AudioMuse containers
  ansible.builtin.systemd_service:
    name: "{{ audiomuse_service_name }}"
    state: restarted
    daemon_reload: true
  when:
    - audiomuse_enabled | bool
    - not ansible_check_mode
