---
- name: Download optional Qwen Image Turbo models
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - /opt/venv/bin/hf
      - -e
      - HF_XET_HIGH_PERFORMANCE=1
      - -v
      - "{{ comfyui_models_dir }}:/root/comfy-models"
      - "{{ comfyui_image }}"
      - download
      - "{{ comfyui_model_repo }}"
      - "{{ item }}"
      - --revision
      - "{{ comfyui_model_revision }}"
      - --local-dir
      - /root/comfy-models
  loop: "{{ comfyui_model_files }}"
  register: comfyui_model_download
  changed_when: "'Downloading' in comfyui_model_download.stderr"
  when:
    - comfyui_model_downloads_enabled | bool
    - not ansible_check_mode
