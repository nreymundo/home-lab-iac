---
- name: Check legacy ComfyUI API service
  ansible.builtin.stat:
    path: /etc/systemd/system/comfyui-openai-api.service
  register: comfyui_legacy_api_unit

- name: Stop legacy ComfyUI API proxy before reusing its port
  ansible.builtin.systemd_service:
    name: comfyui-openai-api
    state: stopped
    enabled: false
  when:
    - comfyui_legacy_api_unit.stat.exists
    - not ansible_check_mode

- name: Remove legacy ComfyUI API systemd unit
  ansible.builtin.file:
    path: /etc/systemd/system/comfyui-openai-api.service
    state: absent
  notify: Reload ComfyUI systemd

- name: Install ComfyUI OpenAI API model mappings
  ansible.builtin.copy:
    src: api-models.yaml
    dest: "{{ comfyui_api_config_dir }}/models.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ComfyUI container
