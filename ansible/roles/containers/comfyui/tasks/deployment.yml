---
- name: Ensure ComfyUI persistent directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ comfyui_base_dir }}"
    - "{{ comfyui_models_dir }}"
    - "{{ comfyui_input_dir }}"
    - "{{ comfyui_output_dir }}"
    - "{{ comfyui_user_dir }}"
    - "{{ comfyui_cache_dir }}"
    - "{{ comfyui_workflows_dir }}"
    - "{{ comfyui_build_dir }}"
    - "{{ comfyui_api_config_dir }}"

- name: Ensure ComfyUI model directories exist
  ansible.builtin.file:
    path: "{{ comfyui_models_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ comfyui_model_dirs }}"

- name: Verify Docker Compose is available
  ansible.builtin.command: docker compose version
  register: comfyui_docker_compose_version
  changed_when: false

- name: Render pinned ComfyUI image build definition
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ comfyui_build_dir }}/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  register: comfyui_build_definition

- name: Install ComfyUI gateway multipart reference fix
  ansible.builtin.copy:
    src: roundabout-multipart-refs.patch
    dest: "{{ comfyui_build_dir }}/roundabout-multipart-refs.patch"
    owner: root
    group: root
    mode: "0644"
  register: comfyui_gateway_patch

- name: Check local ComfyUI image
  ansible.builtin.command:
    argv: [docker, image, inspect, "{{ comfyui_image }}"]
  register: comfyui_local_image
  changed_when: false
  failed_when: false
  check_mode: false

- name: Build pinned ComfyUI ROCm image
  ansible.builtin.command:
    argv: [docker, build, --tag, "{{ comfyui_image }}", "{{ comfyui_build_dir }}"]
  changed_when: true
  notify: Restart ComfyUI container
  when:
    - not ansible_check_mode
    - >-
      comfyui_build_definition.changed or comfyui_gateway_patch.changed or
      comfyui_local_image.rc != 0 or comfyui_force_rebuild | bool

- name: Render ComfyUI Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ comfyui_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ComfyUI container

- name: Install ComfyUI systemd unit
  ansible.builtin.template:
    src: comfyui-container.service.j2
    dest: "/etc/systemd/system/{{ comfyui_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload ComfyUI systemd
    - Restart ComfyUI container
