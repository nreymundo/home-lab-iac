---
- name: Validate ComfyUI prerequisites
  ansible.builtin.import_tasks: preflight.yml

- name: Configure ComfyUI deployment
  ansible.builtin.import_tasks: deployment.yml

- name: Configure ComfyUI OpenAI API
  ansible.builtin.import_tasks: openai-api.yml

- name: Configure ComfyUI idle restart
  ansible.builtin.import_tasks: idle-restart.yml

- name: Manage ComfyUI model downloads
  ansible.builtin.import_tasks: models.yml

- name: Manage and validate ComfyUI services
  ansible.builtin.import_tasks: services.yml
