---
comfyui_enabled: true

comfyui_service_name: comfyui-container
comfyui_compose_project_name: comfyui
comfyui_compose_service_name: comfyui
comfyui_container_name: comfyui
comfyui_image: comfyui-qwen-image:0.40.0
comfyui_base_image: >-
  docker.io/kyuz0/amd-strix-halo-comfyui@sha256:384aa1fecef6a841832e0d5552949977330308d8c25e212a94f5e8dfcc061cae
comfyui_version: 3541246a9c997f4b8c32f9f88f3c985d02021c79 # v0.40.0
comfyui_roundabout_version: d148fd09e2f2048c839083b395e1929ad528644d
comfyui_force_rebuild: false

comfyui_base_dir: /opt/ai/containers/comfyui
comfyui_models_dir: /opt/ai/models/comfyui
comfyui_model_dirs:
  - checkpoints
  - diffusion_models
  - text_encoders
  - vae
  - loras
  - unet
  - clip_vision
  - latent_upscale_models
comfyui_compose_file: "{{ comfyui_base_dir }}/docker-compose.yml"
comfyui_build_dir: "{{ comfyui_base_dir }}/build"

comfyui_input_dir: "{{ comfyui_base_dir }}/input"
comfyui_output_dir: "{{ comfyui_base_dir }}/output"
comfyui_user_dir: "{{ comfyui_base_dir }}/user"
comfyui_cache_dir: "{{ comfyui_base_dir }}/cache"
comfyui_workflows_dir: "{{ comfyui_base_dir }}/workflows/api"
comfyui_idle_restart_script: /usr/local/sbin/comfyui-idle-restart
comfyui_idle_restart_state_file: /run/comfyui-idle-restart.state
comfyui_api_config_dir: "{{ comfyui_base_dir }}/api"

comfyui_bind_address: "0.0.0.0"
comfyui_host_port: 8188
comfyui_container_port: 8000
comfyui_listen_address: "0.0.0.0"

comfyui_required_device_nodes:
  - /dev/kfd
  - /dev/dri/renderD128

comfyui_devices:
  - /dev/dri:/dev/dri
  - /dev/kfd:/dev/kfd

comfyui_group_add:
  - "39"
  - "105"

comfyui_environment:
  HOME: /root
  HF_HOME: /root/comfy-models/.cache/huggingface
  HF_XET_HIGH_PERFORMANCE: "1"
  MCP_ENABLED: "false"
  COMFY_BASE_URL: "http://127.0.0.1:{{ comfyui_container_port }}"
  MODELS_FILE: /etc/comfyui-api/models.yaml
  WORKFLOWS_DIR: /opt/comfy-workflows
  OUTPUT_DIR: /root/comfy-outputs/api
  MAX_CONCURRENCY: "1"
  JOB_TIMEOUT: "900"
  AUTO_SPLIT_NEGATIVE: "false"
  TORCH_BLAS_PREFER_HIPBLASLT: "1"
  TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
  PYTHONUNBUFFERED: "1"

comfyui_cli_args:
  - --listen
  - "{{ comfyui_listen_address }}"
  - --port
  - "{{ comfyui_container_port }}"
  - --output-directory
  - /root/comfy-outputs
  - --lowvram
  - --disable-smart-memory
  - --cache-none
  - --disable-mmap
  - --bf16-vae
  - --disable-pinned-memory

comfyui_disabled_custom_nodes:
  - ComfyUI-AMDGPUMonitor

comfyui_idle_restart_enabled: true
comfyui_idle_restart_after_seconds: 300
comfyui_idle_restart_check_interval: 60
comfyui_idle_restart_queue_url: "http://127.0.0.1:{{ comfyui_host_port }}/queue"
comfyui_idle_restart_history_url: "http://127.0.0.1:{{ comfyui_host_port }}/history"

# Roundabout serves the OpenAI Images API in the ComfyUI process.
# Keep the former proxy's loopback address for existing clients.
comfyui_openai_api_bind_address: 127.0.0.1
comfyui_openai_api_host_port: 10050

# Downloads are opt-in; the migration downloads these directly on the LXC.
comfyui_model_downloads_enabled: false
comfyui_model_repo: Comfy-Org/Qwen-Image-2.1
comfyui_model_revision: a8342359c61979b06a8dafb1a47991fe1f30e994
comfyui_model_files:
  - diffusion_models/qwen_image_2.1_turbo_bf16.safetensors
  - text_encoders/qwen3vl_8b_bf16.safetensors
  - vae/qwen_image_2.1_vae_bf16.safetensors

comfyui_validate_health: true
comfyui_health_retries: 60
comfyui_health_delay: 2
