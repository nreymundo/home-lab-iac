---
- name: Check if swapfile exists
  ansible.builtin.stat:
    path: "{{ swapfile_path }}"
  register: swapfile_stat
  when: swapfile_enabled | bool

- name: Detect swapfile filesystem
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --output
      - FSTYPE
      - --target
      - "{{ swapfile_path | dirname }}"
  register: swapfile_findmnt
  changed_when: false
  check_mode: false
  when:
    - swapfile_enabled | bool
    - not swapfile_proxmox_policy | bool

- name: Check swapfile attributes
  ansible.builtin.command:
    argv:
      - lsattr
      - "{{ swapfile_path }}"
  register: swapfile_attributes
  changed_when: false
  check_mode: false
  when:
    - swapfile_enabled | bool
    - swapfile_stat.stat.exists

- name: Determine if swapfile needs recreation
  ansible.builtin.set_fact:
    swapfile_recreate: >-
      {{
        not swapfile_stat.stat.exists or
        swapfile_stat.stat.size | int != swapfile_size_bytes | int or
        (
          (
            swapfile_proxmox_policy | bool or
            swapfile_findmnt.stdout | default('') | trim == 'btrfs'
          ) and 'C' not in swapfile_attr_flags
        )
      }}
    swapfile_fstype: "{{ swapfile_findmnt.stdout | default('') | trim }}"
  vars:
    swapfile_attr_flags: >-
      {{ swapfile_attributes.stdout.split()[0]
         if swapfile_attributes.stdout is defined else '' }}
  when: swapfile_enabled | bool

- name: Remove invalid swapfile
  when:
    - swapfile_enabled | bool
    - swapfile_recreate
    - swapfile_proxmox_policy | bool or not ansible_check_mode
  block:
    - name: Disable swapfile
      ansible.builtin.command:
        argv:
          - swapoff
          - "{{ swapfile_path }}"
      failed_when: false
      changed_when: false

    - name: Remove swapfile
      ansible.builtin.file:
        path: "{{ swapfile_path }}"
        state: absent

- name: Create swapfile
  when:
    - swapfile_enabled | bool
    - swapfile_recreate
    - swapfile_proxmox_policy | bool or not ansible_check_mode
  block:
    - name: Create empty swapfile
      ansible.builtin.file:
        path: "{{ swapfile_path }}"
        state: touch
        owner: root
        group: root
        mode: "0600"

    - name: Set BTRFS NoCOW attribute
      ansible.builtin.command:
        argv:
          - chattr
          - +C
          - "{{ swapfile_path }}"
      changed_when: false
      when: swapfile_proxmox_policy | bool or swapfile_fstype == 'btrfs'

    - name: Allocate swapfile
      ansible.builtin.command:
        argv:
          - fallocate
          - -l
          - "{{ swapfile_size }}"
          - "{{ swapfile_path }}"
      changed_when: not (swapfile_proxmox_policy | bool)

    - name: Format swapfile
      ansible.builtin.command:
        argv:
          - mkswap
          - "{{ swapfile_path }}"
      changed_when: not (swapfile_proxmox_policy | bool)

- name: Activate swapfile before persisting it
  ansible.builtin.import_tasks: activate.yml
  when: not swapfile_proxmox_policy | bool

- name: Ensure swapfile persists
  ansible.posix.mount:
    path: none
    src: "{{ swapfile_path }}"
    fstype: swap
    opts: sw
    state: present
  when: swapfile_enabled | bool

- name: Activate swapfile after persisting it
  ansible.builtin.import_tasks: activate.yml
  when: swapfile_proxmox_policy | bool

- name: Configure vm.swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swapfile_swappiness }}"
    sysctl_file: /etc/sysctl.d/99-swappiness.conf
    sysctl_set: true
    reload: true
    state: present
  when:
    - swapfile_enabled | bool
    - not swapfile_proxmox_policy | bool
    - not ansible_check_mode

- name: Configure deferred Proxmox vm.swappiness
  ansible.builtin.copy:
    content: "vm.swappiness={{ swapfile_swappiness }}\n"
    dest: /etc/sysctl.d/99-swappiness.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - swapfile_enabled | bool
    - swapfile_proxmox_policy | bool
  notify: Apply swapfile sysctl
