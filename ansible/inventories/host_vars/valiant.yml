---
common_user: "{{ ansible_user }}"

# Keep interactive playbook runs from doing a full dist-upgrade.
common_run_upgrade: false
common_enable_unattended_upgrades: true
common_unattended_upgrades_auto_reboot: false
common_unattended_upgrades_reboot_time: "06:00"
common_enable_fstrim: true
common_manage_journald: true
common_journald_system_max_use: 1G
common_journald_system_keep_free: 2G
common_journald_system_max_file_size: 128M
common_journald_max_retention_sec: 30day
common_journald_max_file_sec: 1week

docker_install_enabled: false

common_apparmor_disabled_profiles:
  - wg-quick
  - wg
common_apparmor_containerd_stacked_signals: true

k3s_iface: enx6c1ff7c01df8
k3s_storage_mode: manual
k3s_storage_expected_uuid: a60a7437-c536-473f-80be-1a8ea264b219
k3s_allow_workloads: true
k3s_node_labels:
  homelab.lan/cpu-vendor: amd
  homelab.lan/role: general
  homelab.lan/runtime: baremetal
  topology.kubernetes.io/zone: valiant

# Enable Homebrew installation on this host
homebrew_install_enabled: true
homebrew_taps: [ublue-os/tap]
homebrew_casks: [ublue-os/tap/asusctl-linux]
homebrew_auto_update_enabled: true
homebrew_auto_update_services: [asusd.service, asus-shutdown.service]

swapfile_enabled: false

ssh_hardening_sshd_settings:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  ChallengeResponseAuthentication: "no"
  UsePAM: "yes"

host_power_backend: none
nodejs_runtime_install_enabled: true
common_kernel_params_add: [crashkernel=0]
headless_laptop_battery_charge_limit: 60
headless_laptop_asus_quiet_fan_policy_enabled: false
headless_laptop_asusd_enabled: true
host_hardware_extra_packages: [nvtop]
common_extra_packages:
  # System diagnostics
  - htop
  - btop
  - sysstat
  - iotop
  - iftop
  - nethogs
  - lsof
  - strace
  - pciutils
  - usbutils
  - dmidecode
  - ethtool

  # Storage diagnostics
  - smartmontools
  - nvme-cli

  # Network/debug tooling
  - bind9-dnsutils
  - iperf3
  - mtr-tiny
  - tcpdump
  - net-tools

  # Developer/build tooling
  - git
  - build-essential
  - pkg-config
  - cmake
  - ninja-build
  - python3-venv
  - python3-pip
  - pipx
  - unzip
  - jq
  - yq
  - ripgrep
  - fd-find
  - gh

  # Remote/admin convenience
  - tmux
  - tree
  - rsync
  - restic

  # Performance profiling
  - linux-tools-generic
  - linux-cloud-tools-generic
  - perf-tools-unstable

  # Host firewall tooling
  - ufw

  # Laptop telemetry and power tooling
  - fastfetch
host_hardware_gpu_users:
  - "{{ ansible_user }}"
