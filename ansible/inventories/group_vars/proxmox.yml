---
# Common role overrides for Proxmox hosts.
common_user: "{{ ansible_user | default('root') }}"

common_enable_unattended_upgrades: false
common_unattended_upgrades_auto_reboot: false
common_run_upgrade: true

# Disable fstrim timer on Proxmox hosts (storage-specific).
common_enable_fstrim: false

proxmox_zfs_thin_enforce: true

common_packages:
  - htop
  - iftop
  - iperf3
  - fastfetch
  - lm-sensors
  - starship
  - vim
  - git
  - linux-cpupower
  - powertop
  - mokutil

# Allow root login with keys for Proxmox, but disable passwords.
ssh_hardening_sshd_settings:
  PermitRootLogin: "prohibit-password"
  PasswordAuthentication: "no"

# pmxcfs owns root's cluster-authorized keys; do not replace them with admin keys.
ssh_hardening_authorized_keys: []

# Kernel parameters applied to all Proxmox hosts.
proxmox_kernel_params_base_add:
  - "pcie_aspm=force"
  - "nmi_watchdog=0"
  - "nowatchdog"

proxmox_kernel_params_base_remove: []

proxmox_corefreq_enabled: false

# Shared Unraid Proxmox storage mounted over NFS via roles/proxmox.
# pve2 overrides the NFS server in its host_vars for its host-only path.
proxmox_unraid_nfs_enabled: true

# Email notifications via the PVE notification system (SMTP endpoint applied
# through pvesh). The encrypted values are documented in ansible/secrets/README.md.
proxmox_notifications_enabled: true

# This cluster routes issue notifications exclusively through the managed SMTP
# matcher and has intentionally migrated all backup jobs to that system.
proxmox_notifications_disable_default_matcher: true
proxmox_notifications_migrate_backup_jobs: true
