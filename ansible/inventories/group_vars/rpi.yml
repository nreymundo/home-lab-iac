---
# Common role overrides for Raspberry Pi hosts. Full list in roles/common/defaults/main.yml.
common_user: "{{ ansible_user | default('pi') }}"

# Preserve the Debian/Raspberry Pi OS origins previously provided by common.
common_unattended_upgrades_origins:
  - "origin=Debian,codename=${distro_codename},label=Debian"
  - "origin=Debian,codename=${distro_codename},label=Debian-Security"
  - "origin=Raspbian,codename=${distro_codename},label=Raspbian"
  - "origin=Raspberry Pi Foundation,codename=${distro_codename},label=Raspberry Pi Foundation"

# Packages installed on every Raspberry Pi host (list replaces role defaults).
common_packages:
  - curl
  - vim
  - git
  - htop
  - wireless-tools

# SSH daemon hardening applied to all Pi hosts.
ssh_hardening_sshd_settings:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  ChallengeResponseAuthentication: "no"
  UsePAM: "yes"

# Ensure Ansible uses the desired interpreter on Raspberry Pi hosts.
ansible_python_interpreter: /usr/bin/python3
