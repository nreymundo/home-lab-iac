# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: garage
services:
  garage:
    image: junkerderprovinz/garage:latest
    container_name: garage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "-o", "/dev/null", "http://127.0.0.1:3903/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      garage_lan:
        ipv4_address: 192.168.10.71
    environment:
      DB_ENGINE: lmdb
      PUID: "99"
      PGID: "100"
      S3_REGION: garage
    volumes:
      - /mnt/apps/appdata/garage/config:/config
      - /mnt/user/s3/blocks:/var/lib/garage/data
      - /mnt/apps/appdata/garage/meta:/var/lib/garage/meta
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.icon: https://raw.githubusercontent.com/junkerderprovinz/garage/main/.github/assets/icon.png
      net.unraid.docker.webui: "http://[IP]:[PORT:3909]/"
networks:
  garage_lan:
    external: true
    name: br0
