# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: kopia
services:
  kopia:
    image: ghcr.io/imagegenius/kopia:latest
    container_name: kopia
    hostname: kopia
    network_mode: bridge
    restart: unless-stopped
    healthcheck:
      # The unauthenticated status request checks HTTP liveness, not repository health.
      test:
        - CMD-SHELL
        - >-
          code=$$(curl -sS --max-time 4 -o /dev/null -w '%{http_code}'
          http://127.0.0.1:51515/api/v1/repo/status) && [ "$$code" = 401 ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "51515:51515"
    environment:
      PUID: "99"
      PGID: "100"
      TZ: Europe/Berlin
      UMASK: "022"
      KOPIA_PERSIST_CREDENTIALS_ON_CONNECT: "true"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    pids_limit: 2048
    logging:
      driver: json-file
      options:
        max-file: "1"
        max-size: 50m
    volumes:
      - /mnt/apps/appdata/kopia:/config
      - /mnt/apps/appdata/kopia/cache:/cache
      - /mnt/user:/source
      - /mnt/apps/appdata/kopia/backups:/backups
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.icon: https://raw.githubusercontent.com/imagegenius/templates/main/unraid/img/kopia.png
      net.unraid.docker.webui: "http://[IP]:[PORT:51515]/"
